[package]
name = "bobix_push"
version = "0.1.0"
edition = "2021"
# File::lock (the one lock both processes use) is stable from 1.89.
rust-version = "1.89"
license = "MIT"
publish = false
description = "What the phone's notification extensions share with the app: the receive state under a file lock, the notice opener and the push grant. A thin UniFFI layer over bobix-link."

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
bobix-link = { path = "../../crates/bobix-link" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32"

[features]
# Only the binding generator needs the command line.
cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[profile.release]
# The extension has little memory and this library is linked into it: size over speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"

[dev-dependencies]
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "chacha20"] }
