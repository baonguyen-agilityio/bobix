name: phone
description: "Bobix on your phone: answer a waiting Claude Code request from your pocket, end-to-end encrypted through your own relay."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.7

dependencies:
  bobix_phone_core:
    path: rust_builder
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_riverpod: ^3.5.0
  flutter_rust_bridge: 2.13.0
  flutter_svg: ^2.4.0
  freezed_annotation: ^3.1.0
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  web_socket_channel: ^3.0.3
  markdown: ^7.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: ^3.0.8
  integration_test:
    sdk: flutter
  freezed: ^4.0.3
  build_runner: ^2.17.1
  pointycastle: ^4.0.0

flutter:
  uses-material-design: true
