[package]
name = "bobix-link"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Wire format and crypto shared by the Bobix desktop app, the relay and the phone app"
publish = false

[dependencies]
# ChaChaBox is XChaCha20-Poly1305; the default feature (salsa20) would give SalsaBox instead.
curve25519-dalek = "4"
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "chacha20"] }
ed25519-dalek = "2"
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
getrandom = "0.2"
base64 = "0.22"
zeroize = "1"

[dev-dependencies]
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "chacha20"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# The fake tools share their code through examples/common and are exercised in-process by tests/fakes.rs.
[[example]]
name = "fake-phone"
path = "examples/fake-phone.rs"

[[example]]
name = "fake-desktop"
path = "examples/fake-desktop.rs"

[[example]]
name = "relay-stub"
path = "examples/relay-stub.rs"
