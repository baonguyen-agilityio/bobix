[package]
name = "bobix"
version = "0.0.0" # the app's version comes from package.json (tauri.conf.json)
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["sync", "net", "time", "rt", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fancy-regex = "0.14"
indexmap = "2"
getrandom = "0.3"
tauri-plugin-opener = "2"
percent-encoding = "2"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-dialog = "2"
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }
gtk = "0.18" # the same GTK as Tauri: the overlay's input shape
gdkx11 = "0.18" # the X server's time, so GNOME brings the panel forward (panel.rs, focus)

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
