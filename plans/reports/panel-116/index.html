<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bobix Panel Prototype</title>
<style>
/* ===== Tokens. Light is the base; dark follows the system, or data-theme forces either. ===== */
:root, .theme-light {
  color-scheme: light;
  --bg: oklch(97.4% 0.004 262);
  --glow: oklch(66% 0.175 33 / .07);
  --sidebar: oklch(94.6% 0.006 262 / .72);
  --surface: oklch(99.6% 0.001 262);
  --surface-2: oklch(96.6% 0.004 262);
  --surface-3: oklch(93.6% 0.007 262);
  --line: oklch(25% 0.02 262 / .10);
  --line-strong: oklch(25% 0.02 262 / .17);
  --ink: oklch(22% 0.02 264);
  --ink-2: oklch(40% 0.02 264);
  --ink-3: oklch(51% 0.018 264);
  --accent: oklch(66% 0.175 33);          /* Bobix coral, the same value as src/ui/theme.css --coral */
  --accent-ink: oklch(50% 0.16 33);
  --accent-bg: oklch(66% 0.175 33 / .12);
  --accent-solid: oklch(55% 0.17 33);
  --on-accent: oklch(99% 0.005 33);
  --ok: oklch(52% 0.13 155);   --ok-bg: oklch(60% 0.13 155 / .13);
  --warn: oklch(52% 0.12 70);  --warn-bg: oklch(78% 0.14 80 / .20); --warn-line: oklch(72% 0.14 75);
  --info: oklch(52% 0.15 255); --info-bg: oklch(60% 0.14 255 / .12);
  --err: oklch(52% 0.19 15);   --err-bg: oklch(60% 0.19 15 / .11);
  --c-ctx: oklch(68% 0.07 255);
  --c-in: oklch(84% 0.035 255);
  --c-out: var(--accent);
  --c-usual: oklch(40% 0.02 264);
  --pop: 0 1px 2px oklch(20% 0.02 262 / .06), 0 16px 48px oklch(20% 0.02 262 / .16);
  --scrim: oklch(25% 0.02 262 / .28);
}
:root[data-theme="dark"], .theme-dark {
  color-scheme: dark;
  --bg: oklch(16.4% 0.006 265);
  --glow: oklch(66% 0.175 33 / .06);
  --sidebar: oklch(19% 0.008 265 / .66);
  --surface: oklch(20.4% 0.007 265);
  --surface-2: oklch(23.8% 0.008 265);
  --surface-3: oklch(27.4% 0.01 265);
  --line: oklch(100% 0 0 / .075);
  --line-strong: oklch(100% 0 0 / .13);
  --ink: oklch(95% 0.004 265);
  --ink-2: oklch(80% 0.008 265);
  --ink-3: oklch(66% 0.012 265);
  --accent-ink: oklch(77% 0.13 33);
  --accent-bg: oklch(66% 0.175 33 / .16);
  --accent-solid: oklch(68% 0.17 33);
  --on-accent: oklch(17% 0.03 33);
  --ok: oklch(76% 0.14 155);   --ok-bg: oklch(70% 0.14 155 / .14);
  --warn: oklch(84% 0.13 82);  --warn-bg: oklch(80% 0.14 80 / .13); --warn-line: oklch(78% 0.14 78);
  --info: oklch(75% 0.12 255); --info-bg: oklch(70% 0.12 255 / .15);
  --err: oklch(72% 0.17 18);   --err-bg: oklch(70% 0.17 18 / .14);
  --c-ctx: oklch(60% 0.08 255);
  --c-in: oklch(42% 0.04 255);
  --c-usual: oklch(82% 0.01 265);
  --pop: 0 0 0 1px oklch(100% 0 0 / .06), 0 24px 64px oklch(0% 0 0 / .55);
  --scrim: oklch(0% 0 0 / .45);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: oklch(16.4% 0.006 265); --glow: oklch(66% 0.175 33 / .06); --sidebar: oklch(19% 0.008 265 / .66);
    --surface: oklch(20.4% 0.007 265); --surface-2: oklch(23.8% 0.008 265); --surface-3: oklch(27.4% 0.01 265);
    --line: oklch(100% 0 0 / .075); --line-strong: oklch(100% 0 0 / .13);
    --ink: oklch(95% 0.004 265); --ink-2: oklch(80% 0.008 265); --ink-3: oklch(66% 0.012 265);
    --accent-ink: oklch(77% 0.13 33); --accent-bg: oklch(66% 0.175 33 / .16); --accent-solid: oklch(68% 0.17 33); --on-accent: oklch(17% 0.03 33);
    --ok: oklch(76% 0.14 155); --ok-bg: oklch(70% 0.14 155 / .14);
    --warn: oklch(84% 0.13 82); --warn-bg: oklch(80% 0.14 80 / .13); --warn-line: oklch(78% 0.14 78);
    --info: oklch(75% 0.12 255); --info-bg: oklch(70% 0.12 255 / .15);
    --err: oklch(72% 0.17 18); --err-bg: oklch(70% 0.17 18 / .14);
    --c-ctx: oklch(60% 0.08 255); --c-in: oklch(42% 0.04 255); --c-usual: oklch(82% 0.01 265);
    --pop: 0 0 0 1px oklch(100% 0 0 / .06), 0 24px 64px oklch(0% 0 0 / .55); --scrim: oklch(0% 0 0 / .45);
  }
}
:root {
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --t-11: 11px; --t-12: 12px; --t-13: 13px; --t-15: 15px; --t-20: 20px; --t-28: 28px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --r-sm: 5px; --r-md: 8px; --r-lg: 12px;
  --row: 36px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --side: 220px;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: var(--t-13)/1.45 var(--f-ui); color: var(--ink); -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 500px at 0% 0%, var(--glow), transparent 70%), var(--bg);
  background-attachment: fixed; min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
code, .mono { font-family: var(--f-mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.005em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ===== Shell ===== */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: var(--s1);
  padding: var(--s3) var(--s2); border-right: 1px solid var(--line);
  background: var(--sidebar); backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
}
.brand { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) var(--s2) var(--s3); font-weight: 600; }
.brand .av { width: 22px; height: 22px; }
.brand small { margin-left: auto; font-weight: 500; }
.find {
  display: flex; align-items: center; gap: var(--s2); width: 100%; height: 30px; padding: 0 var(--s2);
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink-3); text-align: left;
  margin-bottom: var(--s2);
}
.find .lab { flex: 1; white-space: nowrap; }
.nav-h { padding: var(--s3) var(--s2) var(--s1); font-size: var(--t-11); color: var(--ink-3); font-weight: 500; }
.nav a {
  display: flex; align-items: center; gap: var(--s2); height: 30px; padding: 0 var(--s2); border-radius: var(--r-md);
  color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav a:hover { background: var(--surface-3); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--surface-3); color: var(--ink); }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav a .cnt { margin-left: auto; font-size: var(--t-11); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.nav a .cnt.hot { color: var(--on-accent); background: var(--accent-solid); border-radius: 999px; padding: 0 6px; line-height: 17px; font-weight: 600; }
.nav a.later { color: var(--ink-3); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--s2); padding: var(--s2); }
.seg { display: flex; padding: 2px; gap: 2px; border-radius: var(--r-md); background: var(--surface-3); }
.seg button { flex: 1; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-3); font-size: var(--t-12); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px oklch(0% 0 0 / .12); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--s3); height: 48px; padding: 0 var(--s6);
  border-bottom: 1px solid var(--line); background: color-mix(in oklch, var(--bg) 78%, transparent);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
}
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; font-size: var(--t-13); }
.crumb a { color: var(--ink-3); text-decoration: none; font-weight: 500; }
.crumb a:hover { color: var(--ink); }
.crumb .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .sp { flex: 1; }
.sample { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px dashed var(--line-strong); color: var(--ink-3); font-size: var(--t-11); font-weight: 500; white-space: nowrap; }
.top .mini { display: none; }
.content { width: 100%; max-width: 1120px; margin: 0 auto; padding: var(--s6) var(--s6) 64px; display: flex; flex-direction: column; gap: var(--s6); }

/* ===== Components ===== */
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; border: 1px solid var(--line-strong); border-bottom-width: 2px; color: var(--ink-3); font: 500 var(--t-11)/1 var(--f-ui); background: var(--surface); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; font-size: var(--t-12); white-space: nowrap; transition: background .15s var(--ease); }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent-solid); border-color: transparent; color: var(--on-accent); }
.btn.pri:hover { background: color-mix(in oklch, var(--accent-solid) 88%, var(--ink)); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.danger { color: var(--err); }
.btn.sm { height: 24px; padding: 0 8px; }
.btn .kbd { height: 16px; min-width: 16px; font-size: 10px; border-bottom-width: 1px; background: transparent; }
.btn.pri .kbd { color: inherit; border-color: color-mix(in oklch, var(--on-accent) 40%, transparent); }
.lnk { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; text-decoration: none; cursor: pointer; }
.lnk:hover { text-decoration: underline; }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 4px; font-size: var(--t-11); font-weight: 500; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.badge.accent { background: var(--accent-bg); color: var(--accent-ink); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.err { background: var(--err-bg); color: var(--err); }
.badge.line { background: transparent; border: 1px solid var(--line-strong); }
.model { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-strong); font-size: var(--t-11); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.model i { width: 6px; height: 6px; border-radius: 2px; background: var(--m); }
.model.opus { --m: oklch(62% 0.13 300); } .model.sonnet { --m: oklch(64% 0.11 230); } .model.haiku { --m: oklch(70% 0.11 160); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink-3); }
.dot.working { background: var(--info); }
.dot.waiting { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.dot.done { background: var(--ok); }
.dot.idle { background: transparent; border: 1.5px solid var(--ink-3); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-12); color: var(--ink-2); white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.card-h { display: flex; align-items: center; gap: var(--s2); min-height: 40px; padding: var(--s2) var(--s3) var(--s2) var(--s4); border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: var(--t-13); }
.card-h .meta { margin-left: auto; color: var(--ink-3); font-size: var(--t-12); display: flex; align-items: center; gap: var(--s2); }
.card-b { padding: var(--s4); }
.sec-h { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; }
.sec-h h1 { font-size: var(--t-20); }
.sec-h p { margin: 0; color: var(--ink-3); }
.note { color: var(--ink-3); font-size: var(--t-12); margin: 0; }

/* list rows: avatar · text · meta (right-aligned) */
.list { list-style: none; margin: 0; padding: var(--s1); }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s3);
  min-height: var(--row); padding: 6px var(--s2); border-radius: var(--r-md); color: inherit; text-decoration: none;
}
a.row:hover, .row.sel { background: var(--surface-2); }
.row .ttl { display: flex; align-items: center; gap: var(--s2); min-width: 0; font-weight: 500; }
.row .ttl span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--ink-3); font-size: var(--t-12); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rmeta { display: flex; align-items: center; gap: var(--s3); justify-content: flex-end; color: var(--ink-3); font-size: var(--t-12); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .rmeta .w { min-width: 56px; text-align: right; }
.av { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; background: var(--surface-3); flex: none; }
.av svg { image-rendering: pixelated; }
.av.lg { width: 48px; height: 48px; border-radius: 12px; }
.av.xs { width: 20px; height: 20px; border-radius: 5px; }
.hot { color: var(--accent-ink); font-weight: 600; }

/* approvals */
.ask { grid-template-columns: auto minmax(0, 1fr) auto auto; }
.ask .cmd { font-family: var(--f-mono); font-size: var(--t-12); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask .acts { display: flex; gap: 6px; }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.tile { background: var(--surface); padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: 2px; min-width: 0; color: inherit; text-decoration: none; }
a.tile:hover { background: var(--surface-2); }
.tile .k { color: var(--ink-3); font-size: var(--t-12); display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: var(--t-28); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile .v small { font-size: var(--t-13); font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.tile .d { color: var(--ink-3); font-size: var(--t-12); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--s4); align-items: start; }
.col { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }

/* warnings */
.warn-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); padding: var(--s3) var(--s4); border-top: 1px solid var(--line); }
.warn-row:first-child { border-top: 0; }
.warn-row .ic { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--warn-bg); color: var(--warn); }
.warn-row .ic.info { background: var(--info-bg); color: var(--info); }
.warn-row p { margin: 0; }
.warn-row .why { color: var(--ink-3); font-size: var(--t-12); margin-top: 2px; }
.warn-row .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); }
.warn-row .x { margin-left: auto; }

/* usage */
.big { display: flex; align-items: baseline; gap: var(--s2); flex-wrap: wrap; }
.big b { font-size: 34px; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.big span { color: var(--ink-2); }
.split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin: var(--s3) 0 var(--s2); }
.split i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); font-size: var(--t-12); color: var(--ink-2); list-style: none; margin: 0; padding: 0; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend li b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.sw { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.sw.dash { height: 0; width: 12px; border-top: 2px dashed var(--c-usual); border-radius: 0; }
.chart { position: relative; margin-top: var(--s3); }
.chart svg { display: block; width: 100%; height: 120px; overflow: visible; }
.chart .ax { display: flex; justify-content: space-between; color: var(--ink-3); font-size: var(--t-11); margin-top: 6px; font-variant-numeric: tabular-nums; }
.chart .mark { position: absolute; top: 0; bottom: 18px; border-left: 1px dashed var(--c-usual); }
.chart .mark span { position: absolute; left: 6px; top: -2px; font-size: var(--t-11); color: var(--ink-2); white-space: nowrap; background: var(--surface); padding: 0 4px; border-radius: 3px; }
.hr { height: 1px; background: var(--line); margin: var(--s4) 0; border: 0; }

/* session detail */
.head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: start; }
.head h1 { font-size: var(--t-20); }
.head .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--s3); margin-top: 6px; color: var(--ink-3); font-size: var(--t-12); }
.head .facts > span { display: inline-flex; align-items: center; gap: 6px; }
.head .acts { display: flex; gap: 6px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 0 var(--s4); margin: 0; }
.kv > * { padding: 7px 0; border-top: 1px solid var(--line); min-width: 0; }
.kv > :nth-child(-n+3) { border-top: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.kv .r { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.log { list-style: none; margin: 0; padding: 0; position: relative; }
.log li { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: var(--s3); padding: 7px 0; }
.log li::before { content: ""; position: absolute; left: 9.5px; top: 26px; bottom: -7px; width: 1px; background: var(--line-strong); }
.log li:last-child::before { display: none; }
.log .mk { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink-3); position: relative; z-index: 1; }
.log .mk svg { width: 12px; height: 12px; stroke-width: 2.2; }
.log .done .mk { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.log .now .mk { border-color: var(--info); color: var(--info); }
.log .now .mk::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--info); }
.log .assume .mk { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.log .plan .mk { background: var(--surface-3); border-color: transparent; color: var(--ink-2); }
.log .t { min-width: 0; }
.log .t p { margin: 0; }
.log .t .why { color: var(--ink-3); font-size: var(--t-12); margin-top: 2px; }
.log .when { color: var(--ink-3); font-size: var(--t-12); font-variant-numeric: tabular-nums; white-space: nowrap; }
.log .assume .t { background: var(--warn-bg); border-left: 2px solid var(--warn-line); border-radius: 0 var(--r-md) var(--r-md) 0; padding: 6px var(--s3); margin: -4px 0; }
.log .todo .t p { color: var(--ink-3); }
.log .lbl { font-size: var(--t-11); font-weight: 600; color: var(--ink-3); letter-spacing: .02em; text-transform: uppercase; margin-bottom: 2px; }
.log .assume .lbl { color: var(--warn); }
.result { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); margin-top: var(--s3); }
.result.blocked { background: var(--err-bg); border-color: transparent; }
.result.blocked .ic { color: var(--err); }
.result.done { background: var(--ok-bg); border-color: transparent; }
.result.done .ic { color: var(--ok); }
.result p { margin: 0; }

/* skills */
.toolbar { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); }
.chip { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--ink-2); font-size: var(--t-12); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: transparent; }
.chip .n { color: inherit; opacity: .7; font-variant-numeric: tabular-nums; }
.search { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-3); margin-left: auto; min-width: 0; }
.search input { border: 0; outline: 0; background: transparent; width: 160px; min-width: 0; color: var(--ink); font-size: var(--t-12); }
select.sel { height: 28px; padding: 0 28px 0 10px; border-radius: var(--r-md); border: 1px solid var(--line-strong); background: var(--surface); font-weight: 500; font-size: var(--t-12); appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 13px) 12px, calc(100% - 9px) 12px; background-size: 4px 4px; background-repeat: no-repeat; }
table.t { width: 100%; border-collapse: collapse; font-size: var(--t-12); }
.t th { text-align: left; font-weight: 500; color: var(--ink-3); padding: 0 var(--s3); height: 32px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t td { padding: 0 var(--s3); height: 38px; white-space: nowrap; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: var(--surface-2); }
.t tr.off td { opacity: .5; }
.t .r { text-align: right; font-variant-numeric: tabular-nums; }
.t .nm { font-family: var(--f-mono); font-weight: 500; color: var(--ink); }
.t .ds { color: var(--ink-3); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t .fl { display: flex; gap: 4px; }
.t .fl-n { display: none; margin-top: 4px; }
.t .acts { display: flex; gap: 4px; justify-content: flex-end; }
.t input[type=checkbox], .bulk input[type=checkbox] { accent-color: var(--accent-solid); width: 14px; height: 14px; margin: 0; }
.bar { display: inline-block; vertical-align: middle; height: 4px; border-radius: 2px; background: var(--surface-3); width: 48px; overflow: hidden; margin-right: 6px; }
.bar i { display: block; height: 100%; background: var(--ink-3); }
.bar.big i { background: var(--warn-line); }
.bulk { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); background: var(--accent-bg); border-bottom: 1px solid var(--line); font-weight: 500; }
.more-row { padding: var(--s2) var(--s3); color: var(--ink-3); font-size: var(--t-12); border-top: 1px solid var(--line); display: flex; align-items: center; gap: var(--s2); }
.dup { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s2) var(--s4); align-items: center; padding: var(--s3) var(--s4); border-top: 1px solid var(--line); }
.dup:first-of-type { border-top: 0; }
.dup p { margin: 0; }
.dup .pairs { color: var(--ink-3); font-size: var(--t-12); margin-top: 4px; font-family: var(--f-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dup .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
pre.rules { margin: 0; padding: var(--s4); font: var(--t-12)/1.6 var(--f-mono); color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-md); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
pre.rules b { color: var(--ink); font-weight: 600; }
pre.rules .add { display: block; color: var(--ok); }

/* empty state */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); padding: var(--s8) var(--s4); color: var(--ink-3); }
.empty .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); margin-bottom: var(--s1); }
.empty h3 { color: var(--ink); font-size: var(--t-15); }
.empty p { margin: 0; max-width: 360px; }

/* command bar */
.cmdk-scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: none; align-items: flex-start; justify-content: center; padding: 12vh var(--s4) var(--s4); }
.cmdk-scrim.open { display: flex; animation: fade .12s var(--ease); }
.cmdk { width: min(640px, 100%); border-radius: 14px; overflow: hidden; background: color-mix(in oklch, var(--surface) 88%, transparent); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6); box-shadow: var(--pop); border: 1px solid var(--line); animation: rise .16s var(--ease); }
.cmdk .in { display: flex; align-items: center; gap: var(--s3); height: 52px; padding: 0 var(--s4); border-bottom: 1px solid var(--line); color: var(--ink-3); }
.cmdk .in input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: var(--t-15); color: var(--ink); }
.cmdk .res { max-height: min(420px, 56vh); overflow: auto; padding: var(--s1) var(--s2) var(--s2); }
.cmdk .grp { padding: var(--s2) var(--s2) var(--s1); font-size: var(--t-11); color: var(--ink-3); font-weight: 500; }
.cmdk .it { display: flex; align-items: center; gap: var(--s3); height: 38px; padding: 0 var(--s2); border-radius: var(--r-md); cursor: pointer; }
.cmdk .it .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmdk .it .lab small { color: var(--ink-3); margin-left: 6px; }
.cmdk .it .hint { color: var(--ink-3); font-size: var(--t-12); display: flex; gap: 3px; }
.cmdk .it[aria-selected="true"] { background: var(--accent-bg); }
.cmdk .it[aria-selected="true"] .lab { color: var(--ink); }
.cmdk .it > svg { color: var(--ink-3); }
.cmdk .ft { display: flex; align-items: center; gap: var(--s4); height: 38px; padding: 0 var(--s4); border-top: 1px solid var(--line); color: var(--ink-3); font-size: var(--t-12); }
.cmdk .ft span { display: inline-flex; align-items: center; gap: 4px; }
.cmdk .ft .av { margin-right: auto; }
.cmdk.static { animation: none; box-shadow: none; width: 100%; }
.cmdk.static .res { max-height: none; }

/* sheet (confirm) */
.sheet-scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: none; align-items: center; justify-content: center; padding: var(--s4); }
.sheet-scrim.open { display: flex; animation: fade .12s var(--ease); }
.sheet { width: min(480px, 100%); background: var(--surface); border-radius: 14px; box-shadow: var(--pop); border: 1px solid var(--line); padding: var(--s5); display: flex; flex-direction: column; gap: var(--s3); animation: rise .16s var(--ease); }
.sheet h2 { font-size: var(--t-15); }
.sheet .acts { display: flex; justify-content: flex-end; gap: var(--s2); margin-top: var(--s2); }

/* toasts */
.toasts { position: fixed; z-index: 70; right: var(--s5); bottom: var(--s5); display: flex; flex-direction: column; gap: var(--s2); align-items: flex-end; }
.toast { display: flex; align-items: center; gap: var(--s3); min-height: 40px; padding: 6px 6px 6px var(--s4); border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: var(--pop); font-weight: 500; max-width: min(440px, calc(100vw - 32px)); animation: rise .18s var(--ease); }
.toast .btn { background: transparent; color: inherit; border-color: color-mix(in oklch, var(--bg) 30%, transparent); }
.toast .btn .kbd { color: inherit; border-color: color-mix(in oklch, var(--bg) 35%, transparent); }
.toast.static { animation: none; box-shadow: none; }

/* design system page */
.ds-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); align-items: start; }
.tok { display: grid; grid-template-columns: minmax(0, 1fr) 64px 64px; gap: 0 var(--s2); align-items: center; font-size: var(--t-12); }
.tok > * { padding: 5px 0; border-top: 1px solid var(--line); }
.tok > :nth-child(-n+3) { border-top: 0; color: var(--ink-3); }
.tok code { color: var(--ink); }
.tok .s { height: 22px; border-radius: 5px; border: 1px solid var(--line); background: var(--v); }
.types > div { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: baseline; gap: var(--s3); padding: 6px 0; border-top: 1px solid var(--line); }
.types > div:first-child { border-top: 0; }
.types code { color: var(--ink-3); font-size: var(--t-11); }
.space { display: flex; flex-direction: column; gap: 6px; }
.space div { display: flex; align-items: center; gap: var(--s3); font-size: var(--t-12); color: var(--ink-3); }
.space i { display: block; height: 10px; background: var(--accent); border-radius: 2px; opacity: .8; }
.specimen { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.pair { display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); }
.pair > div { background: var(--bg); color: var(--ink); padding: var(--s3); }

/* bottom tab bar (narrow only) */
.tabbar { display: none; }

@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.99); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 1400px) { .t .c-ds { display: none; } }
@media (max-width: 1000px) {
  .grid2, .ds-grid { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .t .c-set, .t .c-uses { display: none; }
}
/* narrow: no sidebar, a bottom tab bar, rows stack their meta, touch-size targets */
@media (max-width: 720px) {
  :root { --row: 44px; }
  body { font-size: 14px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .top { padding: 0 var(--s4); height: 52px; }
  .top .mini { display: inline-flex; }
  .top .sample .long { display: none; }
  .content { padding: var(--s4) var(--s4) calc(76px + env(safe-area-inset-bottom)); gap: var(--s4); }
  .btn { height: 34px; padding: 0 12px; font-size: 13px; }
  .btn.sm { height: 30px; }
  .btn .kbd, .find .kbd, .cmdk .it .hint, .cmdk .ft span:not(.keep) { display: none; }
  .row { grid-template-columns: auto minmax(0, 1fr); }
  .row .rmeta { grid-column: 2; justify-content: flex-start; flex-wrap: wrap; gap: var(--s2); }
  .row .rmeta .w { min-width: 0; text-align: left; }
  .ask { grid-template-columns: auto minmax(0, 1fr); }
  .ask .acts { grid-column: 2; }
  .tile .v { font-size: 24px; }
  .tile .d { white-space: normal; }
  .head { grid-template-columns: auto minmax(0, 1fr); }
  .head .acts { grid-column: 1 / -1; flex-wrap: wrap; }
  .kv { grid-template-columns: max-content minmax(0, 1fr); }
  .kv .r { display: none; }
  .kv > :nth-child(-n+3) { border-top: 1px solid var(--line); }
  .kv > :nth-child(-n+2) { border-top: 0; }
  .log li { grid-template-columns: 20px minmax(0, 1fr); }
  .log .when { grid-column: 2; }
  .result { grid-template-columns: auto minmax(0, 1fr); }
  .result .btn { grid-column: 2; justify-self: start; }
  .search { margin-left: 0; width: 100%; }
  .search input { width: 100%; }
  .t .c-ds, .t .c-last, .t .c-size { display: none; }
  .t td { height: 48px; padding: 8px 6px; }
  .t th { padding: 0 6px; }
  .t .c-fl { display: none; }
  .t .fl-n { display: flex; }
  .t .nm { overflow-wrap: anywhere; white-space: normal; }
  .t .fl { flex-wrap: wrap; }
  .dup { grid-template-columns: minmax(0, 1fr); }
  .dup .acts { justify-content: flex-start; }
  .tok { grid-template-columns: minmax(0, 1fr) 48px 48px; }
  .pair { grid-template-columns: 1fr; }
  .toasts { left: var(--s4); right: var(--s4); bottom: calc(72px + env(safe-area-inset-bottom)); align-items: stretch; }
  .tabbar {
    display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
    background: color-mix(in oklch, var(--bg) 82%, transparent); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  }
  .tabbar a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 52px; border-radius: var(--r-md); color: var(--ink-3); text-decoration: none; font-size: 11px; font-weight: 500; }
  .tabbar a[aria-current="page"] { color: var(--ink); }
  .tabbar a[aria-current="page"] svg { color: var(--accent); }
  .tabbar svg.i { width: 20px; height: 20px; }
  .tabbar .cnt { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent-solid); color: var(--on-accent); font-size: 10px; font-weight: 600; line-height: 16px; text-align: center; }
}
</style>
</head>

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Tokens per hour today against your usual day. Today is above usual from 9:00 on.">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line-strong)" vector-effect="non-scaling-stroke"/>${bars}
    <path d="${usual}" fill="none" stroke="var(--c-usual)" stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/></svg>
    <div class="ax"><span>08:00</span><span>12:00</span><span>16:00</span><span>21:00</span></div></div>`;
}
// Per-turn usage for a session: context re-read grows each turn; output stays small. Marker where your usual session ends.
function turnSeries(s) {
  const n = Math.max(6, Math.round(12 * s.usual)), out = [];
  let r = hashStr(s.id);
  const rnd = () => ((r = Math.imul(r ^ (r >>> 13), 1274126177) >>> 0) % 1000) / 1000;
  for (let i = 0; i < n; i++) out.push({ ctx: 16 + i * 4.1 + rnd() * 5, inp: 1 + rnd() * 3, out: .6 + rnd() * 4.8 });
  return out;
}
function turnChart(s) {
  const T = turnSeries(s), W = 400, H = 120, max = Math.max(...T.map(t => t.ctx + t.inp + t.out)) * 1.08, bw = W / T.length;
  let bars = '', outs = '';
  T.forEach((t, i) => {
    const x = i * bw + bw * .12, w = bw * .76; let y = H;
    for (const [v, c] of [[t.ctx, 'var(--c-ctx)'], [t.inp, 'var(--c-in)'], [t.out, 'var(--c-out)']]) { const h = v / max * H; y -= h; bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(2)}" fill="${c}"/>`; }
  });
  const omax = Math.max(...T.map(t => t.out)) * 1.15;
  outs = T.map((t, i) => `${i ? 'L' : 'M'}${(i * bw + bw / 2).toFixed(1)} ${(40 - t.out / omax * 40).toFixed(1)}`).join(' ');
  const usualAt = Math.min(100, 12 / T.length * 100);
  const totCtx = T.reduce((a, t) => a + t.ctx, 0), totIn = T.reduce((a, t) => a + t.inp, 0), totOut = T.reduce((a, t) => a + t.out, 0), all = totCtx + totIn + totOut;
  const pct = v => Math.round(v / all * 100);
  const k = v => v >= 1000 ? (v / 1000).toFixed(1) + 'M' : Math.round(v) + 'k';
  return `<ul class="legend"><li><span class="sw" style="background:var(--c-ctx)"></span>Re-reading context <b>${pct(totCtx)}%</b> · ${k(totCtx)}</li>
      <li><span class="sw" style="background:var(--c-in)"></span>New input <b>${pct(totIn)}%</b></li>
      <li><span class="sw" style="background:var(--c-out)"></span>Output <b>${pct(totOut)}%</b> · ${k(totOut)}</li></ul>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Tokens per turn over ${T.length} turns; context re-read grows each turn.">
      <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line-strong)" vector-effect="non-scaling-stroke"/>${bars}</svg>
      ${s.usual > 1 ? `<div class="mark" style="left:${usualAt}%"><span>Your usual session ends here</span></div>` : ''}
      <div class="ax"><span>Turn 1</span><span>${s.id === 's4' ? '19:00' : ''}</span><span>Turn ${T.length} · now</span></div></div>
    <p class="note" style="margin-top:var(--s4)">Output per turn (k tokens)</p>
    <div class="chart" style="margin-top:6px"><svg viewBox="0 0 ${W} 40" preserveAspectRatio="none" style="height:40px" role="img" aria-label="Output per turn stays between 0.6k and 5k tokens.">
      <path d="${outs}" fill="none" stroke="var(--c-out)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div>`;
}
const spark = (vals, cls = '') => { const max = Math.max(...vals, 1), W = 60, H = 16; return `<svg viewBox="0 0 ${W} ${H}" width="60" height="16" class="${cls}" aria-hidden="true"><path d="${vals.map((v, i) => `${i ? 'L' : 'M'}${(i / (vals.length - 1) * W).toFixed(1)} ${(H - 1 - v / max * (H - 2)).toFixed(1)}`).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`; };

  <section class="card" aria-labelledby="h-rule"><div class="card-h">${ic('i-cpu')}<h2 id="h-rule">When to split, which model</h2>
      <span class="meta">${ui.rulesAdded ? '<span class="badge ok">' + ic('i-check', 'style="width:11px;height:11px"') + 'In CLAUDE.md</span>' : 'Not in CLAUDE.md yet'}</span></div>
    <div class="card-b"><p class="note" style="margin-bottom:var(--s3)">A short rule block for this project’s <code>CLAUDE.md</code>, so each session splits work and picks a model the same way. Tuned later from your usage.</p>
      <pre class="rules">${ui.rulesAdded ? esc(RULES).split('\n').map(l => `<span class="add">+ ${l}</span>`).join('') : esc(RULES).replace(/^(## .*)$/m, '<b>$1</b>')}</pre>
      <div style="display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap">${ui.rulesAdded
        ? `<button class="btn" type="button" data-rules="undo">${ic('i-undo')}Remove from CLAUDE.md</button><span class="note" style="align-self:center">Backup: .bobix/backup/CLAUDE.md.2026-11-10T21-40</span>`
        : `<button class="btn pri" type="button" data-rules="add">Add to CLAUDE.md</button><button class="btn" type="button" data-act="copyRules">${ic('i-copy')}Copy</button>`}</div></div>
  </section>`;
}

const later = (h, issue, p) => `<div class="sec-h"><h1>${h}</h1><p>Not part of this prototype</p></div><section class="card">${empty(NAV.find(n => n[1] === h)[2], `${h} moves here when ${issue} ships`, p, '<a class="btn sm" href="#/overview">Back to Overview</a>')}</section>`;

function designSystem() {
  const toks = [['--bg', 'Window'], ['--surface', 'Panel'], ['--surface-2', 'Hover'], ['--surface-3', 'Selected'], ['--line', 'Hairline'], ['--ink', 'Text'], ['--ink-2', 'Text 2'], ['--ink-3', 'Text 3, meta'],
    ['--accent', 'Accent (Bobix coral)'], ['--accent-solid', 'Primary button'], ['--ok', 'Done'], ['--warn', 'Warning, assumption'], ['--info', 'Working'], ['--err', 'Blocked'], ['--c-ctx', 'Chart: re-read context'], ['--c-in', 'Chart: new input']];
  const sample = SESSIONS.slice(0, 4);
  return `<div class="sec-h"><h1>Design system</h1><p>Tokens and parts every screen is built from</p></div>
  <div class="ds-grid">
    <section class="card"><div class="card-h"><h2>Colour tokens</h2><span class="meta">light · dark</span></div><div class="card-b"><div class="tok"><span>Token</span><span>Light</span><span>Dark</span>
      ${toks.map(([t, l]) => `<span><code>${t}</code> <span style="color:var(--ink-3)">${l}</span></span><span class="s theme-light" style="--v:var(${t})"></span><span class="s theme-dark" style="--v:var(${t})"></span>`).join('')}</div>
      <p class="note" style="margin-top:var(--s3)">One accent: the coral the pets already use for “needs you”. Status colours appear only as small dots and badges, always with a word.</p></div></section>
    <div class="col">
      <section class="card"><div class="card-h"><h2>Type</h2><span class="meta">system font · tabular figures</span></div><div class="card-b types">
        <div><code>28 / 600</code><span style="font-size:28px;font-weight:600;letter-spacing:-.02em" class="num">2.2×</span></div>
        <div><code>20 / 600</code><span style="font-size:20px;font-weight:600">Screen title</span></div>
        <div><code>15 / 600</code><span style="font-size:15px;font-weight:600">Dialog title</span></div>
        <div><code>13 / 500</code><span style="font-weight:500">Row title, body text</span></div>
        <div><code>12 / 400</code><span style="font-size:12px;color:var(--ink-3)">Meta, captions · 01:23 · 4.1M</span></div>
        <div><code>11 / 500</code><span style="font-size:11px;font-weight:500;color:var(--ink-3)">Badges, nav headings</span></div>
        <div><code>mono 12</code><code style="font-size:12px;color:var(--ink)">cargo test -p bobix-core</code></div></div></section>
      <section class="card"><div class="card-h"><h2>Spacing · radius</h2><span class="meta">4-pt grid</span></div><div class="card-b space">
        ${[4, 8, 12, 16, 24, 32].map(v => `<div><i style="width:${v * 3}px"></i>${v}px</div>`).join('')}
        <p class="note" style="margin-top:var(--s2)">Radius 5 badges · 8 buttons and rows · 12 panels · 14 dialogs. Rows 36px, 44px when narrow.</p></div></section>
    </div>
    <section class="card"><div class="card-h"><h2>List rows</h2><span class="meta">pet · title · right-aligned meta</span></div><ul class="list">${sample.map(s => sessionRow(s)).join('')}</ul></section>
    <section class="card"><div class="card-h"><h2>Badges · buttons · keys</h2></div><div class="card-b" style="display:flex;flex-direction:column;gap:var(--s3)">
      <div class="specimen"><span class="st"><span class="dot working"></span>Working</span><span class="st"><span class="dot waiting"></span>Needs you</span><span class="st"><span class="dot done"></span>Done</span><span class="st"><span class="dot idle"></span>Idle</span></div>
      <div class="specimen">${modelTag(['Opus 5.5', ''])}${modelTag(['Sonnet 5.5', ''])}${modelTag(['Haiku 5.5', 'explore ×2'])}</div>
      <div class="specimen"><span class="badge">Unused 30d</span><span class="badge info">Duplicate</span><span class="badge warn">Large</span><span class="badge accent">Bash</span><span class="badge ok">In CLAUDE.md</span><span class="badge err">Blocked</span><span class="badge line">ak</span></div>
      <div class="specimen"><button class="btn pri" type="button">Allow <span class="kbd">↵</span></button><button class="btn" type="button">Deny</button><button class="btn ghost" type="button">Ghost</button><button class="btn danger" type="button">${ic('i-trash')}Remove</button><span class="kbd">⌘</span><span class="kbd">K</span></div></div></section>
    <section class="card"><div class="card-h"><h2>Table</h2></div><table class="t"><thead><tr><th>Skill</th><th class="r">Uses 30d</th><th class="r">Size</th><th>Flags</th></tr></thead><tbody>
      ${SKILLS.bobix.rows.slice(0, 4).map(r => `<tr><td class="nm">${r[0]}</td><td class="r num">${r[3]}</td><td class="r num"><span class="bar ${r[4] >= 1000 ? 'big' : ''}"><i style="width:${Math.min(100, r[4] / 20)}%"></i></span>${(r[4] / 1000).toFixed(1)}k</td><td>${r[3] ? '' : '<span class="badge">Unused 30d</span>'}</td></tr>`).join('')}</tbody></table></section>
    <section class="card"><div class="card-h"><h2>Charts</h2><span class="meta">bars, split bar, spark</span></div><div class="card-b">
      <div class="split" style="margin-top:0" aria-hidden="true"><i style="flex:.91;background:var(--c-ctx)"></i><i style="flex:.06;background:var(--c-in)"></i><i style="flex:.03;background:var(--c-out)"></i></div>
      <ul class="legend"><li><span class="sw" style="background:var(--c-ctx)"></span>Re-reading context</li><li><span class="sw" style="background:var(--c-in)"></span>New input</li><li><span class="sw" style="background:var(--c-out)"></span>Output</li><li><span class="sw dash"></span>Usual</li></ul>
      ${hourChart()}<p class="note" style="margin-top:var(--s3);display:flex;align-items:center;gap:var(--s2)">Spark <span style="color:var(--ink-2)">${spark([2, 5, 3, 8, 6, 9, 4, 7])}</span> uses per day</p></div></section>
    <section class="card"><div class="card-h"><h2>Empty state</h2></div>${empty('i-check', 'Nothing needs you', 'Approvals show up here, the longest wait on top.')}</section>
    <section class="card"><div class="card-h"><h2>Command bar</h2><span class="meta"><span class="kbd">⌘</span><span class="kbd">K</span> anywhere</span></div><div class="card-b">
      <div class="cmdk static"><div class="in">${ic('i-search')}<span style="color:var(--ink);font-size:15px">comp</span></div><div class="res">
        <div class="grp">Actions</div><div class="it" aria-selected="true">${pet(byId('s4'), 'xs')}<span class="lab">Compact “Fix checkout rounding on totals”<small>/compact</small></span><span class="hint"><span class="kbd">↵</span></span></div>
        <div class="it">${ic('i-overview')}<span class="lab">Go to Overview</span><span class="hint"><span class="kbd">⌘</span><span class="kbd">1</span></span></div></div></div></div></section>
    <section class="card"><div class="card-h"><h2>Toast with undo</h2></div><div class="card-b"><div class="toast static"><span style="flex:1">Disabled 12 skills in bobix</span><button class="btn sm" type="button">${ic('i-undo')}Undo <span class="kbd">⌘Z</span></button></div></div></section>
  </div>`;
}

/* ===== Router ===== */
function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'overview';
  const [page, arg] = h.split('/');
  const known = ['overview', 'sessions', 'session', 'work', 'skills', 'room', 'settings', 'design'];
  return known.includes(page) ? [page, arg] : null;
}
function render(keepScroll) {
  const r = route(); if (!r) return; // in-page anchors (#needs) keep the current screen
  const [page, arg] = r, y = scrollY;
  const navKey = page === 'session' ? 'sessions' : page;
  const s = page === 'session' && (byId(arg) || byId('s4'));
  const title = { overview: 'Overview', sessions: 'Sessions', work: 'Work', skills: 'Skills', room: 'Room', settings: 'Settings', design: 'Design system' }[page];
  $('#crumb').innerHTML = s ? `<a href="#/sessions">Sessions</a>${ic('i-chev', 'style="width:12px;height:12px;color:var(--ink-3)"')}<span class="t">${esc(s.title)}</span>` : `<span class="t">${title}</span>`;
  const asks = waiting().length;
  const counts = { overview: '', sessions: SESSIONS.length, work: '', skills: SKILLS.bobix.unused, room: '', settings: '' };
  $('#nav').innerHTML = NAV.map(([k, l, i, n]) => `<a href="#/${k}"${navKey === k ? ' aria-current="page"' : ''} class="${['work', 'room', 'settings'].includes(k) ? 'later' : ''}">${ic(i)}${l}${k === 'overview' && asks ? `<span class="cnt hot" title="${asks} need you">${asks}</span>` : counts[k] ? `<span class="cnt">${counts[k]}</span>` : `<span class="cnt">${isMac ? '⌘' : '^'}${n}</span>`}</a>`).join('');
  $('#tabbar').innerHTML = NAV.map(([k, l, i]) => `<a href="#/${k}"${navKey === k ? ' aria-current="page"' : ''}>${ic(i)}${l}${k === 'overview' && asks ? `<span class="cnt">${asks}</span>` : ''}</a>`).join('');
  $('#view').innerHTML = page === 'overview' ? overview() : page === 'sessions' ? sessions() : page === 'session' ? sessionDetail(arg) : page === 'skills' ? skills() : page === 'design' ? designSystem()
    : page === 'work' ? later('Work', 'the ticket flow (#112)', 'Pick an issue, approve a plan, and follow its run and log.')
    : page === 'room' ? later('Room', 'the war room (#114)', 'One room per problem: frame, options, pros and cons, decision.')
    : later('Settings', 'each feature', 'Today’s settings and setup move here one by one, with the same switches.');
  document.title = `${s ? s.title : title} · Bobix`;
  if (keepScroll) scrollTo(0, y);
}
addEventListener('hashchange', () => { if (route()) { render(); scrollTo(0, 0); $('#view').focus({ preventScroll: true }); } });

/* ===== Toasts and undo ===== */
function toast(text, undo) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span style="flex:1">${esc(text)}</span>${undo ? `<button class="btn sm" type="button">${ic('i-undo')}Undo <span class="kbd">${isMac ? '⌘' : 'Ctrl+'}Z</span></button>` : ''}`;
  if (undo) { ui.undo = () => { undo(); el.remove(); ui.undo = null; toast('Undone'); }; el.querySelector('button').onclick = ui.undo; }
  $('#toasts').prepend(el);
  setTimeout(() => { el.remove(); if (ui.undo && !document.body.contains(el)) ui.undo = null; }, undo ? 8000 : 3500);
}
function copy(text) { try { navigator.clipboard?.writeText(text); } catch { } }

/* ===== Sheet (confirm before writing CLAUDE.md) ===== */
function sheet(html) { $('#sheet-box').innerHTML = html; $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false'); $('#sheet-box').querySelector('.btn.pri')?.focus(); }
function closeSheet() { $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true'); }

/* ===== Actions ===== */
const ACTS = {
  compact: s => { copy('/compact'); toast(`Copied /compact. Paste it in “${byId(s).title}”.`); },
  fresh: s => { copy(`Continue “${byId(s).title}” from this summary: …`); toast('Copied a summary prompt for a new session.'); },
  haiku: s => { copy('Use a Haiku subagent for the read-only exploration, and report back a short map.'); toast('Copied a prompt that hands exploration to a Haiku subagent.'); },
  sonnet: s => toast('Copied: claude --model sonnet --resume'),
  skills: () => { location.hash = '#/skills'; },
  open: s => toast(`Opening “${byId(s).title}” in Claude…`),
  pause: s => toast('Pausing is a later step (prototype).'),
  soon: () => toast('The full list is not part of this prototype.'),
  copyRules: () => { copy(RULES); toast('Copied the rule block.'); },
};
function allow(id, deny) {
  const s = byId(id); ui.asked.add(id); render(true);
  toast(`${deny ? 'Denied' : 'Allowed'} ${s.ask.tool} in “${s.title}”`);
}
function setOff(keys, on) {
  const before = new Set(ui.off); keys.forEach(k => on ? ui.off.delete(k) : ui.off.add(k)); ui.sel.clear(); render(true);
  if (!on) toast(`Disabled ${keys.length === 1 ? keys[0].split(':').slice(1).join(':') : keys.length + ' skills'}`, () => { ui.off = before; render(true); });
}
function remove(keys) {
  const before = new Set(ui.gone); keys.forEach(k => ui.gone.add(k)); ui.sel.clear(); render(true);
  toast(`Removed ${keys.length === 1 ? keys[0].split(':').slice(1).join(':') : keys.length + ' skills'}. Backup kept.`, () => { ui.gone = before; render(true); });
}
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-cmdk]'); if (!t) return;
  const d = t.dataset;
  if ('cmdk' in d) return openCmdk();
  if (d.themeSet) return setTheme(d.themeSet);
  if (t.id === 'themeBtn') return setTheme(isDark() ? 'light' : 'dark');
  if (d.allow) return allow(d.allow);
  if (d.deny) return allow(d.deny, true);
  if (d.dismiss) { ui.warnGone.add(d.dismiss); render(true); return toast('Warning dismissed', () => { ui.warnGone.delete(d.dismiss); render(true); }); }
  if (d.act) return ACTS[d.act]?.(d.s);
  if (d.filter) { ui.filter = d.filter; return render(true); }
  if (d.off) return setOff([d.off]);
  if (d.on) return setOff([d.on], true);
  if (d.rm) return remove([d.rm]);
  if (d.bulk) { const sel = [...ui.sel]; if (d.bulk === 'clear') { ui.sel.clear(); return render(true); } return d.bulk === 'off' ? setOff(sel) : remove(sel); }
  if (d.dup) {
    const k = ui.skillsProject + d.dup; ui.dupDone.add(k); render(true);
    return toast(`Kept one set: ${d.dup}. ${DUPS[ui.skillsProject].find(x => x.title === d.dup).n} skills disabled.`, () => { ui.dupDone.delete(k); render(true); });
  }
  if (d.dupSkip) { ui.dupDone.add(ui.skillsProject + d.dupSkip); return render(true); }
  if (d.rules === 'add') return sheet(`<h2 id="sheet-h">Add the rule block to CLAUDE.md?</h2>
    <p class="note">Bobix appends 9 lines to <code>~/code/bobix/CLAUDE.md</code> and keeps a backup. You can remove them again here.</p>
    <pre class="rules">${esc(RULES).split('\n').slice(0, 4).map(l => `<span class="add">+ ${l}</span>`).join('')}<span style="color:var(--ink-3)">  … 5 more lines</span></pre>
    <div class="acts"><button class="btn" type="button" data-sheet="no">Cancel</button><button class="btn pri" type="button" data-sheet="yes">Add to CLAUDE.md</button></div>`);
  if (d.rules === 'undo') { ui.rulesAdded = false; render(true); return toast('Removed the rule block. CLAUDE.md is back as it was.'); }
  if (d.sheet) { closeSheet(); if (d.sheet === 'yes') { ui.rulesAdded = true; render(true); toast('Added to CLAUDE.md. Backup kept.', () => { ui.rulesAdded = false; render(true); }); } }
});
document.addEventListener('change', e => {
  if (e.target.dataset.sel) { const k = e.target.dataset.sel; e.target.checked ? ui.sel.add(k) : ui.sel.delete(k); render(true); }
  if (e.target.id === 'proj') { ui.skillsProject = e.target.value; ui.filter = 'all'; ui.q = ''; render(true); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'skq') { ui.q = e.target.value; render(true); const q = $('#skq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

/* ===== Command bar ===== */
let cmdItems = [], cmdIdx = 0, lastFocus = null;
function commands() {
  const go = NAV.map(([k, l, i, n]) => ({ g: 'Go to', label: l, icon: ic(i), keys: [isMac ? '⌘' : 'Ctrl', n], run: () => location.hash = '#/' + k }));
  go.push({ g: 'Go to', label: 'Design system', icon: ic('i-layers'), run: () => location.hash = '#/design' });
  const ss = SESSIONS.map(s => ({ g: 'Sessions', label: s.title, sub: `${s.project}${s.issue ? ' · ' + s.issue : ''}`, icon: pet(s, 'xs'), run: () => location.hash = '#/session/' + s.id }));
  const acts = [
    ...waiting().map(s => ({ g: 'Actions', label: `Allow ${s.ask.tool}: ${s.ask.cmd}`, sub: s.title, icon: pet(s, 'xs'), run: () => allow(s.id) })),
    { g: 'Actions', label: 'Compact “Fix checkout rounding on totals”', sub: '/compact', icon: pet(byId('s4'), 'xs'), run: () => ACTS.compact('s4') },
    { g: 'Actions', label: 'Add model rules to CLAUDE.md', sub: 'bobix', icon: ic('i-cpu'), run: () => { location.hash = '#/skills'; setTimeout(() => $('[data-rules="add"]')?.click(), 0); } },
    { g: 'Actions', label: 'Show unused skills', sub: 'bobix', icon: ic('i-skills'), run: () => { ui.skillsProject = 'bobix'; ui.filter = 'unused'; location.hash = '#/skills'; render(); } },
    { g: 'Actions', label: isDark() ? 'Switch to light theme' : 'Switch to dark theme', icon: ic(isDark() ? 'i-sun' : 'i-moon'), run: () => setTheme(isDark() ? 'light' : 'dark') },
  ];
  return [...acts, ...ss, ...go];
}
function drawCmdk() {
  const q = $('#cmdk-q').value.trim().toLowerCase();
  cmdItems = commands().filter(c => !q || (c.label + ' ' + (c.sub || '') + ' ' + c.g).toLowerCase().includes(q));
  cmdIdx = Math.min(cmdIdx, Math.max(0, cmdItems.length - 1));
  let g = '', html = '';
  cmdItems.forEach((c, i) => {
    if (c.g !== g) { g = c.g; html += `<div class="grp">${g}</div>`; }
    html += `<div class="it" role="option" id="ci-${i}" data-ci="${i}" aria-selected="${i === cmdIdx}">${c.icon}<span class="lab">${esc(c.label)}${c.sub ? `<small>${esc(c.sub)}</small>` : ''}</span>${c.keys ? `<span class="hint">${c.keys.map(k => `<span class="kbd">${k}</span>`).join('')}</span>` : ''}</div>`;
  });
  $('#cmdk-res').innerHTML = html || `<div class="empty" style="padding:var(--s6)"><p>No match for “${esc(q)}”</p></div>`;
  $('#cmdk-q').setAttribute('aria-activedescendant', cmdItems.length ? 'ci-' + cmdIdx : '');
  document.getElementById('ci-' + cmdIdx)?.scrollIntoView({ block: 'nearest' });
}
function openCmdk() { lastFocus = document.activeElement; $('#cmdk').classList.add('open'); $('#cmdk').setAttribute('aria-hidden', 'false'); $('#cmdk-q').value = ''; cmdIdx = 0; drawCmdk(); $('#cmdk-q').focus(); }
function closeCmdk() { $('#cmdk').classList.remove('open'); $('#cmdk').setAttribute('aria-hidden', 'true'); lastFocus?.focus?.(); }
function runCmd(i) { const c = cmdItems[i]; if (!c) return; closeCmdk(); c.run(); }
$('#cmdk-q').addEventListener('input', () => { cmdIdx = 0; drawCmdk(); });
$('#cmdk-res').addEventListener('click', e => { const it = e.target.closest('[data-ci]'); if (it) runCmd(+it.dataset.ci); });
$('#cmdk').addEventListener('click', e => { if (e.target.id === 'cmdk') closeCmdk(); });

/* ===== Keyboard ===== */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, open = $('#cmdk').classList.contains('open');
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); return open ? closeCmdk() : openCmdk(); }
  if (open) {
    if (e.key === 'Escape') { e.preventDefault(); return closeCmdk(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cmdIdx = (cmdIdx + (e.key === 'ArrowDown' ? 1 : -1) + cmdItems.length) % cmdItems.length; return drawCmdk(); }
    if (e.key === 'Enter') { e.preventDefault(); return runCmd(cmdIdx); }
    return;
  }
  if ($('#sheet').classList.contains('open') && e.key === 'Escape') return closeSheet();
  if (mod && /^[1-6]$/.test(e.key)) { e.preventDefault(); location.hash = '#/' + NAV[+e.key - 1][0]; return; }
  if (mod && e.key.toLowerCase() === 'z' && ui.undo && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); return ui.undo(); }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  // ↵ allows the top approval, only when focus is on the page itself (not on a button or field)
  if (e.key === 'Enter' && !mod && [document.body, $('#view')].includes(document.activeElement)) {
    const [page, arg] = route() || [];
    const top = page === 'overview' ? waiting()[0] : page === 'session' && byId(arg)?.state === 'waiting' && !ui.asked.has(arg) ? byId(arg) : null;
    if (top) { e.preventDefault(); allow(top.id); }
  }
  if (!typing && e.key === '/') { e.preventDefault(); openCmdk(); }
});

/* ===== Boot ===== */
const logo = creature('bobix', 'working', 0);
['#logo', '#logo2', '#logo3'].forEach(s => $(s).innerHTML = logo);
setTheme(getTheme());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTheme(getTheme()));
render();
if (new URLSearchParams(location.search).has('cmdk')) openCmdk();
</script>
