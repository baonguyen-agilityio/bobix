<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobix</title>
<link rel="stylesheet" href="/ui/theme.css">
<style>
/* The launcher: one window with a search field on top, scope tabs, the list on the left and the selected item's
   detail on the right, and an action bar with each action's keys. Light is the base; dark follows the system.
   Coral is the one signal colour and means "needs you". The pets keep their own pastels (theme.css). */
/* The tokens (colours, type, radius, shadows) and the shared parts (buttons, badges, status dots, meters, code,
   keys) are in theme.css, shared with the pets overlay. */
/* the creatures draw eyes and outlines with --n-900: keep them dark on any theme */
.av,.sprite,.mini,.pd-pet,.preview .ride{--n-900:oklch(24% .035 266)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.boot{visibility:hidden}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 var(--t-sm)/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);background-clip:padding-box;border:2px solid transparent;border-radius:999px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.note{margin:0;font-size:var(--t-xs);color:var(--ink-3)}
.note.err{color:var(--accent-ink);font-weight:600}
.hot{color:var(--accent-ink);font-weight:600}

/* buttons */
.lnk{border:0;background:none;padding:0;font:inherit;color:var(--accent-ink);font-weight:500;text-align:left;cursor:pointer}
.lnk:hover{text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:var(--s3)}

/* the window */
.b-win{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--surface)}
.b-search{display:flex;align-items:center;gap:12px;height:62px;padding:0 16px 0 18px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.b-search svg.i{width:20px;height:20px}
.b-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:19px;color:var(--ink)}
.b-search input::placeholder{color:var(--ink-3)}
.b-search input::-webkit-search-cancel-button{display:none}
.nb{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--ink-3)}
.nb:hover{background:var(--surface-3);color:var(--ink)}
.conn{font-size:var(--t-xs);font-weight:600;color:var(--accent-ink);white-space:nowrap}
.b-scope{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.b-scope::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:500;font-size:12px;white-space:nowrap}
.tab:hover{background:var(--surface-3);color:var(--ink)}
.tab[aria-selected="true"]{background:color-mix(in oklch,var(--ink) 10%,transparent);color:var(--ink)}
.tab .cnt{min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--accent-solid);color:var(--on-accent);font-size:10px;font-weight:600;line-height:16px;text-align:center}
.b-scope .sp{flex:1}
.b-scope .ver{font-size:11px;color:var(--ink-3);white-space:nowrap;padding:0 4px}
.sel{height:26px;padding:0 26px 0 10px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:12px;appearance:none;-webkit-appearance:none;max-width:200px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 13px) 11px,calc(100% - 9px) 11px;background-size:4px 4px;background-repeat:no-repeat}
.b-split{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);min-height:0}
.b-list{overflow:auto;padding:4px 6px 8px;border-right:1px solid var(--line)}
.b-grp{display:flex;align-items:center;gap:6px;padding:12px 10px 4px;font-size:11px;font-weight:600;color:var(--ink-3)}
.b-grp .n{font-weight:500}
.b-grp .sp{flex:1}
.b-grp .ib{display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:6px;background:none;color:var(--ink-3)}
.b-grp .ib:hover{background:var(--surface-3);color:var(--ink)}
.b-grp .ib svg.i{width:13px;height:13px}
.b-it{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:44px;padding:5px 10px;border:0;border-radius:9px;background:transparent;text-align:left;color:var(--ink)}
.b-it:hover{background:var(--surface-2)}
.b-it[aria-selected="true"]{background:color-mix(in oklch,var(--ink) 9%,transparent)}
.b-it.kid{padding-left:28px;grid-template-columns:22px minmax(0,1fr) auto;min-height:38px}
.b-it.kid .av{width:22px;height:22px}
.b-tx{display:flex;flex-direction:column;min-width:0}
.b-tx .lb{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-tx .lb.mono{font-family:var(--f-mono);font-size:12px}
.b-tx .sb{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-it .mt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.b-it.hot .sb{color:var(--accent-ink)}
.av{position:relative;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;flex:none}
.av svg{width:100%;height:100%;overflow:visible}
.av.lg{width:48px;height:48px;border-radius:12px;background:var(--surface-2)}
.av.xs{width:20px;height:20px;border-radius:5px}
.av.ring::after{content:"";position:absolute;inset:-3px;border-radius:9px;box-shadow:0 0 0 2px var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.av .cnt{position:absolute;right:-5px;bottom:-4px;min-width:15px;padding:0 3px;border:2px solid var(--surface);border-radius:999px;background:var(--ink);color:var(--surface);font-size:9px;font-weight:700;line-height:12px;text-align:center}
.b-ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);flex:none}
.b-ico svg.i{width:15px;height:15px}
.b-ico svg:not(.i){width:15px;height:17px}
.b-ico.pet svg{width:22px;height:22px}
.b-ico.warn{background:var(--warn-bg);color:var(--warn)}
.b-ico.hot{background:var(--accent-bg);color:var(--accent-ink)}
.b-ico.ok{background:var(--ok-bg);color:var(--ok)}
.b-ico.lg{width:48px;height:48px;border-radius:12px}
.b-ico.lg svg.i{width:22px;height:22px}
.b-ico.lg svg:not(.i){width:27px;height:30px}
.b-ico.lg.pet svg{width:40px;height:40px}
.b-detail{overflow:auto;min-width:0;overflow-wrap:anywhere}
.b-pane{padding:20px 22px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.b-dh{display:flex;align-items:center;gap:12px;min-width:0}
.b-dh>div{min-width:0;flex:1}
.b-dh h2{font-size:17px;overflow-wrap:anywhere}
.b-dh .note{margin-top:2px}
.b-sec h3{font-size:11px;font-weight:600;color:var(--ink-3);margin:0 0 8px}
.b-sec p{margin:0}
.b-code{margin:0;font:13px/1.5 var(--f-mono);padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto}
.b-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.b-stat{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.b-stat b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.b-stat span{font-size:12px;color:var(--ink-3)}
.b-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:48px 16px;color:var(--ink-3)}
.b-empty .b-ico{width:40px;height:40px;border-radius:10px;margin-bottom:4px}
.b-empty h3{color:var(--ink);font-size:var(--t-lg)}
.b-empty p{margin:0;max-width:360px}
.b-bar{display:flex;align-items:center;gap:4px;height:46px;padding:0 8px 0 12px;border-top:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.b-bar .ctx{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:auto}
.b-bar .ctx .g{color:var(--ink-3)}
.b-act{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap}
.b-act:hover{background:var(--surface-3);color:var(--ink)}
.b-act.pri{color:var(--ink);font-weight:600}
.b-act .kbd{background:color-mix(in oklch,var(--ink) 6%,transparent)}
.b-div{width:1px;height:18px;background:var(--line-strong);margin:0 4px;flex:none}

/* rows inside a detail */
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0 var(--s4);margin:0;font-size:var(--t-sm)}
.kv>*{padding:7px 0;border-top:1px solid var(--line);min-width:0}
.kv>:nth-child(-n+2){border-top:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;overflow-wrap:anywhere}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:40px;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:left}
.row:hover{background:var(--surface-2)}
.row .b-tx .lb{font-weight:500}
.row .mt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:6px}
.wt.long{color:var(--accent-ink);font-weight:600}
.dup{font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
/* The ticket flow (Work): assumptions are highlighted, the new ones marked; the prompt and "what to change" boxes. */
.tk-as{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.tk-as li{padding:6px 10px;border-radius:var(--r-md);background:var(--warn-bg);color:var(--ink);font-size:var(--t-sm);border-left:3px solid var(--warn)}
.tk-as li.new{font-weight:600}
.tk-as li.new::after{content:" ●";color:var(--warn)}
.tk-steps{margin:0;padding-left:20px;font-size:var(--t-sm);display:grid;gap:2px}
.tk-opts{display:grid;gap:6px;margin-bottom:8px;font-size:var(--t-sm)}
.tk-opts label{display:flex;gap:8px;align-items:baseline}
.tk-prompt,.tk-ch textarea{width:100%;box-sizing:border-box;padding:var(--s2) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:var(--t-xs)/1.5 var(--f-mono, ui-monospace, monospace);resize:vertical}
.tk-ch{display:grid;gap:4px;font-size:var(--t-sm);color:var(--ink-2)}
.tk-ch textarea{font-family:inherit;font-size:var(--t-sm)}
.risk{margin:0;font-size:var(--t-xs);font-weight:600;color:var(--accent-ink)}
.uw{margin:0;font-size:var(--t-xs);color:var(--accent-ink)}
.why{margin:0;font-size:var(--t-xs);color:var(--ink-3)}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:var(--s3) 0 var(--s2)}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink-2);list-style:none;margin:0;padding:0}
.legend li{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:600;color:var(--ink)}
.legend .lsw{width:8px;height:8px;border-radius:2px;flex:none}
.big{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.big b{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1}
.big span{color:var(--ink-2)}
.stg{display:flex;flex-direction:column;gap:6px}
.stp{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.stp li{font-size:var(--t-xs);padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-3)}
.stp li.past{color:var(--ink-2)}
.stp li.cur{background:var(--ink);color:var(--surface);font-weight:600}
.cmd{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.card h2{font-size:var(--t-lg);margin-bottom:var(--s2)}
.card .note{margin-top:var(--s2)}
.blank{margin:0;padding:var(--s4);border:1px dashed var(--line-strong);border-radius:var(--r-lg);font-size:var(--t-sm);color:var(--ink-3)}

/* a session's details */
.pane-acts{display:flex;flex-wrap:wrap;gap:6px}
.pane-acts [data-act="pet"]{display:inline-grid;place-items:center}
.pane-acts [data-act="pet"]>span{grid-area:1/1;pointer-events:none}
.pane-acts .alt{visibility:hidden}
.meta{margin:0;font-size:var(--t-xs);line-height:1.6;color:var(--ink-3);overflow-wrap:anywhere}
.ask{padding:var(--s3) var(--s4);border-radius:var(--r-lg);background:var(--accent-bg);border:1px solid color-mix(in oklch,var(--accent) 50%,transparent);font-size:var(--t-sm)}
.ask strong{color:var(--accent-ink)}
.ask .acts{margin-top:var(--s2)}
.md{overflow-wrap:anywhere;font-size:var(--t-sm);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.report{background:var(--ok-bg)}.report.stop{background:var(--warn-bg)}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 var(--s2)}
.md>:last-child{margin-bottom:0}
.md h4{font-size:var(--t-sm);font-weight:700;margin:var(--s3) 0 var(--s1)}
.md>h4:first-child{margin-top:0}
.md ul,.md ol{padding-left:var(--s6)}
.md li+li,.md li>ul,.md li>ol{margin-top:var(--s1)}
.md li>ul,.md li>ol{margin-bottom:0}
.md pre{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s2) var(--s3)}
.md pre code{background:none;border:0;padding:0;overflow-wrap:normal}
.md table{display:block;overflow-x:auto;border-collapse:collapse}
.md th,.md td{border:1px solid var(--line-strong);padding:var(--s1) var(--s2);text-align:left;vertical-align:top;overflow-wrap:break-word}
.md hr{border:0;border-top:1px solid var(--line-strong);margin:var(--s3) 0}
.md blockquote{padding-left:var(--s3);border-left:3px solid var(--line-strong);color:var(--ink-2)}
.fold>summary{cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h3{display:inline}
.fold>summary::after{content:" ▾";color:var(--ink-3);font-size:11px}
.fold[open]>summary{margin-bottom:8px}
.log{list-style:none;margin:0;padding:0;font-size:var(--t-sm)}
.log li{display:grid;grid-template-columns:max-content 8px minmax(0,1fr);align-items:baseline;gap:var(--s2) var(--s3);padding:var(--s2) 0;border-top:1px solid var(--line)}
.log time{grid-column:1;grid-row:1;font-size:var(--t-xs);color:var(--ink-3);white-space:nowrap}
.log li::before{content:"";grid-column:2;grid-row:1;align-self:start;width:8px;height:8px;margin-top:calc(.725em - 4px);border-radius:50%;background:var(--line-strong)}
.log .msg{grid-column:3;grid-row:1;min-width:0;color:var(--ink-2)}
.log .k-prompt .msg{color:var(--ink);font-weight:600}.log .k-prompt::before{background:var(--ink)}
.log .k-ask .msg{color:var(--accent-ink)}.log .k-ask::before{background:var(--accent)}
.log .k-done .msg{color:var(--ink)}.log .k-done::before{background:var(--ok)}
.log .k-start::before{background:var(--info)}
.log .arg{font-family:var(--f-mono)}
.log .n{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);margin-left:var(--s1)}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,2);overflow:hidden}
.clamp.open{display:block}
.clamp.prompt{display:block;-webkit-line-clamp:none;max-height:10em;background:var(--surface-2)}
.clamp.prompt.open{max-height:none}
.prompt.over{-webkit-mask-image:linear-gradient(#000 65%,transparent)}
.more{display:block;border:0;background:none;padding:0;margin-top:var(--s1);font:600 var(--t-xs) var(--f-ui);color:var(--ink-2);cursor:pointer}
.more:hover{color:var(--ink);text-decoration:underline}

/* habits (#80): optional, so quiet */
.sc{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.sc .kd{font-size:var(--t-xs);color:var(--ink-3)}.sc .tt{font-weight:600}.sc .why{font-size:var(--t-xs);color:var(--ink-3)}
.sc .acts{margin:0}
.sc .out{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:var(--r-md);background:var(--surface-2);font-size:var(--t-xs)}
.sc .out pre{margin:0;font:500 var(--t-xs)/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.hab-dots{display:flex;gap:4px}.hab-dots i{width:22px;height:6px;border-radius:3px;background:var(--surface-3)}.hab-dots i.on{background:var(--ink-3)}
.hb .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:var(--t-xs)}.hb .two b{display:block;margin-bottom:2px}.hb .two ul{margin:0;padding-left:16px;color:var(--ink-2)}
.hb .days{display:flex;flex-direction:column;gap:10px}.hb .day h3{font:600 11px var(--f-ui);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.hb .day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hb .day li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-md);font-size:var(--t-xs)}
.hb .day li .t{color:var(--ink-2)}.hb .day li .w{display:flex;flex-direction:column;gap:2px;min-width:0}
.hb .day li .w b{font-weight:600;font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:var(--s3)}
.hb .confirm{display:flex;flex-direction:column;gap:8px;margin-top:var(--s3);padding:10px 12px;border:1px solid var(--accent);border-radius:var(--r-lg);background:var(--accent-bg)}
.hb .confirm p{margin:0;font-weight:600;color:var(--accent-ink)}.hb .confirm div{display:flex;gap:6px}

/* settings */
.preview{position:relative;aspect-ratio:16/10;max-width:420px;border-radius:var(--r-lg);background:var(--n-200);border:1px solid var(--line-strong);overflow:hidden}
.preview .pv-bar{position:absolute;left:0;right:0;top:0;height:7%;background:var(--n-300)}
.preview .pv-dock{position:absolute;left:28%;right:28%;bottom:3%;height:8%;border-radius:var(--r-md);background:var(--n-300)}
.preview .pv-work{position:absolute;left:0;right:0;top:7%;bottom:13%}
.preview .band{position:absolute;left:var(--zs);width:calc(var(--ze) - var(--zs));bottom:0;height:calc(var(--ps) + 12px);background:var(--info-bg);border:1px dashed var(--info);border-radius:var(--r-md) var(--r-md) 0 0;transition:left 200ms var(--ease),width 200ms var(--ease)}
.preview.top .band{bottom:auto;top:0;border-radius:0 0 var(--r-md) var(--r-md)}
.preview .mini{position:absolute;bottom:6px;width:var(--ps);height:var(--ps);opacity:var(--op);transition:left 200ms var(--ease)}
.preview.top .mini{bottom:auto;top:6px}
.preview .mini svg{width:100%;height:100%}
.preview .ride{position:absolute;bottom:-45%;left:calc(var(--rx) - var(--ps) / 2);width:var(--ps);opacity:var(--op);animation:pv-rise 5s linear infinite}
.preview .ride .bln{display:block;width:50%;margin:0 auto}
.preview .ride svg{display:block;width:100%;height:auto}
@keyframes pv-rise{to{bottom:105%}}
.preview .hidden{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--ink-2);background:color-mix(in oklch,var(--bg) 70%,transparent)}
.pv-wrap{display:flex;flex-direction:column;gap:6px}
.saved{align-self:flex-start;font-size:var(--t-xs);font-weight:600;color:var(--ok);padding:2px var(--s3);border-radius:999px;background:var(--ok-bg);opacity:0;transition:opacity 200ms var(--ease)}
.saved.on{opacity:1}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:0 var(--s4)}
.sec>h2{font-size:var(--t-lg);padding:var(--s4) 0 var(--s3)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3) var(--s6);align-items:center;padding:var(--s3) 0;border-top:1px solid var(--line)}
.sec>.opt:first-child{border-top:0}
.opt.wide{grid-template-columns:minmax(0,1fr)}
.sec-note{margin:0;padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--ink-3)}
.opt .lbl{font-weight:500}
.opt .desc{font-size:var(--t-xs);color:var(--ink-3);margin-top:2px;max-width:60ch}
.opt.dim .lbl,.opt.dim .desc{opacity:.45}
.ctl{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;justify-content:flex-end}
.opt.wide .ctl{justify-content:flex-start}
select,input[type=number]{min-height:30px;padding:0 var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);font-size:var(--t-sm)}
input[type=number]{width:104px}
.sw{appearance:none;-webkit-appearance:none;margin:0;width:38px;height:22px;border-radius:999px;background:var(--n-300);position:relative;cursor:pointer;flex:none;transition:background 150ms var(--ease)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px oklch(30% .04 262 / .3);transition:transform 150ms var(--ease)}
.sw:checked{background:var(--ok)}
.sw:checked::after{transform:translateX(16px)}
.sw:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--surface-3);padding:2px;border-radius:var(--r-md)}
.seg button{border:0;background:none;padding:3px var(--s3);min-height:26px;border-radius:6px;font-size:var(--t-xs);font-weight:500;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px oklch(0% 0 0 / .12)}
.rng-row{display:flex;align-items:center;gap:var(--s3)}
.rng{appearance:none;-webkit-appearance:none;width:min(220px,48vw);height:5px;border-radius:999px;background:linear-gradient(var(--ink-2),var(--ink-2)) 0 0 / var(--fill,50%) 100% no-repeat,var(--surface-3);cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-2);box-shadow:var(--lift)}
.val{min-width:56px;text-align:right;font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.zone{display:flex;flex-direction:column;gap:var(--s3);width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:2px 10px;min-height:26px;font-size:var(--t-xs);font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--ink);color:var(--surface)}
.zone .pair{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center}
.zone .pair label{font-size:var(--t-xs);color:var(--ink-2);min-width:40px}
.zone .rng{width:100%}
.keys{display:grid;gap:var(--s2);width:100%}.keys label{display:flex;gap:var(--s2);align-items:center;justify-content:space-between}.keys input{width:8em;min-height:28px;padding:0 8px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);text-transform:uppercase}

/* skills */
.mine,.proc-list{display:grid;gap:var(--s2);width:100%}
.mine ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.mine li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px var(--s2);align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-md)}
.mine li.on{border-color:var(--ink-3)}
.mine .pin{display:flex;gap:8px;align-items:baseline;margin:0;font-weight:400;min-width:0;cursor:pointer}
.mine .pin input{margin:0;accent-color:var(--accent-solid)}
.mine code,.proc code{background:none;border:0;padding:0;font-weight:600}
.mine .d{grid-column:1/-1;font-size:var(--t-xs);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine .roles{display:flex;gap:4px}
.mine input[type=search],.proc input[type=url],.stbox input[type=search]{width:100%;min-height:30px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font-size:var(--t-sm)}
.mine .src,.proc .src{font-size:var(--t-xs);color:var(--ink-3)}
.proc{display:grid;gap:10px}
.proc .pg{display:grid;gap:4px;padding-top:10px;border-top:1px solid var(--line)}
.proc .lbl{font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.proc .note{margin:0}
.proc ul{list-style:none;margin:0;padding:0;font-size:var(--t-xs);color:var(--ink-2)}
.proc .tags{display:flex;flex-wrap:wrap;gap:4px}
.proc .tags li{display:inline-flex;gap:6px;align-items:baseline;padding:2px 8px;border:1px solid var(--line);border-radius:999px}
.proc .miss,.proc .fold{display:flex;flex-direction:column;gap:4px}
.proc .miss li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:6px 8px;border:1px dashed var(--line-strong);border-radius:var(--r-md)}
.proc .miss .line{grid-column:1;font-weight:500;color:var(--ink-2);overflow-wrap:anywhere}
.proc .miss .btn{grid-column:2;grid-row:1/3}
.proc .nm{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.proc .miss-tag{font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2)}
.proc .fold li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.proc .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:0;padding:0;border:0;background:none}
.proc .row input[type=url]{flex:1 1 14em;min-width:0}
.proc .file{position:relative;overflow:hidden}.proc .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* the skills audit */
.b-stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.b-ico.tx{font:600 11px/1 var(--f-mono);color:var(--ink-2)}
.b-ico.lg.tx{font-size:15px}
.b-code .add{color:var(--ok)}.b-code .del{color:var(--err)}
.b-code b{font-weight:700}
.row .acts{margin:0;flex-wrap:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.fb .b-code{max-height:min(320px,40dvh)}

/* from your habits */
.hs-draft{width:100%;min-height:min(320px,42dvh);padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);color:var(--ink);font:13px/1.5 var(--f-mono);resize:vertical}
.hs-ev{display:flex;flex-wrap:wrap;gap:6px}
.rows .row .mt{font-size:var(--t-xs);color:var(--ink-3)}
/* the war room */
.rm-f{display:grid;gap:6px}
.rm-f input,.rm-f textarea,.rm-f select{width:100%;padding:6px 10px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit;font-size:var(--t-sm)}
.rm-f textarea{min-height:64px;resize:vertical}
.rm-f .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:0;padding:0;border:0;background:none}
.rm-f .row input{flex:1 1 12em;min-width:0}
.rm-opt{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:6px}
.rm-opt.chosen{border-color:var(--ok)}
.rm-opt h4{margin:0;font-size:var(--t-md,14px);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rm-pc{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:var(--t-sm)}
.rm-pc ul{margin:0;padding-left:16px}.rm-pc .lbl{font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.rm-by{font-size:var(--t-xs);color:var(--ink-3)}
.rm-steps{display:flex;gap:6px;flex-wrap:wrap}
.rm-chat{list-style:none;margin:0;padding:4px;display:flex;flex-direction:column;gap:6px;max-height:min(360px,46dvh);overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
.rm-chat li{padding:6px 10px;border-radius:var(--r-md);background:var(--surface);max-width:88%;align-self:flex-start}
.rm-chat li.me{align-self:flex-end;background:var(--accent-bg)}.rm-chat li.blank{background:none;max-width:none}
.rm-mh{display:flex;gap:8px;align-items:baseline;font-size:var(--t-xs)}.rm-mt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--t-sm)}
@media (max-width:720px){.rm-pc{grid-template-columns:1fr}}
/* setup */
.sprite{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-lg);background:var(--surface-2)}
.sprite svg{width:100%;height:100%}
/* Settings → Connect Claude Code: the same header, sections and rows as the other settings panes */
#setup .b-dh .badge{margin-top:6px}
#setup .sec{padding-bottom:var(--s3)}
#setup .sec>h2+.opt{border-top:0}
#setup .sec>.note,#setup .sec>.acts{margin:var(--s3) 0 0}
#setup .opt .lbl .badge{margin-right:var(--s2)}
#setup .kv{grid-template-columns:minmax(0,160px) minmax(0,1fr)}
.guide{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3) var(--s6)}
.guide li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--s3);align-items:center;font-size:var(--t-sm)}
.guide .sprite{width:40px;height:40px}.guide .st-waiting .sprite{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}.guide .st-done .sprite{background:var(--ok-bg)}.guide .st-idle .sprite svg{opacity:.6}
.guide-more{margin:var(--s4) 0 0;padding-left:1.2em;font-size:var(--t-sm);display:grid;gap:var(--s2)}

/* dialogs: the Start box, stand-up, report, feedback, the pet picture */
.fb{width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:var(--s5,20px);border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--pop)}
.fb::backdrop{background:var(--scrim)}
.fb h2{font-size:var(--t-lg);margin-bottom:var(--s2)}
.fb p{margin:0 0 var(--s2)}
.fb .seg{margin-top:var(--s3)}
.fb label{display:block;margin:var(--s3) 0 var(--s1);font-size:var(--t-sm);font-weight:600}
.fb input,.fb textarea{width:100%;padding:var(--s2) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit}
.fb textarea{min-height:96px;resize:vertical}
.fb details{margin-top:var(--s3);font-size:var(--t-sm);color:var(--ink-2)}
.fb summary{cursor:pointer}
.fb pre{margin:var(--s2) 0 0;padding:var(--s3);max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border-radius:var(--r-md);font-size:var(--t-xs)}
.fb .acts{justify-content:flex-end}
#skills section{display:flex;flex-direction:column;gap:14px}
.cap::first-letter{text-transform:uppercase}
.rp form{display:flex;flex-direction:column;gap:var(--s3)}
.rp h2,.rp p{margin:0}
.fb.rp textarea{min-height:min(340px,50dvh);padding:12px 14px;background:var(--surface-2);font:400 var(--t-sm)/1.6 var(--f-mono)}
.rp .acts{margin:0}
.stbox dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px var(--s3);margin:0;font-size:var(--t-sm)}
.stbox dt{color:var(--ink-3)}.stbox dd{margin:0;min-width:0;overflow-wrap:anywhere}
.stbox label{margin:0}
.fb.stbox textarea{min-height:min(200px,32dvh)}
.stbox .fl{display:block;margin:0 0 6px;font-size:var(--t-sm);font-weight:600}
.stbox .sk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stbox .sk.all{max-height:min(320px,40dvh);overflow:auto;padding-right:4px}
.stbox .sk label{display:grid;grid-template-columns:18px minmax(0,1fr);gap:2px 8px;align-items:start;margin:0;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;font-weight:400}
.stbox .sk label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.stbox .sk input{width:auto;padding:0;border:0;margin:3px 0 0;accent-color:var(--accent-solid)}
.stbox .sk .nm{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}
.stbox .sk code{font-weight:600;background:none;border:0;padding:0}
.stbox .sk .d{grid-column:2;font-size:var(--t-xs);color:var(--ink-3);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.stbox .sk .tag{font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--accent-solid);color:var(--on-accent)}
.stbox .sk .src{font-size:11px;color:var(--ink-3)}
.stbox .more{margin-top:6px}
.stbox .sg{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;margin:10px 0 4px;font-size:var(--t-xs);font-weight:700;color:var(--ink-2)}
.stbox .sg:first-child{margin-top:0}
.stbox .sg .src{font-weight:500}
.stbox .sk label.miss{cursor:default;border-style:dashed;opacity:.85}
.stbox .sk .miss-tag{font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink-2)}
.stbox .sk .copy{grid-column:2;justify-self:start;margin-top:2px}
.stbox .note.sm{margin:2px 0 0}
.stbox input[type=search]{margin:8px 0 6px}
.pd{width:min(720px,calc(100vw - 32px));overflow:auto}
.pd-grid{display:flex;gap:var(--s6);flex-wrap:wrap;margin-top:var(--s4)}
.pd-view{display:flex;flex-direction:column;align-items:center;gap:var(--s3);flex:0 1 264px;min-width:0}
.pd-big{display:grid;place-items:center;width:min(264px,100%);aspect-ratio:1;border:1px solid var(--line);border-radius:var(--r-md);background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0 / 16px 16px;transition:opacity 150ms var(--ease)}
.pd-big img{image-rendering:pixelated;max-width:100%}
.pd[aria-busy="true"] .pd-big,.pd[aria-busy="true"] .pd-pet{opacity:.55}
.pd .sprite{width:96px;height:96px;border-radius:var(--r-lg)}
.pd-ctl{flex:1 1 280px;min-width:0;display:grid;gap:var(--s3);align-content:start}
.pd-sec{display:grid;gap:var(--s2);min-width:0}
.pd-sec+.pd-sec{padding-top:var(--s3);border-top:1px solid var(--line)}
.pd-ctl .lbl{display:block;margin:0;font-size:var(--t-sm);font-weight:600}
.pd-ctl .seg{display:flex;margin:0}
.pd-ctl .seg button{flex:1 1 0}
.pd-ctl .seg+.lbl{margin-top:var(--s2)}
.pd-ctl .hint{margin:0;font-size:var(--t-xs);line-height:1.45;color:var(--ink-3)}
.pd-nums{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.fb .pd-num{display:grid;gap:var(--s1);margin:0}
.fb .pd-num input{min-height:32px;padding:var(--s1) var(--s3)}
.pd-ctl .pr{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:30px}
.fb .pd-ctl .pr label{margin:0;font-size:var(--t-sm);font-weight:600}
.fb .sw{width:38px;padding:0;border:0;background:var(--n-300)}
.fb .sw:checked{background:var(--ok)}
.pd-info{min-height:1.4em;margin:0;font-size:var(--t-xs);color:var(--ink-3)}
.pd-oc{display:grid;gap:var(--s2);min-width:0;margin:0;padding:var(--s2) var(--s3);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);transition:opacity 150ms var(--ease)}
.pd-oc:disabled{opacity:.45}
.pd-oc-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.pd-oc-top .lbl{flex:1}
.pd-oc-top .pd-err{flex:1;min-width:0}
.pd-oc-top:has(.pd-err:not([hidden])) .lbl{display:none}
.pd-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pd-sw{width:26px;height:26px;padding:0;border:1px solid oklch(30% .04 262 / .2);border-radius:50%;background:var(--c);cursor:pointer}
.pd-sw.auto{width:auto;padding:0 var(--s2);border-radius:999px;border-color:var(--line-strong);background:var(--surface);font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.pd-sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--ink)}
.fb .pd-oc input[type=color]{flex:none;width:26px;height:26px;padding:3px;border:0;border-radius:50%;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);cursor:pointer}
.pd-oc input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.pd-oc input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.fb .pd-oc input[type=text]{flex:none;width:9.5em;min-height:30px;padding:var(--s1) var(--s2);font-family:var(--f-mono);font-size:var(--t-xs)}
.fb .pd-oc input[aria-invalid="true"]{border-color:var(--accent)}
.pd-err{margin:0;font-size:var(--t-xs);font-weight:600;color:var(--accent-ink)}
.pd .acts{position:sticky;bottom:-20px;margin:var(--s1) 0 -20px;padding:var(--s3) 0 20px;background:var(--surface)}

/* the command bar */
.cmdk{width:min(640px,calc(100vw - 32px));margin:12vh auto auto;padding:0;border-radius:14px;overflow:hidden;background:var(--surface);color:var(--ink);box-shadow:var(--pop);border:1px solid var(--line)}
.cmdk::backdrop{background:var(--scrim)}
.cmdk .in{display:flex;align-items:center;gap:var(--s3);height:52px;padding:0 var(--s4);border-bottom:1px solid var(--line);color:var(--ink-3)}
.cmdk .in input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:var(--t-lg);color:var(--ink)}
.cmdk .res{max-height:min(420px,56vh);overflow:auto;padding:4px 8px 8px}
.cmdk .grp{padding:8px 8px 4px;font-size:11px;color:var(--ink-3);font-weight:600}
.cmdk .it{display:flex;align-items:center;gap:var(--s3);min-height:38px;padding:0 var(--s2);border-radius:var(--r-md);cursor:pointer}
.cmdk .it .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdk .it .lab small{color:var(--ink-3);margin-left:6px;font-size:var(--t-xs)}
.cmdk .it .hint{display:flex;gap:3px}
.cmdk .it[aria-selected="true"]{background:var(--accent-bg)}
.cmdk .it>svg{color:var(--ink-3)}
.cmdk .ft{display:flex;align-items:center;gap:var(--s4);height:36px;padding:0 var(--s4);border-top:1px solid var(--line);color:var(--ink-3);font-size:var(--t-xs)}
.cmdk .ft span{display:inline-flex;align-items:center;gap:4px}

/* the tour: the element a step points at stays lit, the rest dims; one bubble beside it */
.tour{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:none;overflow:visible}
.tour::backdrop{background:transparent}
.tour-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 2px var(--accent),0 0 0 100vmax oklch(20% .02 266 / .55);pointer-events:none;transition:all 200ms var(--ease)}
.tour-hole.none{left:50%!important;top:50%!important;width:0!important;height:0!important;box-shadow:0 0 0 100vmax oklch(20% .02 266 / .55)}
.tour-pop{position:fixed;display:flex;flex-direction:column;gap:var(--s2);max-height:calc(100dvh - 24px);overflow:auto;padding:var(--s4) var(--s4) var(--s3);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--pop)}
.tour-pop h2{font-size:var(--t-lg)}
.tour-pop p{margin:0;font-size:var(--t-sm);color:var(--ink-2)}
.tour-pop .n{font-size:var(--t-xs);font-weight:600;color:var(--ink-3)}
.tour-pop .acts{margin:var(--s1) 0 0;justify-content:flex-end}
.tour-pop .acts .skip{margin-right:auto}
.tour-art{display:flex;gap:var(--s2)}
.tour-art .sprite{width:36px;height:36px;border-radius:10px}
.tour-art .st-waiting .sprite{background:var(--accent-bg);box-shadow:inset 0 0 0 1px var(--accent)}

.toasts{position:fixed;right:20px;bottom:60px;z-index:40;display:flex;flex-direction:column;gap:var(--s2);align-items:flex-end;width:min(440px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:6px 6px 6px var(--s4);border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:var(--pop);font-weight:500;text-align:left;animation:rise .18s var(--ease)}
.toast .btn{background:transparent;color:inherit;border-color:color-mix(in oklch,var(--bg) 30%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

/* narrow: the list above its detail, one scroll; the action bar keeps the main action and Actions */
@media (max-width:720px){
  .b-win{height:auto;min-height:100dvh;grid-template-rows:auto auto 1fr auto}
  .b-split{grid-template-columns:minmax(0,1fr)}
  .b-list{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .b-detail{overflow:visible}
  .b-pane{padding:16px 16px 24px}
  .b-search{height:56px}
  .b-search input{font-size:17px}
  .b-search .kbd,.b-scope .ver{display:none}
  .b-scope{flex-wrap:wrap;overflow:visible}.b-scope .sp{display:none}.b-scope .sel{max-width:100%}
  .b-it{min-height:48px}
  .b-bar{position:sticky;bottom:0;z-index:5;height:52px;background:color-mix(in oklch,var(--surface) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .b-act:not(.pri):not([data-cmdk]),.b-act .kbd,.b-bar .ctx .g,.b-div{display:none}
  .b-act{height:36px}
  .btn{min-height:34px;padding:4px 12px;font-size:var(--t-sm)}
  .btn.sm{min-height:30px}
  .b-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .b-stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opt{grid-template-columns:minmax(0,1fr)}
  .ctl{justify-content:flex-start}
  #setup .kv{grid-template-columns:minmax(0,1fr)}
  #setup .kv>:nth-child(-n+2){border-top:1px solid var(--line)}#setup .kv>:first-child{border-top:0}
  .hb .two{grid-template-columns:1fr}
  .mine li{grid-template-columns:minmax(0,1fr)}
  .cmdk .it .hint,.cmdk .ft{display:none}
  .toasts{left:16px;right:16px;bottom:64px;width:auto;align-items:stretch}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
// The panel shows after 1 s at the latest. Set first, so an error further down cannot leave it hidden (body.boot).
setTimeout(() => document.body.classList.remove('boot'), 1000);
const IDLE_AFTER = 10 * 60e3;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Side sessions started from a Claude desktop session (parent = that session's id in Bobix).
const kidsOf = s => list.filter(x => x.parent === s.id);
// Within one group: each parent followed by its side sessions.
function familyOrder(items) {
  const ids = new Set(items.map(s => s.id)), out = [];
  for (const s of items) if (!(s.parent && ids.has(s.parent))) { out.push(s); out.push(...items.filter(k => k.parent === s.id)); }
  return out;
}
const titleOf = id => { const p = id && list.find(x => x.id === id); return p ? p.title || p.name : ''; };
const secsLeft = s => (!s.answer ? 0 : s.answer.until == null ? Infinity : Math.max(0, Math.ceil((s.answer.until - Date.now()) / 1000))); // Infinity: waits until answered
const look = s => s.state === 'idle' || (s.state === 'done' && Date.now() - s.since > IDLE_AFTER) ? 'idle' : s.state;
// Same rule as the pets overlay: hidden by hand, or asleep past the "leave after" time.
const offScreen = s => {
  const mins = state?.settings?.sleepHide || 0;
  if (s.pet === 'hidden') return true;
  return s.pet !== 'shown' && look(s) === 'idle' && mins > 0 && Date.now() - (s.state === 'done' ? s.since + IDLE_AFTER : s.since) > mins * 60e3;
};
const bridge = window.bobix; // only inside the app
let lang = navigator.language, state = null; // state = app state (settings, hooks, displays) when in the app
const T = (k, v) => I18N.t(lang, k, v);

function translate() {
  document.documentElement.lang = I18N.pick(lang);
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.documentElement.style.setProperty('--open', JSON.stringify(T('group.open')));
  document.documentElement.style.setProperty('--close', JSON.stringify(T('group.close')));
}
function toast(text, action) {
  if ([...$('#toasts').children].some(t => t.dataset.text === text)) return; // already on screen (e.g. Open session clicked twice)
  const el = document.createElement('div');
  el.dataset.text = text;
  el.className = 'toast';
  el.innerHTML = `<span style="flex:1">${esc(text)}</span>${action ? `<button class="btn" type="button">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { el.remove(); action.run(); };
  $('#toasts').prepend(el);
  setTimeout(() => el.remove(), action ? 10000 : 6000);
}
function ago(t) {
  const m = Math.floor((Date.now() - t) / 60e3);
  return m < 1 ? T('ago.now') : m < 60 ? T('ago.min', { n: m }) : m < 1440 ? T('ago.h', { n: Math.floor(m / 60) }) : T('ago.d', { n: Math.floor(m / 1440) });
}
function statusText(s, st) {
  if (st === 'working') return s.tool ? T('status.working', { tool: I18N.toolLabel(lang, s.tool) }) : T('status.thinking');
  if (st === 'waiting') return isPlan(s) ? T('ask.plan') : s.askTool ? T('status.waitingTool', { tool: s.askTool }) : T('status.waiting');
  return T(`status.${st}`);
}
const line2 = (s, st) => st === 'done' && s.summary ? T('line.report') + s.summary : s.quest || T('line.noQuest');
function logHTML(l, open) {
  if (l.kind === 'start' && I18N.STR.en[`log.start.${l.text}`]) return esc(T(`log.start.${l.text}`)); // the hook's source (startup, resume…) in words
  if (l.kind !== 'tool') return esc(T(`log.${l.kind}`, { x: l.text }));
  const tool = esc(LOG.cap(I18N.toolLabel(lang, l.tool), I18N.pick(lang))), n = l.n > 1 ? `<span class="n">×${l.n}</span>` : '';
  return (l.text ? T('log.tool', { tool, x: `<span class="arg" title="${esc(l.text)}">${esc(open ? l.text : LOG.mid(l.text)).replace(/\//g, '/<wbr>')}</span>` }) : tool) + n;
}
// Clamped text with a "Show more" toggle; the toggle shows only when there is more (see showMore).
function moreHTML(key, html, cls = '', cut = false) {
  const open = moreOpen.has(key);
  return `<div class="clamp${cls ? ' ' + cls : ''}${open ? ' open' : ''}" data-k="${esc(key)}">${html}</div>`
    + `<button class="more" type="button" data-more="${esc(key)}"${cut ? ' data-cut' : ''} hidden>${T(open ? 'pane.less' : 'pane.more')}</button>`;
}
// After drawing: a toggle is shown for text that is open, cut by the clamp, or shortened (a long command).
function showMore(root) {
  root.querySelectorAll('[data-more]').forEach(b => {
    const box = b.previousElementSibling, over = box.scrollHeight > box.clientHeight + 1;
    b.hidden = !(box.classList.contains('open') || over || b.hasAttribute('data-cut'));
    box.classList.toggle('over', over);
  });
}
let list = [], selected = new URLSearchParams(location.search).get('s');
let hint = null; // why a pet or notification click could not open the selected session: { id, reason, app, folder }
let reportOpen = true; // the final report folded or not: kept while the panel is open, for every session
const moreOpen = new Set(); // Quest and log lines opened with "Show more" (the pane is redrawn on every log line)
function waitedHTML(s) {
  const ms = Date.now() - s.since, long = ms >= (state?.settings?.longWait || 10) * 60e3;
  return `<span class="wt${long ? ' long' : ''}">${esc(ms < 60e3 ? T('day.waitedNow') : T('day.waited', { x: ago(s.since) }))}</span>`;
}
// The requests waiting for you, the one that has waited longest first.
const waitingList = () => list.filter(s => look(s) === 'waiting').sort((a, b) => a.since - b.since);
// ---------- habits (#80): what Bobix remembers of your work, and a few suggestions from it ----------
// habitData: { on, events, bytes, days, dir } from the app (only while Settings → habits is on); read again every
// 5 minutes and after a change. habOpen: the suggestion whose details show; habUndo: the last "Không cần".
let habitData = null, habOpen = null, habUndo = null, habConfirm = false;
async function loadHabits() {
  habitData = bridge && state?.settings?.habitsOn ? await bridge.habitsRead().catch(() => null) : null;
  render();
  renderSettings();
}
setInterval(() => state?.settings?.habitsOn && loadHabits(), 5 * 60e3);
const habitCtx = () => ({ model, sessions: list });
const habitSug = () => HABITS.suggest(habitData?.events || [], habitCtx(), state?.settings);
const WEEKDAY = d => new Date(2026, 10, 1 + d).toLocaleDateString(LOCALE(), { weekday: 'long' }); // 1 Nov 2026 is a Sunday
const dayName = t => (HABITS.dayOf(t) === HABITS.dayOf(Date.now() - 864e5) ? T('hab.yesterday') : WEEKDAY(new Date(t).getDay()));
const timeOf = t => new Date(t).toLocaleTimeString(LOCALE(), { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function habCard(c) {
  const code = x => `<code>${esc(x)}</code>`;
  const map = {
    morning: [T('hab.morning.t', { n: c.iid, d: dayName(c.at) }), T('hab.morning.why', { p: HABITS.base(c.dir), t: timeOf(c.at), d: dayName(c.at) }), T('hab.morning.go')],
    allow: [T('hab.allow.t', { x: code(c.what), n: c.count }), T('hab.allow.why', { p: HABITS.base(c.dir) }), T('hab.allow.go')],
    recurring: [T('hab.rec.t.' + c.what, { d: WEEKDAY(c.weekday), t: HABITS.hhmm(c.at) }), T('hab.rec.why', { n: c.count, a: HABITS.hhmm(c.from), b: HABITS.hhmm(c.to), d: WEEKDAY(c.weekday), w: T('hab.rec.w.' + c.what) }), T('hab.rec.go.' + c.what)],
    skill: [T('hab.skill.t', { p: esc(HABITS.base(c.dir)), x: code('/' + c.skill) }), T('hab.skill.why', { n: c.count, m: c.of, p: HABITS.base(c.dir), x: '/' + c.skill }), T('hab.skill.go')],
  }[c.kind];
  const t = c.kind === 'morning' ? esc(map[0]) : map[0]; // allow and skill carry <code>: their parts are escaped above
  return `<div class="sc"><span class="kd">${esc(T('hab.kind.' + c.kind))}</span><span class="tt">${t}</span><span class="why">${esc(map[1])}</span>
    <div class="acts"><button class="btn sm pri" type="button" data-hab-go="${esc(c.id)}" data-f="hab:${esc(c.id)}"${['allow', 'skill'].includes(c.kind) ? ` aria-expanded="${habOpen === c.id}"` : ''}>${esc(map[2])}</button><button class="btn sm ghost" type="button" data-hab-no="${esc(c.id)}">${esc(T('hab.no'))}</button></div>
    ${habOpen === c.id ? habOut(c) : ''}</div>`;
}
function habOut(c) {
  if (c.kind === 'allow') return `<div class="out"><span>${T('hab.allow.out', { f: `<code>${esc(HABITS.base(c.dir))}/.claude/settings.json</code>` })}</span><pre>${esc(JSON.stringify(c.rule))}</pre>
    <div class="acts"><button class="btn sm pri" type="button" data-hab-copy="${esc(c.id)}">${esc(T('hab.allow.copy'))}</button></div></div>`;
  if (c.kind === 'skill') return `<div class="out"><span>${esc(T('hab.skill.out', { p: HABITS.base(c.dir), x: '/' + c.skill }))}</span>
    <div class="acts"><button class="btn sm pri" type="button" data-hab-skill="${esc(c.id)}">${esc(T('hab.skill.use', { x: '/' + c.skill }))}</button></div></div>`;
  return '';
}
async function habGo(id, b) {
  const c = habitSug().cards.find(x => x.id === id);
  if (!c) return;
  if (c.kind === 'allow' || c.kind === 'skill') { habOpen = habOpen === id ? null : id; nextFocus = 'hab:' + id; return render(); }
  if (c.kind === 'recurring') return c.what === 'standup' ? openStandup() : openReport();
  // morning: the issue's Start box (#54), in the folder it was worked in
  const g = [...(work.local || []), ...(work.away || [])].find(x => x.path === c.project);

// A typed outline colour, in any form the browser knows (#hex, rgb(), hsl(), names...) -> '#rrggbb', or null.

const pdCanvas = document.createElement('canvas').getContext('2d');

async function rmDo(itemId, work) {

  catch (e) { rm.err = { id: itemId, text: T('sk.err', { e: String(e?.message || e) }) }; }
  rm.busy = ''; await rmLoad();
}

  if (d.rm === 'create') return rmDo('rm:new', async () => { const r = await bridge.room('create', { title: rmIn.title || '', problem: rmIn.problem || '', invite: String(rmIn.invite || '').split(/[\s,;]+/).filter(Boolean) });
    if (r?.ok) { rmIn.title = rmIn.problem = rmIn.invite = ''; bsel.room = 'rm:h:' + r.room.id; nextFocus = 'it:rm:h:' + r.room.id; toast(T('rm.created')); } return r; });
  if (d.rm === 'join') return rmDo('rm:join', async () => { const addr = (rmIn.addr || '').trim(), r = await bridge.room('get', { addr });
    if (r?.ok) { rmIn.addr = ''; rm.remote[addr] = r; bsel.room = 'rm:j:' + addr; toast(T('rm.joined', { n: r.room.title })); } else if (r?.status === 403) return { ok: false, error: T('rm.refused', { e: rmWhy(r.error) }) }; return r; });
  if (d.rm === 'say') { const f = key('msg'), text = (rmIn[f] || '').trim(); if (!text) return;
    return rmDo(at, async () => { const r = host ? await bridge.room('say', { id: d.id, text }) : await bridge.room('rsay', { addr: d.addr, text });
      if (r?.ok) { delete rmIn[f]; const m = (r.room?.msgs || []).slice(-1)[0]; if (m?.redacted) toast(T('rm.redacted', { n: m.redacted })); if (!host) rm.remote[d.addr] = { ok: true, room: r.room }; } return r; }); }
  if (d.rm === 'invite') return rmDo(at, () => bridge.room('invite', { id: d.id, login: take(key('inv')) }));
  if (d.rm === 'uninvite') return rmDo(at, () => bridge.room('uninvite', { id: d.id, login: d.login }));
  if (d.rm === 'draft') { const e = rm.ed[d.id]; const go = () => rmDo(at, async () => { const r = await bridge.room('draft', { id: d.id }); if (r?.ok) delete rm.ed[d.id]; return r; });
    return e?.dirty ? skAsk(T('rm.redraftQ'), T('rm.redraftBody'), '', T('rm.redraft'), go) : go(); }

  if (d.rm === 'decide' && ed) { const o = ed.options.find(x => x.id === ed.decision?.option); if (!o) return;
    return skAsk(T('rm.decideQ', { n: o.text }), T('rm.decideBody'), '', T('rm.decide'), () => rmDo(at, async () => { const x = await bridge.room('decide', { id: d.id, draft: plain(ed) }); if (x?.ok) { delete rm.ed[d.id]; toast(T('rm.decided')); } return x; })); }
  if (d.rm === 'audit') { const r = await bridge.room('audit', { id: d.id }); rm.audit = { id: d.id, lines: r?.lines || [] }; return render(); }
  if (d.rm === 'addr') { const tn = rm.v?.tailnet, a = `${tn?.ip}:${tn?.port}/${d.id}`; try { await navigator.clipboard.writeText(a); toast(T('rm.addrCopied')); } catch { toast(a); } return; }

  if (d.rm === 'open') { const r = await bridge.room('open', { path: d.path }); if (!r?.ok) toast(T('sk.err', { e: r?.error || '?' })); return; }
  if (d.rm === 'copy') return skAsk(T('rm.copyQ'), T('rm.copyBody'), '', T('rm.copyClaude'), async () => { const r = await bridge.room('markdown', { id: d.id });
    if (!r?.ok) return toast(T('sk.err', { e: r?.error || '?' })); try { await navigator.clipboard.writeText(r.text); toast(T('rm.copied')); } catch { toast(T('sk.err', { e: 'clipboard' })); } });
}

  const rd = e.target.dataset?.rd; if (rd === undefined) return;
  const [id, ...path] = rd.split('|'), ed = rm.ed[id]; if (!ed) return;

  else if (path[0] === 'pick') { ed.decision = { ...ed.decision, option: v || null }; ed.dirty = true; return render(); }
  else if (path[0] === 'o') { const o = ed.options[+path[1]]; if (o) o[path[2]] = path[2] === 'text' ? v : lines(v); }

function tourGo(tab, item) {

  const target = tourTarget(step.at) || (step.alt && tourTarget(step.alt.at));
  const art = step.art ? `<div class="tour-art" aria-hidden="true">${['working', 'waiting', 'done', 'idle'].map(k => `<span class="st-${k}"><span class="sprite">${creature('bobix', k)}</span></span>`).join('')}</div>` : '';
  $('#tour-pop').innerHTML = `<span class="n">${tourAt + 1} / ${n}</span><h2 id="tour-h">${esc(T(`tour.${step.key}.title`))}</h2>${art}<p>${esc(T(`tour.${step.key}.body`, { key: CMD === '⌘' ? '⌘K' : 'Ctrl+K' }))}</p>
    <div class="acts">${last ? '' : `<button class="btn ghost skip" type="button" data-tour="skip">${T('tour.skip')}</button>`}${tourAt ? `<button class="btn" type="button" data-tour="back">${T('tour.back')}</button>` : ''}<button class="btn pri" type="button" data-tour="next">${T(last ? 'tour.done' : 'tour.next')}</button></div>`;
  target?.scrollIntoView({ block: 'center', behavior: 'instant' });
  tourPlace(target);
  $('#tour-pop [data-tour="next"]').focus();
}
const tourTarget = at => at.map(q => document.querySelector(q)).find(e => e && e.getClientRects().length);
function tourPlace(target = tourSteps[tourAt] && (tourTarget(tourSteps[tourAt].at) || (tourSteps[tourAt].alt && tourTarget(tourSteps[tourAt].alt.at)))) {
  if (tourAt < 0) return;
  const r = target?.getBoundingClientRect(), hole = $('#tour-hole'), pop = $('#tour-pop'), pad = 6;
  hole.classList.toggle('none', !r);
  if (r) Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + 2 * pad + 'px', height: r.height + 2 * pad + 'px' });
  pop.style.width = Math.min(380, innerWidth - 24) + 'px';
  const p = TOUR.place(r ? { left: r.left - pad, top: r.top - pad, width: r.width + 2 * pad, height: r.height + 2 * pad } : null, innerWidth, innerHeight, 380, pop.offsetHeight);
  Object.assign(pop.style, { left: p.left + 'px', top: p.top + 'px', width: p.width + 'px' });
}
$('#tour').addEventListener('click', e => {
  const b = e.target.closest('[data-tour]')?.dataset.tour;
  if (b === 'skip' || (b === 'next' && tourAt === tourSteps.length - 1)) return tourEnd();
  if (b === 'next' || b === 'back') { tourAt += b === 'next' ? 1 : -1; tourShow(); }
});
$('#tour').addEventListener('cancel', e => { e.preventDefault(); tourEnd(); }); // Esc
$('#tour').addEventListener('keydown', e => {
  if (e.key === 'Tab') { // focus stays in the bubble
    const bs = [...$('#tour-pop').querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    e.preventDefault(); bs[(i + (e.shiftKey ? bs.length - 1 : 1)) % bs.length].focus();
  }
});
addEventListener('resize', () => tourPlace());
addEventListener('scroll', () => tourPlace(), true);

// ---------- boot ----------
function applyLang() {
  lang = !state || state.settings.language === 'auto' ? navigator.language : state.settings.language;
  translate();
  $('#conn').textContent = T('conn.lost');
  render(true);
}
// Shown once its language and the first sessions are in, so nothing jumps as they arrive (fallback: top of this script).
const pending = new Set(['state', 'list']);
const arrived = k => {
  if (!pending.delete(k) || pending.size) return;
  document.body.classList.remove('boot');
  const fresh = state && TOUR.fresh(state.settings.tourSeen);
  if (fresh?.length) tourStart(true, fresh);
};
const es = new EventSource('/events?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || ''));
// The connection to the app is said only when it is lost (the stream reconnects by itself).
es.onopen = () => { $('#conn').hidden = true; };
es.onerror = () => { $('#conn').hidden = false; };
es.onmessage = m => {
  const d = JSON.parse(m.data);
  const firstIds = list.slice(0, 4).map(x => x.id).join();
  list = (d.sessions || []).filter(s => !s.linking); // a new side session waits for its parent link (state.rs), as on the pets
  work = d.work || { status: 'off' };
  model = d.model || {};
  waiting = d.waiting || [];
  waits = d.waits || [];
  tickets = d.tickets || { list: [] };
  const um = d.usage || {};
  if (JSON.stringify(um) !== JSON.stringify(usageMeta)) { usageMeta = um; if (cur?.id === 'set:usage') renderSettings(); }
  const projects = [...(work.local || []), ...(work.away || [])].map(g => g.path + ':' + g.autoKey).join();
  if (projects !== lastProjects) { lastProjects = projects; if (cur?.id === 'set:work' && !document.activeElement?.dataset?.keyOf) renderSettings(); } // the codes list
  if (pendingSel && list.some(s => s.id === pendingSel)) { const id = pendingSel; pendingSel = null; select(id); } else render();
  if (scope === 'skills' && audDir === undefined && audDirs().length) loadAudit(); // the first project, once sessions are in
  if (firstIds !== list.slice(0, 4).map(x => x.id).join()) renderPreview();
  arrived('list');
};
setInterval(render, 15e3);
setInterval(() => list.some(s => s.answer) && render(), 1000); // countdown of a waiting permission request
(async () => {
  if (bridge) {
    state = await bridge.getState();
    loadHabits();
    bridge.onSelect(select);
    bridge.onShowTab(showTab);
    bridge.onOpenFail(showHint);
    bridge.onSettings(s => {
      if (JSON.stringify(s) === JSON.stringify(state.settings)) return; // our own save echoing back: keep the form as is (slider drag)
      const langChanged = s.language !== state.settings.language, habits = s.habitsOn !== state.settings.habitsOn;
      state.settings = s;
      if (langChanged) applyLang(); else { render(); renderSettings(); } // e.g. toggled from the tray
      if (!langChanged && cur?.kind === 'skills' && !$('#skills').contains(document.activeElement)) renderSkillsTab();
      if (habits) loadHabits();
    });
  }
  applyLang();
  showTab(new URLSearchParams(location.search).get('tab') || 'overview');
  try { const f = new URLSearchParams(location.search).get('fail'); if (f) showHint(JSON.parse(f)); } catch {} // a pet or notification click opened this window
  arrived('state');
})();
</script>
</body>
