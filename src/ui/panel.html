<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobix</title>
<link rel="stylesheet" href="/ui/fonts/fonts.css">
<link rel="stylesheet" href="/ui/theme.css">
<style>
/* The board look: warm neutrals, plain readable type, one drawer for details. Dark follows the system. */
:root{--bg:oklch(97.5% .012 85);--surface:oklch(99.5% .004 85);--sunk:oklch(95% .014 85);--line:oklch(91% .012 85);--line-strong:oklch(84% .015 85);--on-pop:oklch(24% .035 266)}
@media (prefers-color-scheme:dark){:root{
  --n-50:oklch(25% .022 266);--n-100:oklch(20.5% .02 266);--n-200:oklch(30% .022 266);--n-300:oklch(38% .024 266);
  --n-500:oklch(70% .02 262);--n-700:oklch(85% .014 262);--n-900:oklch(96% .008 262);
  --sky-soft:oklch(33% .05 235);--mint-soft:oklch(33% .05 162);--coral-soft:oklch(32% .07 33);--coral-ink:oklch(80% .12 33);
  --bg:oklch(19% .02 266);--surface:oklch(24% .022 266);--sunk:oklch(21% .02 266);--line:oklch(30% .02 266);--line-strong:oklch(38% .024 266);
  color-scheme:dark}}
/* the creatures draw eyes and outlines with --n-900: keep them dark on any theme */
.sprite,.mini,.pd-pet,.logo,.egg,.preview .ride{--n-900:oklch(24% .035 266)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.boot{visibility:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-md)/1.55 var(--f-body);font-variant-numeric:tabular-nums}
body.drawer-on{overflow:hidden}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);background-clip:padding-box;border:2px solid transparent;border-radius:var(--pill)}
::-webkit-scrollbar-thumb:hover{background-color:var(--ink-3)}

.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:var(--s2) var(--s4);min-height:60px;padding:10px clamp(12px,3vw,28px);background:color-mix(in oklch,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s2)}
.brand .logo{width:32px;height:32px}
.bar h1{font-size:var(--t-xl)}
.ver{font-size:var(--t-xs);color:var(--ink-3);align-self:flex-end;padding-bottom:4px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:var(--pill);min-width:0;overflow-x:auto}
.tab{border:0;background:none;padding:6px 14px;border-radius:var(--pill);cursor:pointer;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background 150ms var(--ease)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:var(--pill);background:var(--coral);color:var(--on-pop);font-size:11px;line-height:18px;text-align:center}
.conn{font-size:var(--t-sm);color:var(--ink-3);margin-left:auto}
.conn.lost{color:var(--coral-ink);font-weight:600}
.btn{position:relative;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);padding:7px var(--s4);font-size:var(--t-sm);font-weight:600;cursor:pointer;transition:border-color 120ms var(--ease)}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--ink);color:var(--n-50);border-color:var(--ink)}
.btn.sm{padding:4px 12px;font-size:var(--t-xs)}
/* habits (#80): optional, so quiet: no colour, no count on the tab */
.sug{display:flex;flex-direction:column;gap:var(--s2);margin:0 0 var(--s6);padding:var(--s3) var(--s4);border:1px dashed var(--line-strong);border-radius:22px;background:color-mix(in oklch,var(--surface) 60%,var(--bg))}
.sug .dh h2{color:var(--ink-2)}
.sc{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sc .kd{font-size:var(--t-xs);color:var(--ink-3)}.sc .tt{font-weight:600}.sc .why{font-size:var(--t-xs);color:var(--ink-3)}
.sc .acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0}
.sc code,.hb code{font:500 var(--t-xs)/1.5 var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:0 4px}
.sc .out{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:12px;background:var(--sunk);font-size:var(--t-xs)}
.sc .out pre{margin:0;font:500 var(--t-xs)/1.5 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere}
.sug .undo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:var(--t-xs);color:var(--ink-2);padding:2px 4px}
.sug .dots{display:flex;gap:4px}.sug .dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}.sug .dots i.on{background:var(--ink-3)}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.hb .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:var(--t-xs)}.hb .two b{display:block;margin-bottom:2px}.hb .two ul{margin:0;padding-left:16px;color:var(--ink-2)}
.hb .days{display:flex;flex-direction:column;gap:10px}.hb .day h3{font:600 var(--t-xs) var(--f-body);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.hb .day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hb .day li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;font-size:var(--t-xs)}
.hb .day li .t{font-variant-numeric:tabular-nums;color:var(--ink-2)}.hb .day li .w{display:flex;flex-direction:column;gap:2px;min-width:0}
.hb .day li .w b{font-weight:600;font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:var(--s3)}
.hb .confirm{display:flex;flex-direction:column;gap:8px;margin-top:var(--s3);padding:10px 12px;border:1px solid var(--coral);border-radius:14px;background:var(--coral-soft)}
.hb .confirm p{margin:0;font-weight:600;color:var(--coral-ink)}.hb .confirm div{display:flex;gap:6px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}.btn.danger{color:var(--coral-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}.btn.ghost:hover{border-color:var(--line-strong)}
/* stuck work: neutral, not "needs you now" */
.stk{display:flex;flex-direction:column;gap:var(--s2);margin:0 0 var(--s6);padding:var(--s3) var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:22px}
.stl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stl li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:8px 10px 8px 14px;border:1px solid var(--line);border-radius:14px}
.sk-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.sk-tx .tt1{min-width:0;font-weight:600;font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sk-tx .id{font-weight:500;margin-right:6px}
.sk-tx .why{font-size:var(--t-xs);color:var(--ink-3)}
.stl .acts{margin:0;gap:6px;flex-wrap:nowrap}
.sk-old summary{cursor:pointer;width:max-content;font-size:var(--t-xs);color:var(--ink-3)}.sk-old[open] summary{margin-bottom:var(--s2)}
.icon-btn{flex:none;width:36px;height:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);cursor:pointer;font-size:15px}
.icon-btn:hover{border-color:var(--ink-3)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* board: the working day. Pick a ticket, work it with Claude, review it, report at the end of the day. Every list is
   one line per item and capped, so 0, 1 or 50 of anything stays readable. Quiet colour: coral is the only signal
   colour and means "needs you now"; everything else is neutral, the pets are the only other colour. */
.app{max-width:1240px;margin:0 auto;padding:var(--s6) clamp(16px,3vw,32px) var(--s12)}
.ib{flex:none;display:grid;place-items:center;width:30px;height:30px;border:1px solid transparent;background:none;border-radius:var(--pill);color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1}
.ib:hover{border-color:var(--line-strong);color:var(--ink);background:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.d-top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s4);margin-bottom:var(--s4)}
.d-hi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.d-hi h2{font-size:var(--t-2xl)}
.d-hi h2::first-letter{text-transform:uppercase}
.d-hi p{margin:0;font-size:var(--t-sm);color:var(--ink-3)}
.dh{display:flex;align-items:center;gap:var(--s2);min-height:30px}
.dh h2{font-size:var(--t-lg)}
.dh .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.dh .n{font:600 var(--t-xs)/1 var(--f-body);color:var(--ink-2);background:var(--line);border-radius:var(--pill);padding:4px 8px}
.dh .tools{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:var(--t-xs);color:var(--ink-2)}
.blank{margin:0;padding:var(--s4);border:1px dashed var(--line-strong);border-radius:18px;font-size:var(--t-sm);color:var(--ink-3)}
.blank .acts{margin-top:var(--s3)}
.dsec{display:flex;flex-direction:column;gap:var(--s3);min-width:0;scroll-margin-top:76px}
.dsec>.note{margin:0;font-size:var(--t-xs);color:var(--ink-3)}
.dsec .card{padding:var(--s3) var(--s4);border-radius:16px}
.flow{list-style:none;margin:0 0 var(--s6);padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.flow li{position:relative;min-width:0}
.flow li+li::before{content:"›";position:absolute;left:calc(var(--s3) / -2);top:50%;transform:translate(-50%,-50%);color:var(--ink-3);font-size:18px;line-height:1}
.step{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:left;cursor:pointer;transition:border-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.step:hover{border-color:var(--line-strong);box-shadow:var(--lift)}
.step b{font:700 var(--t-2xl)/1 var(--f-display)}
.step span{font-size:var(--t-xs);font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"doing todo" "verify todo" "done todo" "loose todo";grid-template-rows:auto auto auto 1fr;gap:var(--s8);align-items:start}
.dg>[data-area=doing]{grid-area:doing}.dg>[data-area=verify]{grid-area:verify}.dg>[data-area=done]{grid-area:done}.dg>[data-area=loose]{grid-area:loose}.dg>[data-area=todo]{grid-area:todo}
.sprite{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--sunk)}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--ink-3)}
.meter{width:64px;height:6px;border-radius:var(--pill);background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink-3);transform-origin:left;transform:scaleX(var(--v));transition:transform 250ms var(--ease)}
.meter.low i{background:var(--coral)}
.meter.unk i{background:var(--n-300)}
.pill{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px var(--s3);border-radius:var(--pill);font-size:var(--t-sm);font-weight:600;background:var(--line);color:var(--ink-2)}
.st-waiting .pill{background:var(--coral);color:var(--on-pop)}
.sprite.sm{width:36px;height:36px;border-radius:10px}
.eye{transform-box:fill-box;transform-origin:center}
.st-working .eye{animation:blink 4.2s infinite}
.st-waiting .sprite svg{animation:hop 900ms var(--ease) infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.15)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
/* a line of state: grey dot, coral only when it needs you */
.ac{display:flex;align-items:center;gap:6px;min-width:0;font-size:var(--t-xs);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--n-300)}
.st-waiting .ac{color:var(--coral-ink);font-weight:600}.st-waiting .ac::before{background:var(--coral)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:var(--t-xs);color:var(--ink-3);white-space:nowrap}
.low{color:var(--coral-ink);font-weight:600}
/* approvals: one queue, oldest first */
.aq{display:flex;flex-direction:column;gap:var(--s3);margin:0 0 var(--s6);padding:var(--s4);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:inset 4px 0 0 var(--coral);scroll-margin-top:76px}
.aql,.trl,.vrl,.dl,.il,.sl,.tk-ss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.aql{gap:6px}
.ap{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:16px}
.ap-tx{min-width:0;display:flex;flex-direction:column;gap:4px}
.ap-who{display:flex;align-items:baseline;gap:6px;min-width:0;padding:0;border:0;background:none;text-align:left;cursor:pointer;font-size:var(--t-xs);color:var(--ink-3)}
.ap-who .id{flex:none;font-weight:500;font-size:var(--t-sm)}
.ap-who .tt{min-width:0;font-weight:600;font-size:var(--t-sm);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-who:hover .tt{text-decoration:underline;text-underline-offset:2px}
.ap-who .pj{flex:none;white-space:nowrap}
.ap-who .pj::before{content:"· "}
.ap-what{display:flex;align-items:flex-start;gap:8px;min-width:0}
.ap-what .vb{flex:none;padding-top:2px;font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}
.ap-what code{flex:1;min-width:0;padding:2px 8px;border:0;background:var(--sunk);border-radius:8px;font:500 var(--t-xs)/1.6 var(--f-mono);overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ap-what code.full{display:block;max-height:40vh;overflow:auto}
.ap-note{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.ap-note .more{margin:0}
.risk{font-size:var(--t-xs);font-weight:600;color:var(--coral-ink)}
.ap .acts,.vr .acts{margin:0;gap:6px;flex-wrap:nowrap;align-items:center}
.ap .note{margin:0;font-size:var(--t-xs);max-width:22ch}
/* tickets in progress: one line each, details on demand */
.grps{display:flex;flex-direction:column;gap:var(--s4)}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.gh{display:flex;align-items:center;gap:var(--s2);padding:0 4px;font-size:var(--t-xs);color:var(--ink-3);min-width:0}
.gh .egg{flex:none;width:14px;height:16px;filter:grayscale(1);opacity:.5}
.gh b{font:600 var(--t-sm) var(--f-display);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.gh .away{flex:none;padding:1px 8px;border-radius:var(--pill);background:var(--line);color:var(--ink-2);font-weight:500}
.gh .n{margin-left:auto;flex:none}
.tr{background:var(--surface);border:1px solid var(--line);border-radius:16px;transition:border-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.tr:hover{border-color:var(--line-strong);box-shadow:var(--lift)}
.tr.st-waiting{box-shadow:inset 3px 0 0 var(--coral)}
.tr-main{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto 14px;align-items:center;gap:12px;padding:7px 12px 7px 7px;border:0;background:none;border-radius:inherit;text-align:left;cursor:pointer}
.stack{position:relative;display:block}
.stack .cnt{position:absolute;right:-6px;bottom:-4px;min-width:18px;padding:0 4px;border:2px solid var(--surface);border-radius:var(--pill);background:var(--ink);color:var(--n-50);font-size:10px;font-weight:700;line-height:14px;text-align:center}
.tr-tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.tt1{font-weight:600;font-size:var(--t-sm);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt1 .id,.dl .id,.il .id{color:var(--ink-3);font-weight:500;margin-right:6px}
.chev{color:var(--ink-3);font-size:12px;transition:transform 120ms var(--ease)}
[aria-expanded=true] .chev{transform:rotate(180deg)}
.tr-x{display:flex;flex-direction:column;gap:8px;padding:2px 12px 12px}
.ts{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 12px 6px 6px;border:0;background:var(--sunk);border-radius:14px;text-align:left;cursor:pointer}
.ts:hover{box-shadow:inset 0 0 0 1px var(--line-strong)}
.ts .lp{font-size:var(--t-xs);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{margin:0;font-size:var(--t-xs);color:var(--coral-ink)}
.hint .lnk{font-weight:600}
.tk-f{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
/* waiting for review */
.vr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 12px;padding:10px 10px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.vr .sum{margin:2px 0 0;font-size:var(--t-xs);color:var(--ink-2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
/* done today */
.dl li{display:flex;align-items:center;gap:var(--s2);min-width:0;padding:7px 12px;border-radius:12px;background:color-mix(in oklch,var(--surface) 55%,var(--bg));border:1px solid var(--line);font-size:var(--t-sm)}
.dl .ok{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--ink-2);font-size:12px;font-weight:700}
.dl .id{flex:none;margin:0}
.dl .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .at{flex:none;font-size:var(--t-xs);color:var(--ink-3)}
.d-acts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.dup{font-size:var(--t-xs);font-weight:700;color:var(--ink-2);white-space:nowrap}
.why{margin:0;font-size:var(--t-xs);color:var(--ink-3)}
.stg{display:flex;flex-direction:column;gap:4px}
.stp{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.stp li{font-size:var(--t-xs);padding:2px 8px;border-radius:var(--pill);background:var(--line);color:var(--ink-3)}
.stp li.past{color:var(--ink-2)}
.stp li.cur{background:var(--ink);color:var(--n-50);font-weight:600}
.dl .ib{width:24px;height:24px;margin:-4px -6px -4px 0;font-size:13px;opacity:0}
.dl li:hover .ib,.dl .ib:focus-visible{opacity:1}
/* to do: one line per issue, search and project filter once the list is long */
.tf{display:flex;flex-wrap:wrap;gap:var(--s2)}
.tf input,.tf select{min-height:36px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--pill);background:var(--surface);color:var(--ink);font-size:var(--t-sm)}
.tf input{flex:1 1 12em;min-width:0}
.tf select{flex:0 1 auto;max-width:100%}
.nx{display:flex;align-items:center;gap:var(--s3);margin:0 0 var(--s3);padding:var(--s3) var(--s3) var(--s3) var(--s4);background:var(--surface);border:1px solid var(--line-strong);border-radius:16px}
.nx .egg{flex:none;width:27px;height:30px}
.nx-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:var(--t-sm)}
.nx-k{font-size:var(--t-xs);font-weight:600;color:var(--ink-3)}
.nx-tx .tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx-tx .id{color:var(--ink-3);font-weight:500;margin-right:6px}

.stbox dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px var(--s3);margin:0;font-size:var(--t-sm)}

.ir-main .id{flex:none;min-width:2.6em;margin:0}

.dfold>summary::before{content:"▸";transition:transform 120ms var(--ease)}
.dfold[open]>summary::before{transform:rotate(90deg)}
.dfold[open]>summary{margin-bottom:var(--s2)}
/* a session on no ticket */
.sr-main{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:var(--s3);width:100%;padding:8px 14px 8px 8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:left;cursor:pointer;transition:border-color 120ms var(--ease),box-shadow 120ms var(--ease)}
.sr-main:hover{border-color:var(--line-strong);box-shadow:var(--lift)}

.sr-tx{min-width:0;display:flex;flex-direction:column;gap:2px}

/* a narrow window: the four counters become tabs, one section at a time; the approvals stay on top */

  .ap{grid-template-columns:36px minmax(0,1fr)}.ap .acts,.ap>.note{grid-column:1/-1;flex-wrap:wrap;max-width:none}.stl li{grid-template-columns:minmax(0,1fr)}
  .ap-who{flex-wrap:wrap}.ap-who .pj{flex-basis:100%}.ap-who .pj::before{content:none}
  .vr{grid-template-columns:minmax(0,1fr)}.vr .acts{flex-wrap:wrap}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:var(--s6)}

code{font:500 var(--t-sm)/1.5 var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px var(--s2);overflow-wrap:anywhere}

/* a session's details: a drawer from the right, over the board */
.scrim{position:fixed;inset:0;z-index:30;background:oklch(20% .02 266 / .35)}
.pane{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(620px,100vw);overflow:hidden auto;overflow-wrap:anywhere;background:var(--surface);box-shadow:-8px 0 32px #0003;padding:var(--s6) clamp(16px,3vw,28px) var(--s12)}

.pane-line{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;margin-top:var(--s4)}

.pane-acts .btn{flex:1 1 auto}

.pane p{margin:0}
.ask{margin-top:var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r-lg);background:var(--coral-soft);border:1px solid var(--coral);font-size:var(--t-sm)}

.log time{grid-column:1;grid-row:1;font-size:var(--t-xs);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}

.sidecard{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:var(--s2) var(--s3);background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:border-color 150ms var(--ease)}

/* settings */
.set-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:var(--s8);max-width:1180px;margin:0 auto;padding:var(--s6)}

.preview{position:relative;aspect-ratio:16/10;border-radius:var(--r-lg);background:var(--n-200);border:1px solid var(--line-strong);overflow:hidden}
.preview .pv-bar{position:absolute;left:0;right:0;top:0;height:7%;background:var(--n-300)}
.preview .pv-dock{position:absolute;left:28%;right:28%;bottom:3%;height:8%;border-radius:var(--r-md);background:var(--n-300)}
.preview .pv-work{position:absolute;left:0;right:0;top:7%;bottom:13%}
.preview .band{position:absolute;left:var(--zs);width:calc(var(--ze) - var(--zs));bottom:0;height:calc(var(--ps) + 12px);background:var(--sky-soft);border:1px dashed var(--sky);border-radius:var(--r-md) var(--r-md) 0 0;transition:left 200ms var(--ease),width 200ms var(--ease)}
.preview.top .band{bottom:auto;top:0;border-radius:0 0 var(--r-md) var(--r-md)}
.preview .mini{position:absolute;bottom:6px;width:var(--ps);height:var(--ps);opacity:var(--op);transition:left 200ms var(--ease)}
.preview.top .mini{bottom:auto;top:6px}
.preview .mini svg{width:100%;height:100%}
/* Show when needed: no band; a pet rises under its balloon from below the screen to past the top, again and again. */
.preview .ride{position:absolute;bottom:-45%;left:calc(var(--rx) - var(--ps) / 2);width:var(--ps);opacity:var(--op);animation:pv-rise 5s linear infinite}
.preview .ride .bln{display:block;width:50%;margin:0 auto}

@keyframes pv-rise{to{bottom:105%}}
@media (prefers-reduced-motion:reduce){.preview .ride{animation:none;bottom:6px}}
.preview .hidden{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--ink-2);background:color-mix(in oklch,var(--bg) 70%,transparent)}
.saved{align-self:flex-start;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);padding:2px var(--s3);border-radius:var(--pill);background:var(--mint-soft);opacity:0;transition:opacity 200ms var(--ease)}
.saved.on{opacity:1}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:var(--s2) var(--s6) var(--s2)}
.sec+.sec{margin-top:var(--s6)}
.sec h2{font-size:var(--t-lg);padding:var(--s4) 0 var(--s3)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3) var(--s6);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--line)}

.ctl{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;justify-content:flex-end}

select,input[type=number]{min-height:40px;padding:0 var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);font-size:var(--t-sm)}
input[type=number]{width:104px}
.fb{width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-sizing:border-box;padding:var(--s6);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);box-shadow:var(--lift)}

.fb input,.fb textarea{width:100%;box-sizing:border-box;padding:var(--s2) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit}
.fb textarea{min-height:96px;resize:vertical}
.fb details{margin-top:var(--s3);font-size:var(--t-sm);color:var(--ink-2)}
.fb summary{cursor:pointer}
.fb pre{margin:var(--s2) 0 0;padding:var(--s3);max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--n-100);border-radius:var(--r-md);font-size:var(--t-xs)}

.pd-grid{display:flex;gap:var(--s6);flex-wrap:wrap;margin-top:var(--s4)}

.pd-info{min-height:1.4em;margin:0;font-size:var(--t-xs);color:var(--ink-3)}
/* the outline colour: a card under its switch, the code field beside its title so the swatches get the full width */

.pd-oc-top:has(.pd-err:not([hidden])) .lbl{display:none}
.pd-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pd-sw{width:26px;height:26px;padding:0;border:1px solid oklch(30% 0.04 262 / .2);border-radius:50%;background:var(--c);cursor:pointer;transition:box-shadow 150ms var(--ease)}
.pd-sw.auto{width:auto;padding:0 var(--s2);border-radius:var(--pill);border-color:var(--line-strong);background:var(--surface);font-size:var(--t-xs);font-weight:600;color:var(--ink-2)}

.fb .pd-oc input[type=color]{flex:none;width:26px;height:26px;padding:3px;border:0;border-radius:50%;background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red);cursor:pointer}

.fb .pd-oc input[type=text]{flex:none;width:9.5em;min-height:32px;padding:var(--s1) var(--s2);font-family:var(--f-mono);font-size:var(--t-xs)}
.fb .pd-oc input[aria-invalid="true"]{border-color:var(--coral)}
.pd-err{margin:0;font-size:var(--t-xs);font-weight:600;color:var(--coral-ink)}
/* Save and Cancel stay in view when a short window makes the dialog scroll (same spacing as .acts when it does not) */
.pd .acts{position:sticky;bottom:calc(var(--s6) * -1);margin:var(--s1) 0 calc(var(--s6) * -1);padding:var(--s3) 0 var(--s6);background:var(--surface)}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px oklch(30% 0.04 262 / .3);transition:transform 150ms var(--ease)}

.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--n-200);padding:3px;border-radius:var(--pill)}

.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.rng-row{display:flex;align-items:center;gap:var(--s3)}
.rng{appearance:none;-webkit-appearance:none;width:min(260px,52vw);height:6px;border-radius:var(--pill);background:linear-gradient(var(--ink),var(--ink)) 0 0 / var(--fill, 50%) 100% no-repeat,var(--n-200);cursor:pointer}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--n-50);border:2px solid var(--ink);box-shadow:var(--lift)}
.val{min-width:56px;text-align:right;font-size:var(--t-sm);font-weight:600;color:var(--ink-2)}
.zone{display:flex;flex-direction:column;gap:var(--s3);width:100%}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);padding:4px var(--s3);min-height:32px;font-size:var(--t-sm);cursor:pointer;transition:border-color 150ms var(--ease)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--n-100);font-weight:600}
.zone .pair{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center}
.zone .pair label{font-size:var(--t-sm);color:var(--ink-2);min-width:40px}
.zone .rng{width:100%}
.btn.danger{color:var(--coral-ink)}
.acts{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s4)}

/* setup */
.setup-wrap{max-width:860px;margin:0 auto;padding:var(--s6) clamp(12px,2vw,28px);display:flex;flex-direction:column;gap:var(--s6)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s6);align-items:center}
.hero .sprite{width:88px;height:88px;border-radius:var(--r-lg)}
.hero h2{font-size:var(--t-xl);margin-bottom:var(--s1)}
.hero .note{margin:0 0 var(--s3)}
.state{display:inline-flex;align-items:center;gap:var(--s2);padding:4px var(--s3);border-radius:var(--pill);font-weight:600;font-size:var(--t-sm)}
.state.ok{background:var(--mint-soft)}.state.bad{background:var(--coral-soft);color:var(--coral-ink)}
.intro{display:grid;gap:var(--s4);margin-bottom:var(--s4)}.intro:empty{display:none}
.intro .card h2{display:flex;align-items:center;gap:var(--s3)}.intro .acts{margin-top:var(--s4)}
.guide{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3) var(--s6)}
.guide li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--s3);align-items:center;font-size:var(--t-sm)}
.guide .sprite{width:40px;height:40px}.guide .st-waiting .sprite{background:var(--coral-soft);box-shadow:inset 0 0 0 1px var(--coral)}.guide .st-done .sprite{background:var(--mint-soft)}.guide .st-idle .sprite svg{opacity:.6}.guide-more{margin:var(--s4) 0 0;padding-left:1.2em;font-size:var(--t-sm);display:grid;gap:var(--s2)}
/* the tour of what is new: the element a step points at stays lit, the rest dims; one bubble beside it */
.tour{position:fixed;inset:0;z-index:50}
.tour-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 2px var(--ink),0 0 0 100vmax oklch(20% .02 266 / .55);pointer-events:none;transition:all 200ms var(--ease)}
.tour-hole.none{left:50%!important;top:50%!important;width:0!important;height:0!important;box-shadow:0 0 0 100vmax oklch(20% .02 266 / .55)}
.tour-pop{position:fixed;display:flex;flex-direction:column;gap:var(--s2);max-height:calc(100dvh - 24px);overflow:auto;padding:var(--s4) var(--s4) var(--s3);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--lift)}
.tour-pop h2{font-size:var(--t-lg)}
.tour-pop p{margin:0;font-size:var(--t-sm);color:var(--ink-2)}
.tour-pop .n{font-size:var(--t-xs);font-weight:600;color:var(--ink-3)}
.tour-pop .acts{margin:var(--s1) 0 0;justify-content:flex-end;gap:var(--s2)}
.tour-pop .acts .skip{margin-right:auto}
.tour-art{display:flex;gap:var(--s2)}
.tour-art .sprite{width:36px;height:36px;border-radius:10px}
.tour-art .st-waiting .sprite{background:var(--coral-soft);box-shadow:inset 0 0 0 1px var(--coral)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:var(--s4);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--line)}
.steps .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:var(--t-sm);background:var(--n-200)}
.steps li.done .num{background:var(--ink);color:var(--n-50)}
.steps .lbl{font-weight:600}
.steps .desc{font-size:var(--t-sm);color:var(--ink-3)}
.kv{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:var(--s3) var(--s4);align-items:center;font-size:var(--t-sm);margin-top:var(--s2)}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.card .note{margin-top:var(--s3)}

.toasts{position:fixed;right:var(--s6);bottom:var(--s6);z-index:40;display:flex;flex-direction:column;gap:var(--s2);width:min(360px,calc(100vw - 32px))}
.toast{display:flex;gap:var(--s3);align-items:center;padding:var(--s3);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--lift);font-size:var(--t-sm);text-align:left;animation:toast-in 250ms var(--ease)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}}

.cmd{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-top:var(--s2)}
.cmd code{font-size:var(--t-xs)}
.keys{display:grid;gap:var(--s2);width:100%}.keys label{display:flex;gap:var(--s2);align-items:center;justify-content:space-between}.keys input{width:8em;text-transform:uppercase}
.gitkv{grid-template-columns:max-content minmax(0,1fr)}
.gitkv dd{overflow-wrap:anywhere;display:block}
.gitkv code{overflow-wrap:anywhere}
.lnk{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
@media (max-width:980px){
  .set-wrap{grid-template-columns:minmax(0,1fr)}
  .set-side{position:static}
}
@media (max-width:720px){
  .bar{padding:var(--s3) var(--s4)}
  .opt{grid-template-columns:1fr}
  .ctl{justify-content:flex-start}
  .kv{grid-template-columns:1fr}
}
@media (max-width:560px){.bar h1{display:none}.tab{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
// The panel shows after 1 s at the latest. Set first, so an error further down cannot leave it hidden (body.boot).
setTimeout(() => document.body.classList.remove('boot'), 1000);
const IDLE_AFTER = 10 * 60e3;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Side sessions started from a Claude desktop session (parent = that session's id in Bobix).
const kidsOf = s => list.filter(x => x.parent === s.id);
// Within one group: each parent followed by its side sessions.
function familyOrder(items) {
  const ids = new Set(items.map(s => s.id)), out = [];
  for (const s of items) if (!(s.parent && ids.has(s.parent))) { out.push(s); out.push(...items.filter(k => k.parent === s.id)); }
  return out;
}
const titleOf = id => { const p = id && list.find(x => x.id === id); return p ? p.title || p.name : ''; };
const secsLeft = s => (!s.answer ? 0 : s.answer.until == null ? Infinity : Math.max(0, Math.ceil((s.answer.until - Date.now()) / 1000))); // Infinity: waits until answered
const look = s => s.state === 'idle' || (s.state === 'done' && Date.now() - s.since > IDLE_AFTER) ? 'idle' : s.state;
// Same rule as the pets overlay: hidden by hand, or asleep past the "leave after" time.
const offScreen = s => {
  const mins = state?.settings?.sleepHide || 0;
  if (s.pet === 'hidden') return true;
  return s.pet !== 'shown' && look(s) === 'idle' && mins > 0 && Date.now() - (s.state === 'done' ? s.since + IDLE_AFTER : s.since) > mins * 60e3;
};
const bridge = window.bobix; // only inside the app
let lang = navigator.language, state = null; // state = app state (settings, hooks, displays) when in the app
const T = (k, v) => I18N.t(lang, k, v);

function translate() {
  document.documentElement.lang = I18N.pick(lang);
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.documentElement.style.setProperty('--open', JSON.stringify(T('group.open')));
  document.documentElement.style.setProperty('--close', JSON.stringify(T('group.close')));
}
function toast(text, action) {
  if ([...$('#toasts').children].some(t => t.dataset.text === text)) return; // already on screen (e.g. Open session clicked twice)
  const el = document.createElement('div');
  el.dataset.text = text;
  el.className = 'toast';
  el.innerHTML = `<span style="flex:1">${esc(text)}</span>${action ? `<button class="btn" type="button">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { el.remove(); action.run(); };
  $('#toasts').prepend(el);
  setTimeout(() => el.remove(), action ? 10000 : 6000);
}

// ---------- tabs ----------
function showTab(name) {
  if (name === 'feedback') return openFeedback(); // from the tray, over whichever tab is open
  if (name === 'work') { tab = 'todo'; name = 'sessions'; } // the issues are the board's To do section
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  for (const n of ['sessions', 'settings', 'setup']) $(`#tab-${n}`).hidden = n !== name;
  if (name === 'sessions') render();
  if (name === 'setup') renderSetup();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ---------- sessions board ----------
function ago(t) {
  const m = Math.floor((Date.now() - t) / 60e3);
  return m < 1 ? T('ago.now') : m < 60 ? T('ago.min', { n: m }) : m < 1440 ? T('ago.h', { n: Math.floor(m / 60) }) : T('ago.d', { n: Math.floor(m / 1440) });
}
function statusText(s, st) {
  if (st === 'working') return s.tool ? T('status.working', { tool: I18N.toolLabel(lang, s.tool) }) : T('status.thinking');
  if (st === 'waiting') return s.askTool ? T('status.waitingTool', { tool: s.askTool }) : T('status.waiting');
  return T(`status.${st}`);
}
const line2 = (s, st) => st === 'done' && s.summary ? T('line.report') + s.summary : s.quest || T('line.noQuest');
function logHTML(l, open) {
  if (l.kind !== 'tool') return esc(T(`log.${l.kind}`, { x: l.text }));
  const tool = esc(LOG.cap(I18N.toolLabel(lang, l.tool), I18N.pick(lang))), n = l.n > 1 ? `<span class="n">×${l.n}</span>` : '';
  return (l.text ? T('log.tool', { tool, x: `<span class="arg" title="${esc(l.text)}">${esc(open ? l.text : LOG.mid(l.text)).replace(/\//g, '/<wbr>')}</span>` }) : tool) + n;
}
// Clamped text with a "Show more" toggle; the toggle shows only when there is more (see showMore).
function moreHTML(key, html, cls = '', cut = false) {
  const open = moreOpen.has(key);
  return `<div class="clamp${cls ? ' ' + cls : ''}${open ? ' open' : ''}" data-k="${esc(key)}">${html}</div>`
    + `<button class="more" type="button" data-more="${esc(key)}"${cut ? ' data-cut' : ''} hidden>${T(open ? 'pane.less' : 'pane.more')}</button>`;
}
// After drawing: a toggle is shown for text that is open, cut by the clamp, or shortened (a long command).
function showMore(root) {
  root.querySelectorAll('[data-more]').forEach(b => {
    const box = b.previousElementSibling, over = box.scrollHeight > box.clientHeight + 1;
    b.hidden = !(box.classList.contains('open') || over || b.hasAttribute('data-cut'));
    box.classList.toggle('over', over);
  });
}
let list = [], selected = new URLSearchParams(location.search).get('s');
let hint = null; // why a pet or notification click could not open the selected session: { id, reason, app, folder }
let reportOpen = true; // the final report folded or not: kept while the panel is open, for every session
const moreOpen = new Set(); // Quest and log lines opened with "Show more" (the pane is redrawn on every log line)

// ---------- board: the working day ----------
// Pick a ticket (To do) → work it with Claude (In progress, approvals on top) → review it (an open PR / MR closes it)
// → done today → the end-of-day report. Drawn whole as HTML, skipped when nothing changed; focus survives a redraw.
const AQ_MAX = 3, VER_MAX = 4, DONE_MAX = 5, PER_GROUP = 4;
const narrow = () => matchMedia('(max-width:819px)').matches;
let tab = null; // a narrow window's section (todo | doing | verify | done); null: in progress while a ticket runs or waits
const opened = new Set(); // lists opened past their cap ('aq', 'verify', 'done', 'g:<path>'), tickets ('t:<key>'), commands ('c:<id>')
let query = '', proj = 'all', nextFocus = null, st = BOARD.stages(null, []);
const flip = k => (opened.has(k) ? opened.delete(k) : opened.add(k));
const pet = (s, cls = 'sm') => `<span class="sprite ${cls}">${petArt(list.find(x => x.id === s.parent) || s, look(s), petColor(s, list))}</span>`;
const lowCtx = hp => (hp != null && hp < 25 ? `<span class="low" title="${esc(T('ctx'))}">${esc(T('ctx'))} ${hp}%</span>` : ''); // context only when low
const head = (k, title, n, tools = '') => `<div class="dh">${k === 'aq' ? '<i class="dot"></i>' : ''}<h2 id="h-${k}">${esc(title)}</h2>${n != null ? `<span class="n">${n}</span>` : ''}${tools ? `<span class="tools">${tools}</span>` : ''}</div>`;
const moreBtn = (k, rest, label) => `<button class="more" type="button" data-flag="${esc(k)}" data-f="flag:${esc(k)}">${esc(opened.has(k) ? T('day.less') + ' ▴' : (label || T('day.more', { n: rest })) + ' ▾')}</button>`;
const webBtn = i => (bridge && i.url ? `<button class="ib" type="button" data-url="${esc(i.url)}" aria-label="${esc(T('work.open'))} #${i.iid}" title="${esc(T('work.open'))}">↗</button>` : '');
const ticketOf = s => [...st.doing, ...st.verify].find(x => x[2].some(y => y.id === s.id));
const leadSt = ss => ss.map(look).sort((a, b) => BOARD.PRI[a] - BOARD.PRI[b])[0] || 'idle';

// One permission request: who asks, what (whole on demand), and the answers while Bobix holds it.
function apRow(s) {
  const t = ticketOf(s), a = s.answer, held = !!(secsLeft(s) && bridge), text = a?.full || s.ask, long = text.length > 90 || text.includes('\n');
  const who = t ? `<span class="id">#${t[0].iid}</span><span class="tt" title="${esc(t[0].title)}">${esc(t[0].title)}</span>` : `<span class="tt">${esc(s.title || s.name)}</span>`;
  const left = held && secsLeft(s) !== Infinity ? T('ask.left', { n: secsLeft(s) }) : '';
  const where = [t ? BOARD.short(t[1].path) : s.name, ago(s.since), left].filter(Boolean).join(' · ');
  const note = (a?.risky ? `<span class="risk">${esc(T('day.risky'))}</span>` : '') + (long ? moreBtn('c:' + s.id, 0, T('day.cmdAll')) : '');
  return `<li class="ap st-waiting">${pet(s)}
    <div class="ap-tx"><button class="ap-who" type="button" data-sel="${esc(s.id)}">${who}<span class="pj">${esc(where)}</span></button>
      <div class="ap-what"><span class="vb">${esc(s.askTool ? I18N.toolLabel(lang, s.askTool) : T('status.waiting'))}</span><code class="${opened.has('c:' + s.id) ? 'full' : ''}">${esc(text)}</code></div>
      ${note ? `<div class="ap-note">${note}</div>` : ''}</div>
    ${held ? `<div class="acts"><button class="btn sm pri" type="button" data-choice="allow" data-s="${esc(s.id)}" data-f="allow:${esc(s.id)}">${T('ask.allow')}</button><button class="btn sm" type="button" data-choice="deny" data-s="${esc(s.id)}">${T('ask.deny')}</button></div>`
      : `<p class="note">${esc(T(approveWhere(s)))}</p>`}</li>`;
}
const waitingList = () => list.filter(s => look(s) === 'waiting').sort((a, b) => a.since - b.since);
// ---------- habits (#80): what Bobix remembers of your work, and a few suggestions from it ----------
// habitData: { on, events, bytes, days, dir } from the app (only while Settings → habits is on); read again every
// 5 minutes and after a change. habOpen: the suggestion whose details show; habUndo: the last "Không cần".
let habitData = null, habOpen = null, habUndo = null, habConfirm = false;
async function loadHabits() {
  habitData = bridge && state?.settings?.habitsOn ? await bridge.habitsRead().catch(() => null) : null;
  render();
  if (!$('#tab-settings').hidden) renderSettings();
}
setInterval(() => state?.settings?.habitsOn && loadHabits(), 5 * 60e3);
const habitCtx = () => ({ model, sessions: list });
const habitSug = () => HABITS.suggest(habitData?.events || [], habitCtx(), state?.settings);
const WEEKDAY = d => new Date(2026, 10, 1 + d).toLocaleDateString(LOCALE(), { weekday: 'long' }); // 1 Nov 2026 is a Sunday
const dayName = t => (HABITS.dayOf(t) === HABITS.dayOf(Date.now() - 864e5) ? T('hab.yesterday') : WEEKDAY(new Date(t).getDay()));
const timeOf = t => new Date(t).toLocaleTimeString(LOCALE(), { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function habCard(c) {
  const code = x => `<code>${esc(x)}</code>`;
  const map = {
    morning: [T('hab.morning.t', { n: c.iid, d: dayName(c.at) }), T('hab.morning.why', { p: HABITS.base(c.dir), t: timeOf(c.at), d: dayName(c.at) }), T('hab.morning.go')],
    allow: [T('hab.allow.t', { x: code(c.what), n: c.count }), T('hab.allow.why', { p: HABITS.base(c.dir) }), T('hab.allow.go')],
    recurring: [T('hab.rec.t.' + c.what, { d: WEEKDAY(c.weekday), t: HABITS.hhmm(c.at) }), T('hab.rec.why', { n: c.count, a: HABITS.hhmm(c.from), b: HABITS.hhmm(c.to), d: WEEKDAY(c.weekday), w: T('hab.rec.w.' + c.what) }), T('hab.rec.go.' + c.what)],
    skill: [T('hab.skill.t', { p: esc(HABITS.base(c.dir)), x: code('/' + c.skill) }), T('hab.skill.why', { n: c.count, m: c.of, p: HABITS.base(c.dir), x: '/' + c.skill }), T('hab.skill.go')],
  }[c.kind];

function eggSVG(seed) {
  const BODY = ['--sky', '--mint', '--lilac', '--peach', '--butter', '--rose'];
  const col = `var(${BODY[hashStr(seed) % BODY.length]})`, line = `color-mix(in oklch, ${col} 45%, #1d2030)`, shine = 'oklch(98% 0.01 90 / .9)';

  const on = new Set(); rows.forEach((r, y) => [...r].forEach((c, x) => c === 'x' && on.add(`${x},${y}`)));
  const px = (x, y, f) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`;
  let r = hashStr(seed + 'spots'), out = '';
  const spots = new Set(); for (let i = 0; i < 4; i++) { r = Math.imul(r ^ (r >>> 13), 2654435761) >>> 0; spots.add(`${2 + r % 5},${3 + (r >>> 8) % 5}`); }
  for (const k of on) { const [x, y] = k.split(',').map(Number); const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => !on.has(`${x + a},${y + b}`)); out += px(x, y, edge ? line : spots.has(k) ? shine : col); }
  return `<svg viewBox="0 0 9 10" shape-rendering="crispEdges" aria-hidden="true">${out + px(3, 1, shine) + px(2, 2, shine)}</svg>`;
}

const dndLeft = s => Math.max(0, Math.ceil((s.dndUntil - Date.now()) / 60e3)); // minutes of "do not disturb" left

const fill = (r, v) => `${((v - r.min) / (r.max - r.min)) * 100}%`;

function control(r, s) {
  const v = r.get ? r.get(s) : s[r.k], id = `f-${r.k}`;
  if (r.type === 'switch') return `<input type="checkbox" role="switch" class="sw" id="${id}" data-k="${r.k}" ${v ? 'checked' : ''}>`;
  if (r.type === 'select') return `<select id="${id}" data-k="${r.k}">${r.opts().map(([o, l]) => `<option value="${esc(o)}" ${String(v) === o ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  if (r.type === 'seg') return `<div class="seg" role="radiogroup" aria-labelledby="l-${r.k}">${r.opts().map(([o, l]) =>
    `<button type="button" role="radio" aria-checked="${String(v) === o}" data-k="${r.k}" data-v="${esc(o)}">${esc(l)}</button>`).join('')}</div>`;
  if (r.type === 'number') return `<div class="rng-row"><input type="number" id="${id}" data-k="${r.k}" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" style="width:7em"><span class="val">${T(r.unit)}</span></div>`;
  if (r.type === 'range') return `<div class="rng-row"><input type="range" class="rng" id="${id}" data-k="${r.k}" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" style="--fill:${fill(r, v)}"><output class="val" for="${id}" data-val="${r.k}">${r.fmt(v)}</output></div>`;
  if (r.type === 'zone') {
    const z = { min: 0, max: 100 }, cur = Object.entries(ZONES).find(([, [a, b]]) => a === s.zoneStart && b === s.zoneEnd)?.[0];
    return `<div class="zone">
      <div class="chips">${Object.keys(ZONES).map(n => `<button type="button" class="chip" aria-pressed="${n === cur}" data-zone="${n}">${T('set.zone.' + n)}</button>`).join('')}</div>
      ${['zoneStart', 'zoneEnd'].map((k, i) => `<div class="pair"><label for="f-${k}">${T(i ? 'set.zone.to' : 'set.zone.from')}</label>
        <input type="range" class="rng" id="f-${k}" data-k="${k}" min="0" max="100" step="5" value="${s[k]}" style="--fill:${fill(z, s[k])}"><output class="val" for="f-${k}" data-val="${k}">${s[k]}%</output></div>`).join('')}
    </div>`;
  }
  if (r.type === 'keys') { // each project's code in session names; the projects are the ones Bobix read issues for
    const gs = [...(work.local || []), ...(work.away || [])];
    if (!gs.length) return `<p class="note">${T('set.workKeys.none')}</p>`;
    return `<div class="keys">${gs.map(g => `<label><span>${esc(g.path)}</span><input type="text" data-key-of="${esc(g.path)}" value="${esc((s.workKeys || {})[g.path] || '')}" placeholder="${esc(g.autoKey)}" maxlength="10" spellcheck="false" autocapitalize="characters"></label>`).join('')}</div>`;
  }
  if (r.type === 'tour') return `<button class="btn" type="button" data-act="tour">${T('set.tour.open')}</button>`;
  if (r.type === 'port') return `<input type="number" id="${id}" min="1024" max="65535" value="${s.port}" aria-labelledby="l-port"><button class="btn" type="button" data-act="port">${T('set.port.apply')}</button>`;
  return `<button class="btn danger" type="button" data-act="reset">${T('set.reset')}</button>`;
}

// Settings → "Bobix nhớ gì về bạn": the switch, what is and is never kept, and while on everything kept, by day.
function habitsSettingsHTML(s) {
  const on = !!s.habitsOn, d = habitData, li = k => `<li>${esc(T(k))}</li>`;
  const ev = d?.events || [], days = HABITS.days(ev), shown = days.slice(0, 7), more = days.length - shown.length;
  const issueName = x => { const i = x.iid != null && (model.issues || []).find(y => y.iid === x.iid && (model.repos || []).some(r => r.path === y.project && r.dirs.some(z => z.path === x.dir))); return x.iid != null ? `#${x.iid}${i ? ' ' + i.title : ''}` : x.branch || HABITS.base(x.dir); };
  const detail = x => [HABITS.base(x.dir), x.asks ? T('hab.set.asks', { n: x.asks, m: Math.round(x.waitMs / 60e3) }) : '', x.skills.map(k => '/' + k).join(', '), x.ended ? T('hab.set.ended') : ''].filter(Boolean).join(' · ');
  const span = x => `${timeOf(x.from)}–${x.ended ? timeOf(x.to) : ''}`;
  const stored = !d ? '' : `<div class="opt wide"><div style="width:100%">
      <div class="lbl">${esc(T('hab.set.stored'))} <span class="note">${esc(T('hab.set.size', { s: Math.max(0, Math.round(d.bytes / 1024)), n: d.days }))}</span></div>
      ${ev.length ? `<div class="days">${shown.map(x => `<section class="day"><h3>${esc(new Date(x.day + 'T12:00').toLocaleDateString(LOCALE(), { weekday: 'long', day: 'numeric', month: 'numeric' }))}</h3><ul>${x.items.map(y => `<li><span class="t">${esc(span(y))}</span><span class="w"><b title="${esc(issueName(y))}">${esc(issueName(y))}</b><span class="note">${esc(detail(y))}</span></span></li>`).join('')}</ul></section>`).join('')}
        ${more > 0 ? `<p class="note">${esc(T('hab.set.more', { n: more }))}</p>` : ''}</div>` : `<p class="note">${esc(T('hab.set.empty'))}</p>`}
      <div class="foot"><span class="note">${esc(T('hab.set.where'))} <code>${esc(String(d.dir || '').replace(/^(\/Users|\/home|[A-Za-z]:\\Users)[\\/][^\\/]+/, '~'))}</code></span>${ev.length ? `<button class="btn sm danger" type="button" data-act="habits-ask">${esc(T('hab.set.wipe'))}</button>` : ''}</div>
      ${habConfirm ? `<div class="confirm" role="alertdialog" aria-labelledby="hab-cf"><p id="hab-cf">${esc(T('hab.set.sure', { n: d.days }))}</p><div><button class="btn sm danger" type="button" data-act="habits-wipe">${esc(T('hab.set.wipe'))}</button><button class="btn sm" type="button" data-act="habits-keep">${esc(T('hab.set.keep'))}</button></div></div>` : ''}
    </div></div>`;
  return `<section class="sec hb" id="sec-habits"><h2>${esc(T('hab.set.title'))}</h2>
    <div class="opt"><div><div class="lbl" id="l-habitsOn">${esc(T('hab.set.switch'))}</div><div class="desc">${esc(T('hab.set.promise'))}</div></div><div class="ctl">${control({ k: 'habitsOn', type: 'switch' }, s)}</div></div>
    <div class="opt wide"><div class="two"><div><b>${esc(T('hab.set.keeps'))}</b><ul>${['hab.set.k1', 'hab.set.k2', 'hab.set.k3', 'hab.set.k4'].map(li).join('')}</ul></div>
      <div><b>${esc(T('hab.set.never'))}</b><ul>${['hab.set.n1', 'hab.set.n2', 'hab.set.n3'].map(li).join('')}</ul></div></div></div>
    ${on ? stored : `<div class="opt wide"><p class="note">${esc(T('hab.set.off'))}</p></div>`}</section>`;
}

// Mini screen: work area, the band pets may use, a few pets at real scale and visibility.
function renderPreview() {
  const box = $('#preview');
  if (!box || !state) return;
  const s = state.settings, W = state.screen?.width || 1920, w = box.clientWidth || 340;
  // Drawn 3x larger than true scale: a real 56 px pet on a 1920 px screen would be a 10 px speck here.
  const ps = Math.round(Math.min(48, Math.max(12, s.size * w / W * 3)));
  const ids = [...list.map(x => x.id), 'bobix-a', 'bobix-b', 'bobix-c'].slice(0, Math.max(3, Math.min(4, list.length)));
  const span = s.zoneEnd - s.zoneStart;
  const pets = ids.map((id, i) => {
    const left = s.zoneStart + span * (i + 0.5) / ids.length;
    return `<span class="mini" style="left:calc(${left}% - ${ps / 2}px)">${creature(id, i === 0 ? 'waiting' : 'working')}</span>`;
  }).join('');
  box.className = 'preview' + (s.edge === 'top' ? ' top' : '');
  box.style.cssText = `--zs:${s.zoneStart}%;--ze:${s.zoneEnd}%;--ps:${ps}px;--op:${s.opacity}`;
  // Show when needed: one pet under its balloon, rising (still near the bottom with reduced motion).
  const ride = `<span class="ride" style="--rx:62%"><span class="bln">${balloonSVG('waiting')}</span><span class="mini-r">${creature(ids[0], 'waiting')}</span></span>`;
  const od = s.petMode === 'ondemand';
  box.classList.toggle('od', od);
  box.innerHTML = `<div class="pv-bar"></div><div class="pv-work">${od ? '' : '<div class="band"></div>'}${s.petsVisible ? (od ? ride : pets) : ''}</div><div class="pv-dock"></div>${s.petsVisible ? '' : `<div class="hidden">${T('set.preview.hidden')}</div>`}`;
}

let savedTimer;
function flashSaved() {
  const el = $('#saved'); if (!el) return;
  el.classList.add('on'); clearTimeout(savedTimer); savedTimer = setTimeout(() => el.classList.remove('on'), 1400);
}
async function save(patch, { rerender = true } = {}) {
  const r = await bridge.setSettings(patch);
  if (r.error) { toast(T('setup.error', { x: r.error })); renderSettings(); return false; }
  const langChanged = 'language' in patch && r.language !== state.settings.language;
  state.settings = r;
  if (langChanged) applyLang(); else if (rerender) renderSettings(); else renderPreview();
  flashSaved();
  return true;
}

$('#settings').addEventListener('input', e => {
  const k = e.target.dataset.k;
  if (!k || e.target.type !== 'range') return;
  let v = Number(e.target.value);
  const r = ROWS.find(x => x.k === k) || { min: 0, max: 100, fmt: x => x + '%' };
  if (k === 'zoneStart' && v > state.settings.zoneEnd - 5) v = e.target.value = state.settings.zoneEnd - 5;
  if (k === 'zoneEnd' && v < state.settings.zoneStart + 5) v = e.target.value = state.settings.zoneStart + 5;
  e.target.style.setProperty('--fill', fill(r, v));
  $(`[data-val="${k}"]`).textContent = r.fmt(v);
  save({ [k]: v }, { rerender: false });
});
$('#settings').addEventListener('change', e => {
  const of = e.target.dataset.keyOf;
  if (of) {
    const v = e.target.value.trim().toUpperCase(), keys = { ...(state.settings.workKeys || {}) };
    if (v && !/^[A-Z][A-Z0-9]{0,9}$/.test(v)) { e.target.value = keys[of] || ''; return toast(T('set.workKeys.bad')); }
    if (v) keys[of] = v; else delete keys[of];
    return save({ workKeys: keys });
  }
  const k = e.target.dataset.k;
  if (!k || e.target.type === 'range') return;
  if (k === 'habitsOn') { habConfirm = false; return save({ habitsOn: e.target.checked }).then(ok => { if (ok) { $('#f-habitsOn')?.focus(); loadHabits(); } }); }
  save({ [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
});
$('#settings').addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.zone) { const [a, b] = ZONES[t.dataset.zone]; return save({ zoneStart: a, zoneEnd: b }); }
  if (t.dataset.k) { const r = ROWS.find(x => x.k === t.dataset.k); return save(r.set ? r.set(t.dataset.v) : { [r.k]: t.dataset.v }); }
  if (t.dataset.act === 'habits-ask') { habConfirm = true; renderSettings(); return $('[data-act="habits-keep"]')?.focus(); }
  if (t.dataset.act === 'habits-keep') { habConfirm = false; renderSettings(); return $('[data-act="habits-ask"]')?.focus(); }
  if (t.dataset.act === 'habits-wipe') {
    habConfirm = false;
    await bridge.habitsClear();
    await loadHabits();
    toast(T('hab.set.wiped'));
    return $('#f-habitsOn')?.focus();
  }
  if (t.dataset.act === 'tour') return tourStart(false);
  if (t.dataset.act === 'port') {
    const v = Number($('#f-port').value);
    if (v === state.settings.port) return;
    if (!Number.isInteger(v) || v < 1024 || v > 65535) return toast(T('setup.error', { x: '1024 – 65535' }));
    return save({ port: v });
  }
  if (t.dataset.act === 'reset') {
    const before = { ...state.settings };
    state.settings = await bridge.resetSettings();
    applyLang();
    toast(T('set.reset.done'), { label: T('set.undo'), run: () => save(before) });
  }
});

async function openFeedback() {

$('#fb-open').onclick = openFeedback;
$('#fb-dialog').addEventListener('input', e => {
  if (e.target.id === 'fb-title') fb.title = e.target.value;
  if (e.target.id === 'fb-desc') fb.description = e.target.value;
});
$('#fb-dialog').addEventListener('click', async e => {
  const box = e.currentTarget, btn = e.target.closest('button');
  if (btn?.dataset.kind) { fb.kind = btn.dataset.kind; return paintFeedback(); }
  if (btn?.dataset.act === 'close') return box.close();

  const title = $('#fb-title');
  if (!fb.title.trim()) { title.setCustomValidity(T('fb.needTitle')); title.reportValidity(); title.setCustomValidity(''); return; }
  const r = await bridge.sendFeedback(fb);
  if (r?.ok) { fb.kind = 'bug'; fb.title = fb.description = ''; box.close(); toast(T(r.truncated ? 'fb.sentCut' : 'fb.sent')); }
});

        </div>
        <div class="pd-sec">
          <div class="pd-nums"><label class="pd-num">${T('pd.colors')}<input type="number" id="pd-colors" data-k="colors" min="4" max="32" step="1"></label><label class="pd-num">${T('pd.accents')}<input type="number" id="pd-accents" data-k="accents" min="0" max="8" step="1" aria-describedby="pd-accents-h"></label></div>
          <p class="hint" id="pd-accents-h">${T('pd.accents.hint')}</p>
        </div>
        <div class="pd-sec">
          ${sw('clean', 'pd.clean')}${sw('removeBg', 'pd.removeBg')}${sw('outline', 'pd.outline')}
          <fieldset class="pd-oc" id="pd-oc">
            <div class="pd-oc-top"><span class="lbl">${T('pd.oc')}</span><p class="pd-err" id="pd-oc-err" role="alert" hidden>${T('pd.oc.bad')}</p><input type="color" id="pd-oc-pick" aria-label="${esc(T('pd.oc.pick'))}" title="${esc(T('pd.oc.pick'))}"><input type="text" id="pd-oc-text" aria-label="${esc(T('pd.oc.code'))}" placeholder="#f0a, rgb(…)" spellcheck="false" autocomplete="off"></div>
            <div class="pd-row pd-sws" role="radiogroup" aria-label="${esc(T('pd.oc'))}"><button type="button" role="radio" class="pd-sw auto" data-oc="" title="${esc(T('pd.oc.autoHint'))}">${T('pd.oc.auto')}</button>${PD_OUTLINES.map(([k, c]) => `<button type="button" role="radio" class="pd-sw" data-oc="${c}" style="--c:${c}" aria-label="${esc(T('pd.oc.' + k))}" title="${esc(T('pd.oc.' + k))}"></button>`).join('')}</div>
          </fieldset>
        </div>
      </div>
    </div>
    <div class="acts"><button class="btn pri" type="button" data-act="save">${T('pd.save')}</button><button class="btn" type="button" data-act="cancel">${T('pd.cancel')}</button></div>`;
  pdControls(); pdShow(r);
  box.showModal();
  box.querySelector('[aria-checked="true"]')?.focus();
}
function pdControls() {
  const o = pd.opts, box = $('#pd-dialog');
  box.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-checked', String(+b.dataset.size === o.size)));
  box.querySelectorAll('[data-look]').forEach(b => b.setAttribute('aria-checked', String((b.dataset.look === 'whole') === !!o.whole)));
  for (const k of ['colors', 'accents']) { const e = $('#pd-' + k); if (e !== document.activeElement) e.value = o[k]; }
  for (const k of ['clean', 'outline', 'removeBg']) $('#pd-' + k).checked = !!o[k];
  const oc = o.outlineColor || '', text = $('#pd-oc-text');
  $('#pd-oc').disabled = !o.outline; // the colour is kept while the outline is off, and comes back with it
  box.querySelectorAll('[data-oc]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.oc === oc)));
  $('#pd-oc-pick').value = oc || '#000000';
  if (text !== document.activeElement) { text.value = oc; pdBad(false); }
}
// A typed outline colour, in any form the browser knows (#hex, rgb(), hsl(), names...) -> '#rrggbb', or null.
// A canvas parses it: fillStyle ignores what is not a colour, so the text is tried from two different colours.
const pdCanvas = document.createElement('canvas').getContext('2d');
function pdColor(text) {
  const v = text.trim(), read = from => { pdCanvas.fillStyle = from; pdCanvas.fillStyle = v; return pdCanvas.fillStyle; };
  const a = read('#000000');
  if (!v || a !== read('#ffffff') || /^currentcolor$/i.test(v)) return null;
  if (/^#[0-9a-f]{6}$/.test(a)) return a;
  const m = /^rgba\((\d+), (\d+), (\d+), ([\d.]+)\)$/.exec(a); // a colour with alpha; the alpha is dropped, all of it is not
  return m && +m[4] > 0 ? '#' + m.slice(1, 4).map(n => (+n).toString(16).padStart(2, '0')).join('') : null;
}
// The error describes the field only while it shows: a hidden element named by aria-describedby is still read out.
function pdBad(on) {
  const t = $('#pd-oc-text');
  $('#pd-oc-err').hidden = !on; t.setAttribute('aria-invalid', String(on));
  if (on) t.setAttribute('aria-describedby', 'pd-oc-err'); else t.removeAttribute('aria-describedby');
}
// While typing, a colour is used as soon as the text is one; the error waits for Enter or leaving the field.
// An empty field on Enter or leaving it goes back to the automatic colour.
function pdTyped(t, done) {
  const v = t.value.trim(), c = pdColor(v);
  pdBad(done && !!v && !c);
  if (!c && (v || !done)) return; // not a colour (yet): the preview stays as it is
  if (done) t.value = c || '';
  if (c !== (pd.opts.outlineColor || null)) { pd.opts.outlineColor = c; pdControls(); pdAsk(); }
}
function pdShow(r) {
  const img = $('#pd-img');
  img.onload = () => { const n = Math.max(img.naturalWidth, img.naturalHeight) || 1; img.style.width = img.naturalWidth * Math.max(1, Math.floor(PD_VIEW / n)) + 'px'; };
  img.src = pd.preview = r.preview;
  pdPet();
  $('#pd-info').textContent = r.animated ? T('pd.frames', { n: r.frames }) : '';
}
// The pet as it will look: the picture on its own, or as the face of the project's creature in the session's colour.
function pdPet() {
  const s = list.find(x => x.id === pd.id), art = s && (list.find(x => x.id === s.parent) || s);
  if (s) $('#pd-pet').innerHTML = pd.opts.whole ? picturePet(pd.preview) : creature(art.project || art.id, 'idle', pd.preview, petColor(s, list), true);
}
function pdAsk() {
  clearTimeout(pd.timer);
  const n = ++pd.sent, box = $('#pd-dialog');
  box.setAttribute('aria-busy', 'true');
  pd.timer = setTimeout(async () => {
    const r = await bridge.petImage(pd.id, 'preview', { ...pd.opts });
    if (n !== pd.sent || !box.open) return; // a newer change is on its way, or the dialog is gone
    box.removeAttribute('aria-busy');
    if (!r?.ok) { toast(T('pane.petFail.' + (r?.reason ?? 'bad'))); return box.close(); }
    pd.opts = { ...r.opts }; pdControls(); pdShow(r);
  }, PD_DEBOUNCE);
}
function pdRead(e) {
  const t = e.target, o = pd.opts, b = t.closest?.('[data-size]'), look = t.closest?.('[data-look]'), oc = t.closest?.('[data-oc]');
  if (look) { o.whole = look.dataset.look === 'whole'; pdControls(); return pdPet(); } // how the pet wears it: no new pixel art
  if (t.id === 'pd-oc-text') return pdTyped(t, false);
  if (b) o.size = +b.dataset.size;
  else if (oc) o.outlineColor = oc.dataset.oc || null;
  else if (t.type === 'color') o.outlineColor = t.value;
  else if (t.type === 'checkbox') o[t.dataset.k] = t.checked;
  else if (t.type === 'number') { const v = Math.round(+t.value); if (t.value === '' || !Number.isFinite(v)) return; o[t.dataset.k] = Math.min(+t.max, Math.max(+t.min, v)); }
  else return;
  pdControls(); pdAsk();
}
$('#pd-dialog').addEventListener('input', pdRead);
// pdControls leaves the field being typed in alone, so on leaving it a number out of range (or none) shows the one used.
$('#pd-dialog').addEventListener('change', e => { if (e.target.type === 'number') e.target.value = pd.opts[e.target.dataset.k]; else if (e.target.id === 'pd-oc-text') pdTyped(e.target, true); });
$('#pd-dialog').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pd-oc-text') pdTyped(e.target, true); });
$('#pd-dialog').addEventListener('click', async e => {
  const box = e.currentTarget, act = e.target.closest('button')?.dataset.act;
  if (e.target.closest('[data-size], [data-look], [data-oc]')) return pdRead(e);
  if (act === 'cancel') return box.close();
  if (act !== 'save') return;
  clearTimeout(pd.timer); pd.sent++;
  const r = await bridge.petImage(pd.id, 'save', { ...pd.opts });
  if (!r?.ok) return toast(T('pane.petFail.' + (r?.reason ?? 'bad')));
  pd.saved = true; box.close();
});
$('#pd-dialog').addEventListener('close', e => { // Esc, Cancel, Save or an error: a closed dialog never leaves a picture pending
  clearTimeout(pd.timer); pd.sent++;
  e.currentTarget.removeAttribute('aria-busy');
  if (!pd.saved) bridge.petImage(pd.id, 'cancel');
});

// ---------- first-run guide, and the tour of what is new (shown once each; see news_for in src-tauri/src/settings.rs) ----------
function guideHTML() {
  const art = st => `<span class="sprite">${creature('bobix', st)}</span>`;
  return `<ul class="guide">${['working', 'waiting', 'done', 'idle'].map(st => `<li class="st-${st}">${art(st)}<span>${esc(T('guide.' + st))}</span></li>`).join('')}</ul>
    <ul class="guide-more"><li>${esc(T('guide.click'))}</li><li>${esc(T('guide.ask'))}</li></ul>`;
}
let guideOut = false;
function renderIntro() {
  const box = $('#intro');
  // The guide waits for a first pet, then stays until Got it, even when that session ends.
  guideOut ||= !!state && !state.settings.guideSeen && list.length > 0;
  const showGuide = guideOut && !state.settings.guideSeen;
  const key = JSON.stringify([showGuide, lang]);
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.innerHTML = (showGuide ? `<section class="card" aria-labelledby="guide-h"><h2 id="guide-h">${esc(T('guide.title'))}</h2>${guideHTML()}
      <div class="acts"><button class="btn pri" type="button" data-intro="guide">${T('guide.ok')}</button></div></section>` : '');
}
$('#intro').addEventListener('click', async e => {
  const which = e.target.closest('[data-intro]')?.dataset.intro;
  if (!which || !bridge) return;
  state.settings = await bridge.setSettings({ guideSeen: true });
  renderIntro();
});

// The tour: a few steps, each lighting up the real element it talks about (TOUR.STEPS in tour.js). It opens by itself
// once for a version with news (state.news), and from Settings → Tour; Skip and Done both mark that version seen.
let tourAt = -1, tourNews = false;
function tourStart(news) {
  tourNews = news; tourAt = 0;
  select(null);
  document.querySelector('dialog[open]')?.close();
  $('#tour').hidden = false;
  tourShow();
}
async function tourEnd() {
  tourAt = -1; tab = null; // the board picks its section again
  $('#tour').hidden = true;
  showTab(tourNews ? 'sessions' : 'settings'); // back where it was opened from
  if (tourNews && bridge && state?.news) { state.settings = await bridge.setSettings({ seenVersion: state.news }); state.news = null; }
}
function tourShow() {
  const st = TOUR.STEPS[tourAt], n = TOUR.STEPS.length, last = tourAt === n - 1;
  if ($('#tab-' + st.tab).hidden) showTab(st.tab);
  if (st.section && narrow() && tab !== st.section) { tab = st.section; render(); }
  if (st.open === 'ticket' && !document.querySelector('#d-doing .stg')) {
    const ts = [...document.querySelectorAll('#d-doing .tr-main')];
    (ts.find(b => b.querySelector('.dup')) || ts[0])?.click();
  }
  const target = st.at.map(q => document.querySelector(q)).find(e => e && e.getClientRects().length);
  const art = st.art ? `<div class="tour-art" aria-hidden="true">${['working', 'waiting', 'done', 'idle'].map(k => `<span class="st-${k}"><span class="sprite">${creature('bobix', k)}</span></span>`).join('')}</div>` : '';
  $('#tour-pop').innerHTML = `<span class="n">${tourAt + 1} / ${n}</span><h2 id="tour-h">${esc(T(`tour.${st.key}.title`))}</h2>${art}<p>${esc(T(`tour.${st.key}.body`))}</p>
    <div class="acts">${last ? '' : `<button class="btn ghost skip" type="button" data-tour="skip">${T('tour.skip')}</button>`}${tourAt ? `<button class="btn" type="button" data-tour="back">${T('tour.back')}</button>` : ''}<button class="btn pri" type="button" data-tour="next">${T(last ? 'tour.done' : 'tour.next')}</button></div>`;
  target?.scrollIntoView({ block: 'center', behavior: 'instant' });
  tourPlace(target);
  $('#tour-pop [data-tour="next"]').focus();
}
function tourPlace(target = TOUR.STEPS[tourAt] && TOUR.STEPS[tourAt].at.map(q => document.querySelector(q)).find(e => e && e.getClientRects().length)) {
  if (tourAt < 0) return;
  const r = target?.getBoundingClientRect(), hole = $('#tour-hole'), pop = $('#tour-pop'), pad = 6;
  hole.classList.toggle('none', !r);
  if (r) Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + 2 * pad + 'px', height: r.height + 2 * pad + 'px' });
  pop.style.width = Math.min(380, innerWidth - 24) + 'px';
  const p = TOUR.place(r ? { left: r.left - pad, top: r.top - pad, width: r.width + 2 * pad, height: r.height + 2 * pad } : null, innerWidth, innerHeight, 380, pop.offsetHeight);
  Object.assign(pop.style, { left: p.left + 'px', top: p.top + 'px', width: p.width + 'px' });
}
$('#tour').addEventListener('click', e => {
  const b = e.target.closest('[data-tour]')?.dataset.tour;
  if (b === 'skip' || (b === 'next' && tourAt === TOUR.STEPS.length - 1)) return tourEnd();
  if (b === 'next' || b === 'back') { tourAt += b === 'next' ? 1 : -1; tourShow(); }
});
$('#tour').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); tourEnd(); }
  if (e.key === 'Tab') { // focus stays in the bubble
    const bs = [...$('#tour-pop').querySelectorAll('button')], i = bs.indexOf(document.activeElement);
    e.preventDefault(); bs[(i + (e.shiftKey ? bs.length - 1 : 1)) % bs.length].focus();
  }
});
addEventListener('resize', () => tourPlace());
addEventListener('scroll', () => tourPlace(), true);

// ---------- setup ----------
async function renderSetup(note) {
  const box = $('#setup');
  if (!bridge) { box.innerHTML = `<div class="card"><p class="note">${T('set.onlyInApp')}</p></div>`; return; }
  state = await bridge.getState();
  const h = state.hooks, ok = h.complete && !h.error && !h.stale;
  const stateText = h.error ? T('setup.error', { x: h.error }) : h.stale ? T('setup.stale') : h.complete ? T('setup.ok') : T(h.events.length ? 'setup.partial' : 'setup.none');
  const steps = [
    ['setup.step1', ok, `<button class="btn ${ok ? '' : 'pri'}" type="button" data-act="install">${T(h.events.length ? 'setup.reinstall' : 'setup.install')}</button>`],
    ['setup.step2', ok && !!state.lastEventAt, `<button class="btn" type="button" data-act="test" ${ok ? '' : 'disabled'}>${T('setup.test')}</button>`],
    ['setup.step3', false, ''],
  ];
  const linuxNote = state.platform === 'linux' ? `<p class="note">${esc(T('setup.focusNote.linux'))}</p>` : '';
  box.innerHTML = `
    <div class="card hero">
      <span class="sprite">${creature('bobix', ok ? 'done' : 'idle')}</span>
      <div><h2>${T('setup.title')}</h2><p class="note">${T('setup.body')}</p><span class="state ${ok ? 'ok' : 'bad'}" role="status">${esc(stateText)}</span></div>
    </div>
    <div class="card"><h2>${T('setup.steps')}</h2><ol class="steps">${steps.map(([k, done, act], i) => `
      <li class="${done ? 'done' : ''}"><span class="num" aria-hidden="true">${i + 1}</span>
        <div><div class="lbl">${T(k)}</div><div class="desc">${T(k + '.desc')}</div></div><div>${act}</div></li>`).join('')}</ol>
      ${note ? `<p class="note ${note.err ? 'err' : ''}">${esc(note.text)}</p>` : ''}
    </div>
    <div class="card"><h2>${T('setup.details')}</h2>
      <dl class="kv">
        <dt>${T('setup.mode')}</dt><dd>${h.mode ? T('setup.mode.' + h.mode) : '–'}</dd>
        <dt>${T('setup.port')}</dt><dd>${h.port ?? '–'}</dd>
        <dt>${T('setup.last')}</dt><dd>${state.lastEventAt ? ago(state.lastEventAt) : T('setup.never')}</dd>
        <dt>${T('setup.file')}</dt><dd><code>${esc(h.file)}</code><button class="btn" type="button" data-act="reveal">${T('setup.reveal')}</button></dd>
      </dl>
      <div class="acts"><button class="btn" type="button" data-act="diag">${T('setup.diag')}</button></div>
      ${!state.nodePath ? `<p class="note">${T('setup.noNode', { mode: state.platform === 'win32' ? 'PowerShell' : 'curl' })}</p>` : ''}
      ${linuxNote}
    </div>
    <div class="card"><h2>${esc(T('guide.title'))}</h2>${guideHTML()}</div>
    ${h.events.length ? `<div class="card"><h2>${T('setup.remove.title')}</h2><p class="note">${T('setup.remove.body')}</p>
      <div class="acts"><button class="btn danger" type="button" data-act="uninstall">${T('setup.uninstall')}</button></div></div>` : ''}`;
}
$('#setup').addEventListener('click', async e => {
  const act = e.target.closest('button')?.dataset.act;
  if (!act) return;
  if (act === 'reveal') return bridge.revealSettings();
  if (act === 'diag') { await bridge.copyDiagnostics(); return toast(T('setup.diag.done')); }
  e.target.disabled = true;
  const r = await bridge[{ install: 'installHooks', uninstall: 'uninstallHooks', test: 'testEvent' }[act]]();
  const text = r.error ? T('setup.error', { x: r.error }) : [r.backup && T('setup.backup', { file: r.backup }), act === 'install' && T('setup.newSessions')].filter(Boolean).join(' ');
  renderSetup(text ? { text, err: !!r.error } : null);
  if (act === 'test' && !r.error) showTab('sessions');
});

// ---------- boot ----------
function applyLang() {
  lang = !state || state.settings.language === 'auto' ? navigator.language : state.settings.language;
  translate();
  $('#conn').textContent = T(es.readyState === 1 ? 'conn.ok' : es.readyState === 0 ? 'conn.wait' : 'conn.lost');
  render();
  renderSettings();
  if (!$('#tab-setup').hidden) renderSetup();
}
$('#logo').innerHTML = creature('bobix', 'done');
// Shown once its language and the first sessions are in, so the bar doesn't jump as they arrive (fallback: top of this script).
const pending = new Set(['state', 'list']);
const arrived = k => { if (pending.delete(k) && !pending.size) { document.body.classList.remove('boot'); if (state?.news) tourStart(true); } };
const es = new EventSource('/events?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || ''));
es.onopen = () => { $('#conn').textContent = T('conn.ok'); $('#conn').className = 'conn'; };
es.onerror = () => { $('#conn').textContent = T('conn.lost'); $('#conn').className = 'conn lost'; };
es.onmessage = m => {
  const d = JSON.parse(m.data);
  const firstIds = list.slice(0, 4).map(x => x.id).join();
  list = (d.sessions || []).filter(s => !s.linking); // a new side session waits for its parent link (state.rs), as on the pets
  work = d.work || { status: 'off' };
  model = d.model || {};
  waiting = d.waiting || [];
  const projects = [...(work.local || []), ...(work.away || [])].map(g => g.path + ':' + g.autoKey).join();
  if (projects !== lastProjects) { lastProjects = projects; if (!$('#tab-settings').hidden && !document.activeElement?.dataset?.keyOf) renderSettings(); } // the codes list
  if (selected && !list.some(s => s.id === selected)) selected = null;
  render();
  if (firstIds !== list.slice(0, 4).map(x => x.id).join()) renderPreview();
  arrived('list');
};
setInterval(render, 15e3);
setInterval(() => list.some(s => s.answer) && render(), 1000); // countdown of a waiting permission request
$('#conn').textContent = T('conn.wait');
(async () => {
  if (bridge) {
    state = await bridge.getState();
    $('#ver').textContent = 'v' + state.version; $('#ver').hidden = false;
    loadHabits();
    bridge.onSelect(id => { showTab('sessions'); select(id); });
    bridge.onShowTab(showTab);
    bridge.onOpenFail(showHint);
    bridge.onSettings(s => {
      if (JSON.stringify(s) === JSON.stringify(state.settings)) return; // our own save echoing back: keep the form as is (slider drag)
      const langChanged = s.language !== state.settings.language;
      const habits = s.habitsOn !== state.settings.habitsOn;
      state.settings = s;
      langChanged ? applyLang() : renderSettings(); // e.g. toggled from the tray
      if (habits) loadHabits();
      renderIntro();
    });
  }
  applyLang();
  showTab(new URLSearchParams(location.search).get('tab') || 'sessions');
  try { const f = new URLSearchParams(location.search).get('fail'); if (f) showHint(JSON.parse(f)); } catch {} // a pet or notification click opened this window
  arrived('state');
})();
</script>
