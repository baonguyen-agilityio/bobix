<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bobix</title>
<link rel="stylesheet" href="/ui/fonts/fonts.css">
<link rel="stylesheet" href="/ui/theme.css">
<style>
/* The board look: warm neutrals, plain readable type, one drawer for details. Dark follows the system. */
:root{--bg:oklch(97.5% .012 85);--surface:oklch(99.5% .004 85);--sunk:oklch(95% .014 85);--line:oklch(91% .012 85);--line-strong:oklch(84% .015 85);--on-pop:oklch(24% .035 266)}
@media (prefers-color-scheme:dark){:root{
  --n-50:oklch(25% .022 266);--n-100:oklch(20.5% .02 266);--n-200:oklch(30% .022 266);--n-300:oklch(38% .024 266);
  --n-500:oklch(70% .02 262);--n-700:oklch(85% .014 262);--n-900:oklch(96% .008 262);
  --sky-soft:oklch(33% .05 235);--mint-soft:oklch(33% .05 162);--coral-soft:oklch(32% .07 33);--coral-ink:oklch(80% .12 33);
  --bg:oklch(19% .02 266);--surface:oklch(24% .022 266);--sunk:oklch(21% .02 266);--line:oklch(30% .02 266);--line-strong:oklch(38% .024 266);
  color-scheme:dark}}
/* the creatures draw eyes and outlines with --n-900: keep them dark on any theme */
.sprite,.mini,.pd-pet,.logo,.egg{--n-900:oklch(24% .035 266)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.boot{visibility:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-md)/1.55 var(--f-body);font-variant-numeric:tabular-nums}
body.drawer-on{overflow:hidden}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0;text-wrap:balance}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);background-clip:padding-box;border:2px solid transparent;border-radius:var(--pill)}
::-webkit-scrollbar-thumb:hover{background-color:var(--ink-3)}

.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:var(--s2) var(--s4);min-height:60px;padding:10px clamp(12px,3vw,28px);background:color-mix(in oklch,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:var(--s2)}
.brand .logo{width:32px;height:32px}
.bar h1{font-size:var(--t-xl)}
.ver{font-size:var(--t-xs);color:var(--ink-3);align-self:flex-end;padding-bottom:4px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:var(--pill);min-width:0;overflow-x:auto}
.tab{border:0;background:none;padding:6px 14px;border-radius:var(--pill);cursor:pointer;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background 150ms var(--ease)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:var(--pill);background:var(--coral);color:var(--on-pop);font-size:11px;line-height:18px;text-align:center}
.conn{font-size:var(--t-sm);color:var(--ink-3);margin-left:auto}
.conn.lost{color:var(--coral-ink);font-weight:600}
.btn{position:relative;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);padding:7px var(--s4);font-size:var(--t-sm);font-weight:600;cursor:pointer;transition:border-color 120ms var(--ease)}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--ink);color:var(--n-50);border-color:var(--ink)}
.btn.sm{padding:4px 12px;font-size:var(--t-xs)}
.icon-btn{flex:none;width:36px;height:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);cursor:pointer;font-size:15px}
.icon-btn:hover{border-color:var(--ink-3)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* board: one column per state, GitLab issues nobody works on first */
.app{max-width:1920px;margin:0 auto;padding:var(--s4) clamp(12px,2vw,28px) var(--s8)}
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:var(--s3);overflow-x:auto;align-items:start;padding-bottom:var(--s2)}
.colm{background:var(--sunk);border:1px solid var(--line);border-radius:20px;padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.colm>h2{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-md);padding:2px 4px var(--s1)}
.colm>h2 i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--n-300)}
.colm[data-k=todo]>h2 i{background:var(--butter)}.colm[data-k=waiting]>h2 i{background:var(--coral)}.colm[data-k=working]>h2 i{background:var(--sky)}.colm[data-k=done]>h2 i{background:var(--mint)}
.colm>h2 .n{margin-left:auto;font:600 var(--t-xs) var(--f-body);color:var(--ink-3)}
.colm[data-k=waiting]{background:color-mix(in oklch,var(--coral-soft) 70%,var(--sunk));border-color:color-mix(in oklch,var(--coral) 40%,var(--line))}
.none{margin:0;font-size:var(--t-sm);color:var(--ink-3);padding:var(--s2) 4px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.k{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);transition:border-color 150ms var(--ease),box-shadow 150ms var(--ease)}
.k:hover{border-color:var(--line-strong);box-shadow:var(--lift)}
.k:has(>[aria-pressed="true"]){border-color:var(--ink);box-shadow:var(--lift)}
.k-main{display:flex;flex-direction:column;gap:6px;width:100%;padding:var(--s3);border:0;background:none;border-radius:inherit;text-align:left;cursor:pointer}
.k-main:has(+.k-ask){padding-bottom:0}
.k .hd{display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--s2);align-items:center}
.sprite{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--sunk)}
.k .t{font-weight:600;font-size:var(--t-sm);line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.k .s{font-size:var(--t-xs);color:var(--ink-2)}
.st-waiting .k-main .s{color:var(--coral-ink);font-weight:600}
.k .q{font-size:var(--t-xs);color:var(--ink-3);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.k .chips{display:flex;flex-wrap:wrap;gap:4px;font-size:var(--t-xs);color:var(--ink-3);min-width:0}
.k .chips>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k .tag{border:1px solid var(--line-strong);border-radius:var(--pill);padding:0 8px}
.k .ft{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-size:var(--t-xs);color:var(--ink-3)}
.k-ask{display:flex;flex-direction:column;gap:6px;padding:0 var(--s3) var(--s3)}
.k-ask code{display:block;font-size:var(--t-xs);background:var(--sunk);border:0;border-radius:8px;padding:4px 8px;max-height:6em;overflow:auto}
.k-ask .acts{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.k-ask .note{margin:0;font-size:var(--t-xs)}
.ctx{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);color:var(--ink-3)}
.meter{width:64px;height:6px;border-radius:var(--pill);background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink-3);transform-origin:left;transform:scaleX(var(--v));transition:transform 250ms var(--ease)}
.meter.low i{background:var(--coral)}
.meter.unk i{background:var(--n-300)}
.ago{white-space:nowrap}
.pill{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px var(--s3);border-radius:var(--pill);font-size:var(--t-sm);font-weight:600;background:var(--line);color:var(--ink-2)}
.st-working .pill{background:var(--sky-soft);color:var(--ink)}
.st-waiting .pill{background:var(--coral);color:var(--on-pop)}
.st-done .pill{background:var(--mint-soft);color:var(--ink)}
.eye{transform-box:fill-box;transform-origin:center}
.st-working .eye{animation:blink 4.2s infinite}
.st-waiting .sprite svg{animation:hop 900ms var(--ease) infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.15)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
/* below 900 px one column at a time, picked from a row of chips */
.colpick{display:none}
@media (max-width:899px){
  .board{grid-template-columns:minmax(0,1fr)}
  .colm{display:none}.colm.on{display:flex}
  .colpick{display:flex;gap:4px;overflow-x:auto;margin-bottom:var(--s3)}
  .colpick button{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--pill);padding:5px 12px;font-size:var(--t-sm);font-weight:600;cursor:pointer}
  .colpick button[aria-pressed=true]{background:var(--ink);color:var(--n-50);border-color:var(--ink)}
  .colpick b{font-weight:600;opacity:.7;margin-left:4px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:var(--s6)}
.card h2{font-size:var(--t-lg);margin-bottom:var(--s2)}
.empty{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s6);align-items:center;max-width:640px;margin:0 0 var(--s4)}
.empty h2{font-size:var(--t-xl);margin-bottom:var(--s2)}
.empty p{margin:0 0 var(--s3);font-size:var(--t-sm);color:var(--ink-2);max-width:52ch}
code{font:500 var(--t-sm)/1.5 var(--f-mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px var(--s2);overflow-wrap:anywhere}

/* a session's details: a drawer from the right, over the board */
.scrim{position:fixed;inset:0;z-index:30;background:oklch(20% .02 266 / .35)}
.pane{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(620px,100vw);overflow:hidden auto;overflow-wrap:anywhere;background:var(--surface);box-shadow:-8px 0 32px #0003;padding:var(--s6) clamp(16px,3vw,28px) var(--s12)}
.pane-top{display:flex;gap:var(--s4);align-items:center}
.pane-top .sprite{width:72px;height:72px;border-radius:20px;flex:none}
.pane-top>div{flex:1;min-width:0}
.pane-top h2{font-size:var(--t-xl);overflow-wrap:anywhere}
.pane-top .lv{font-size:var(--t-sm);color:var(--ink-3)}
.pane-top .icon-btn{align-self:flex-start}
.pane-line{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;margin-top:var(--s4)}
.pane-acts{display:grid;gap:var(--s4);margin-top:var(--s4)}
.pane-acts>div{display:flex;flex-wrap:wrap;gap:var(--s2)}
/* the picture row sizes each button to its label, so a long one like "Thú cưng mặc định" stays on one line */
.pane-acts .btn{flex:1 1 auto}
.pane-acts .btn{padding:var(--s2) var(--s1);overflow-wrap:normal}
.pane-acts [data-act="pet"]{display:grid;place-items:center}
.pane-acts [data-act="pet"]>span{grid-area:1/1;pointer-events:none}
.pane-acts .alt{visibility:hidden}
.pane .open-hint{margin-top:var(--s3)}
.pane .meta{margin:var(--s4) 0 0;font-size:var(--t-xs);line-height:1.6;color:var(--ink-3);overflow-wrap:anywhere}
.pane h3{font-size:var(--t-md);margin:var(--s6) 0 var(--s2)}
.pane p{margin:0}
.ask{margin-top:var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r-lg);background:var(--coral-soft);border:1px solid var(--coral);font-size:var(--t-sm)}
.ask .acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.ask strong{color:var(--coral-ink)}
.md{overflow-wrap:anywhere;font-size:var(--t-sm);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.report{background:var(--mint-soft)}
.md p,.md ul,.md ol,.md pre,.md table,.md blockquote{margin:0 0 var(--s2)}
.md>:last-child{margin-bottom:0}
.md h4{font-size:var(--t-sm);font-weight:700;margin:var(--s3) 0 var(--s1)}
.md>h4:first-child{margin-top:0}
.md ul,.md ol{padding-left:var(--s6)}
.md li+li,.md li>ul,.md li>ol{margin-top:var(--s1)}
.md li>ul,.md li>ol{margin-bottom:0}
.md code{padding:0 var(--s1)}
.md pre{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s2) var(--s3)}
.md pre code{background:none;border:0;padding:0;overflow-wrap:normal}
.md table{display:block;overflow-x:auto;border-collapse:collapse}
.md th,.md td{border:1px solid var(--line-strong);padding:var(--s1) var(--s2);text-align:left;vertical-align:top;overflow-wrap:break-word}
.md hr{border:0;border-top:1px solid var(--line-strong);margin:var(--s3) 0}
.md blockquote{padding-left:var(--s3);border-left:3px solid var(--line-strong);color:var(--ink-2)}
.log{list-style:none;margin:0;padding:0;font-size:var(--t-sm)}
.log li{display:grid;grid-template-columns:max-content 8px minmax(0,1fr);align-items:baseline;gap:var(--s2) var(--s3);padding:var(--s2) 0;border-top:1px solid var(--line)}
.log time{grid-column:1;grid-row:1;font-size:var(--t-xs);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.log li::before{content:"";grid-column:2;grid-row:1;align-self:start;width:8px;height:8px;margin-top:calc(.775em - 4px);border-radius:50%;background:var(--n-300)}
.log .msg{grid-column:3;grid-row:1;min-width:0;color:var(--ink-2)}
.log .k-prompt .msg{color:var(--ink);font-weight:600}
.log .k-prompt::before{background:var(--ink)}
.log .k-ask .msg{color:var(--coral-ink)}
.log .k-ask::before{background:var(--coral)}
.log .k-done .msg{color:var(--ink)}
.log .k-done::before{background:var(--mint)}
.log .k-start::before{background:var(--sky)}
.log.sides li{display:block;padding:0;border:0}
.log.sides li+li{margin-top:var(--s2)}
.log.sides li::before{content:none}
.sidecard{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:var(--s2) var(--s3);background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;transition:border-color 150ms var(--ease)}
.sidecard:hover{border-color:var(--line-strong)}
.sidecard::after{content:'›';flex:none;color:var(--ink-3);font-size:var(--t-md)}
.sidecard>span{pointer-events:none}
.sidecard .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidecard .st{flex:none;font-size:var(--t-xs);color:var(--ink-3)}
.log .arg{font-family:var(--f-mono)}
.log .n{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);margin-left:var(--s1)}
.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,2);overflow:hidden}
.clamp.open{display:block}
/* the quest is Markdown: clamped by height, since line-clamp lays tables and lists out as flex items */
.clamp.prompt{display:block;-webkit-line-clamp:none;max-height:10em;background:var(--sunk)}
.clamp.prompt.open{max-height:none}
.prompt.over{-webkit-mask-image:linear-gradient(#000 65%,transparent)}
.more{display:block;border:0;background:none;padding:0;margin-top:var(--s1);font:600 var(--t-xs) var(--f-body);color:var(--ink-2);cursor:pointer}
.more:hover{color:var(--ink);text-decoration:underline}
.note{font-size:var(--t-sm);color:var(--ink-2)}
.note.err{color:var(--coral-ink);font-weight:600}

/* settings */
.set-wrap{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:var(--s8);max-width:1180px;margin:0 auto;padding:var(--s6)}
.set-side{position:sticky;top:88px;align-self:start;display:flex;flex-direction:column;gap:var(--s3)}
.set-side h2{font-size:var(--t-lg)}
.set-side .note{font-size:var(--t-sm)}
.preview{position:relative;aspect-ratio:16/10;border-radius:var(--r-lg);background:var(--n-200);border:1px solid var(--line-strong);overflow:hidden}
.preview .pv-bar{position:absolute;left:0;right:0;top:0;height:7%;background:var(--n-300)}
.preview .pv-dock{position:absolute;left:28%;right:28%;bottom:3%;height:8%;border-radius:var(--r-md);background:var(--n-300)}
.preview .pv-work{position:absolute;left:0;right:0;top:7%;bottom:13%}
.preview .band{position:absolute;left:var(--zs);width:calc(var(--ze) - var(--zs));bottom:0;height:calc(var(--ps) + 12px);background:var(--sky-soft);border:1px dashed var(--sky);border-radius:var(--r-md) var(--r-md) 0 0;transition:left 200ms var(--ease),width 200ms var(--ease)}
.preview.top .band{bottom:auto;top:0;border-radius:0 0 var(--r-md) var(--r-md)}
.preview .mini{position:absolute;bottom:6px;width:var(--ps);height:var(--ps);opacity:var(--op);transition:left 200ms var(--ease)}
.preview.top .mini{bottom:auto;top:6px}
.preview .mini svg{width:100%;height:100%}
.preview .hidden{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;color:var(--ink-2);background:color-mix(in oklch,var(--bg) 70%,transparent)}
.saved{align-self:flex-start;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);padding:2px var(--s3);border-radius:var(--pill);background:var(--mint-soft);opacity:0;transition:opacity 200ms var(--ease)}
.saved.on{opacity:1}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:var(--s2) var(--s6) var(--s2)}
.sec+.sec{margin-top:var(--s6)}
.sec h2{font-size:var(--t-lg);padding:var(--s4) 0 var(--s3)}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3) var(--s6);align-items:center;padding:var(--s4) 0;border-top:1px solid var(--line)}
.opt.wide{grid-template-columns:minmax(0,1fr)}
.opt .lbl{font-weight:600}
.opt .desc{font-size:var(--t-sm);color:var(--ink-3);margin-top:2px;max-width:60ch}
.opt.dim .lbl,.opt.dim .desc{opacity:.45}
.ctl{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;justify-content:flex-end}
.opt.wide .ctl{justify-content:flex-start}
select,input[type=number]{min-height:40px;padding:0 var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);font-size:var(--t-sm)}
input[type=number]{width:104px}
.fb{width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px);box-sizing:border-box;padding:var(--s6);border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);box-shadow:var(--lift)}
.fb::backdrop{background:oklch(30% 0.04 262 / .35)}
.fb h2{font-size:var(--t-lg);margin-bottom:var(--s2)}
.fb .seg{margin-top:var(--s3)}
.fb label{display:block;margin:var(--s3) 0 var(--s1);font-size:var(--t-sm);font-weight:600}
.fb input,.fb textarea{width:100%;box-sizing:border-box;padding:var(--s2) var(--s3);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font:inherit}
.fb textarea{min-height:96px;resize:vertical}
.fb details{margin-top:var(--s3);font-size:var(--t-sm);color:var(--ink-2)}
.fb summary{cursor:pointer}
.fb pre{margin:var(--s2) 0 0;padding:var(--s3);max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--n-100);border-radius:var(--r-md);font-size:var(--t-xs)}
.pd{width:min(720px,calc(100vw - 32px));overflow:auto}
.pd-grid{display:flex;gap:var(--s6);flex-wrap:wrap;margin-top:var(--s4)}
.pd-view{display:flex;flex-direction:column;align-items:center;gap:var(--s3);flex:0 1 264px;min-width:0}
.pd-big{display:grid;place-items:center;box-sizing:border-box;width:min(264px,100%);aspect-ratio:1;border:1px solid var(--line);border-radius:var(--r-md);background:repeating-conic-gradient(var(--n-100) 0 25%,var(--surface) 0 50%) 0 0 / 16px 16px;transition:opacity 150ms var(--ease)}
.pd-big img{image-rendering:pixelated;max-width:100%}
.pd[aria-busy="true"] .pd-big,.pd[aria-busy="true"] .pd-pet{opacity:.55}
.pd-pet{transition:opacity 150ms var(--ease)}
.pd .sprite{width:96px;height:96px;border-radius:var(--r-lg)}
.pd-ctl{flex:1 1 280px;min-width:0;display:grid;gap:var(--s3);align-content:start}
.pd-sec{display:grid;gap:var(--s2);min-width:0}

/* Save and Cancel stay in view when a short window makes the dialog scroll (same spacing as .acts when it does not) */
.pd .acts{position:sticky;bottom:calc(var(--s6) * -1);margin:var(--s1) 0 calc(var(--s6) * -1);padding:var(--s3) 0 var(--s6);background:var(--surface)}

.pick-list{position:absolute;z-index:5;top:calc(100% + var(--s2));left:0;min-width:min(340px,80vw);max-width:min(520px,90vw);max-height:360px;overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);box-shadow:var(--lift);padding:var(--s2)}

<body class="boot">

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="sessions" data-t="tab.sessions"></button>
    <button class="tab" role="tab" data-tab="settings" data-t="tab.settings"></button>
    <button class="tab" role="tab" data-tab="setup" data-t="tab.setup"></button>
  </nav>
  <button class="btn" type="button" id="showAll" data-t="board.showAll" hidden></button>
  <span class="conn lost" id="conn" role="status"></span>
  <button class="btn" type="button" id="fb-open" data-t="fb.title"></button>
</header>
<dialog id="fb-dialog" class="fb" aria-labelledby="fb-heading"></dialog>
<dialog id="pd-dialog" class="fb pd" aria-labelledby="pd-heading"></dialog>

<section id="tab-sessions">
  <main class="app" id="board">
    <div class="intro" id="intro"></div>
    <div class="card empty" id="empty">
      <span class="sprite" id="egg" style="width:96px;height:96px"></span>
      <div><h2 data-t="empty.title"></h2><p data-t="empty.body"></p></div>
    </div>
    <div class="colpick" id="colpick"></div>
    <div class="board">
      <section class="colm" data-k="todo"><h2><i></i><span data-t="group.todo"></span><span class="n"></span></h2><div class="todo" id="work"></div></section>
      <section class="colm" data-k="waiting"><h2><i></i><span data-t="group.waiting"></span><span class="n"></span></h2><ol class="rows"></ol><p class="none" data-t="col.none.waiting"></p></section>
      <section class="colm" data-k="working"><h2><i></i><span data-t="group.working"></span><span class="n"></span></h2><ol class="rows"></ol><p class="none" data-t="col.none"></p></section>
      <section class="colm" data-k="done"><h2><i></i><span data-t="group.done"></span><span class="n"></span></h2><ol class="rows"></ol><p class="none" data-t="col.none"></p></section>
      <section class="colm" data-k="idle"><h2><i></i><span data-t="group.idle"></span><span class="n"></span></h2><ol class="rows"></ol><p class="none" data-t="col.none"></p></section>

<script src="/ui/i18n.js"></script>
<script src="/ui/creature.js"></script>
<script src="/ui/markdown.js"></script>
<script src="/ui/log.js"></script>
<script>
// The panel shows after 1 s at the latest. Set first, so an error further down cannot leave it hidden (body.boot).
setTimeout(() => document.body.classList.remove('boot'), 1000);
const IDLE_AFTER = 10 * 60e3;
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Side sessions started from a Claude desktop session (parent = that session's id in Bobix).
const kidsOf = s => list.filter(x => x.parent === s.id);
// Within one group: each parent followed by its side sessions.
function familyOrder(items) {
  const ids = new Set(items.map(s => s.id)), out = [];
  for (const s of items) if (!(s.parent && ids.has(s.parent))) { out.push(s); out.push(...items.filter(k => k.parent === s.id)); }
  return out;
}
const titleOf = id => { const p = id && list.find(x => x.id === id); return p ? p.title || p.name : ''; };
const secsLeft = s => (!s.answer ? 0 : s.answer.until == null ? Infinity : Math.max(0, Math.ceil((s.answer.until - Date.now()) / 1000))); // Infinity: waits until answered
const look = s => s.state === 'idle' || (s.state === 'done' && Date.now() - s.since > IDLE_AFTER) ? 'idle' : s.state;
// Same rule as the pets overlay: hidden by hand, or asleep past the "leave after" time.
const offScreen = s => {
  const mins = state?.settings?.sleepHide || 0;
  if (s.pet === 'hidden') return true;
  return s.pet !== 'shown' && look(s) === 'idle' && mins > 0 && Date.now() - (s.state === 'done' ? s.since + IDLE_AFTER : s.since) > mins * 60e3;
};
const bridge = window.bobix; // only inside the app
let lang = navigator.language, state = null; // state = app state (settings, hooks, displays) when in the app
const T = (k, v) => I18N.t(lang, k, v);

function translate() {
  document.documentElement.lang = I18N.pick(lang);
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.documentElement.style.setProperty('--open', JSON.stringify(T('group.open')));
  document.documentElement.style.setProperty('--close', JSON.stringify(T('group.close')));
}
function toast(text, action) {
  if ([...$('#toasts').children].some(t => t.dataset.text === text)) return; // already on screen (e.g. Open session clicked twice)
  const el = document.createElement('div');
  el.dataset.text = text;
  el.className = 'toast';
  el.innerHTML = `<span style="flex:1">${esc(text)}</span>${action ? `<button class="btn" type="button">${esc(action.label)}</button>` : ''}`;
  if (action) el.querySelector('button').onclick = () => { el.remove(); action.run(); };
  $('#toasts').prepend(el);
  setTimeout(() => el.remove(), action ? 10000 : 6000);
}

// ---------- tabs ----------
function showTab(name) {
  if (name === 'feedback') return openFeedback(); // from the tray, over whichever tab is open
  if (name === 'work') { col = 'todo'; name = 'sessions'; } // the GitLab issues are the board's To do column
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  for (const n of ['sessions', 'settings', 'setup']) $(`#tab-${n}`).hidden = n !== name;
  if (name === 'sessions') render();
  if (name === 'setup') renderSetup();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => showTab(b.dataset.tab));

// ---------- sessions board ----------
function ago(t) {
  const m = Math.floor((Date.now() - t) / 60e3);
  return m < 1 ? T('ago.now') : m < 60 ? T('ago.min', { n: m }) : m < 1440 ? T('ago.h', { n: Math.floor(m / 60) }) : T('ago.d', { n: Math.floor(m / 1440) });
}
function statusText(s, st) {
  if (st === 'working') return s.tool ? T('status.working', { tool: I18N.toolLabel(lang, s.tool) }) : T('status.thinking');
  if (st === 'waiting') return s.askTool ? T('status.waitingTool', { tool: s.askTool }) : T('status.waiting');
  return T(`status.${st}`);
}
const line2 = (s, st) => st === 'done' && s.summary ? T('line.report') + s.summary : s.quest || T('line.noQuest');
function logHTML(l, open) {
  if (l.kind !== 'tool') return esc(T(`log.${l.kind}`, { x: l.text }));
  const tool = esc(LOG.cap(I18N.toolLabel(lang, l.tool), I18N.pick(lang))), n = l.n > 1 ? `<span class="n">×${l.n}</span>` : '';
  return (l.text ? T('log.tool', { tool, x: `<span class="arg" title="${esc(l.text)}">${esc(open ? l.text : LOG.mid(l.text)).replace(/\//g, '/<wbr>')}</span>` }) : tool) + n;
}
// Clamped text with a "Show more" toggle; the toggle shows only when there is more (see showMore).
function moreHTML(key, html, cls = '', cut = false) {
  const open = moreOpen.has(key);
  return `<div class="clamp${cls ? ' ' + cls : ''}${open ? ' open' : ''}" data-k="${esc(key)}">${html}</div>`
    + `<button class="more" type="button" data-more="${esc(key)}"${cut ? ' data-cut' : ''} hidden>${T(open ? 'pane.less' : 'pane.more')}</button>`;
}
// After drawing: a toggle is shown for text that is open, cut by the clamp, or shortened (a long command).
function showMore(root) {
  root.querySelectorAll('[data-more]').forEach(b => {
    const box = b.previousElementSibling, over = box.scrollHeight > box.clientHeight + 1;
    b.hidden = !(box.classList.contains('open') || over || b.hasAttribute('data-cut'));
    box.classList.toggle('over', over);
  });
}
function rowHTML(s, st) {
  const hp = s.ctx, par = s.parent && list.find(x => x.id === s.parent), kids = kidsOf(s).length;
  const tag = (t, title) => `<span class="tag"${title ? ` title="${esc(title)}"` : ''}>${esc(t)}</span>`;
  return `<span class="hd"><span class="sprite">${petArt(par || s, st, petColor(s, list))}</span><span class="t">${esc(s.title || s.name)}</span></span>
    <span class="s">${esc(statusText(s, st))}</span>
    ${st === 'waiting' ? '' : `<span class="q">${esc(line2(s, st))}</span>`}
    <span class="chips">${s.title ? `<span>${esc(s.name)}</span>` : ''}<span>${T('pet.lv', { n: s.lv })}</span>${s.issue ? tag('#' + s.issue.iid, s.issue.title) : ''}${par ? tag(T('pet.from', { name: titleOf(s.parent) })) : ''}${kids ? tag(T('pet.kids', { n: kids })) : ''}${offScreen(s) ? tag(T('pet.offScreen')) : ''}</span>
    <span class="ft"><span class="ctx" title="${T('ctx')}"><span class="meter ${hp == null ? 'unk' : hp < 25 ? 'low' : ''}"><i style="--v:${(hp ?? 100) / 100}"></i></span>${hp == null ? T('ctx.unknown') : `${hp}%`}</span><span class="ago" data-t-ago="${s.since}">${ago(s.since)}</span></span>`;
}
// A waiting session's request on its card: answered right there while Bobix holds it, else where it can be answered.
const askRowHTML = s => `<div class="k-ask"><code>${esc(s.ask)}</code>${secsLeft(s) && bridge ? `<div class="acts">
  ${s.answer.always ? `<button class="btn sm" type="button" data-choice="always">${T('ask.always')}</button>` : ''}<button class="btn sm pri" type="button" data-choice="allow">${T('ask.allow')}</button><button class="btn sm danger" type="button" data-choice="deny">${T('ask.deny')}</button></div>`
  : `<p class="note">${T(approveWhere(s))}</p>`}</div>`;

let list = [], selected = new URLSearchParams(location.search).get('s');
let hint = null; // why a pet or notification click could not open the selected session: { id, reason, app, folder }
let col = null; // the column shown below 900 px; null: the most urgent one with something in it

    ${row('changed', g.changed)}

const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
// An egg in the pets' pixel style, for an issue nobody works on yet.
function eggSVG(seed) {
  const BODY = ['--sky', '--mint', '--lilac', '--peach', '--butter', '--rose'];
  const col = `var(${BODY[hashStr(seed) % BODY.length]})`, line = `color-mix(in oklch, ${col} 45%, #1d2030)`, shine = 'oklch(98% 0.01 90 / .9)';
  const rows = ['...xxx...', '..xxxxx..', '.xxxxxxx.', '.xxxxxxx.', 'xxxxxxxxx', 'xxxxxxxxx', 'xxxxxxxxx', 'xxxxxxxxx', '.xxxxxxx.', '..xxxxx..'];
  const on = new Set(); rows.forEach((r, y) => [...r].forEach((c, x) => c === 'x' && on.add(`${x},${y}`)));
  const px = (x, y, f) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`;
  let r = hashStr(seed + 'spots'), out = '';
  const spots = new Set(); for (let i = 0; i < 4; i++) { r = Math.imul(r ^ (r >>> 13), 2654435761) >>> 0; spots.add(`${2 + r % 5},${3 + (r >>> 8) % 5}`); }
  for (const k of on) { const [x, y] = k.split(',').map(Number); const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => !on.has(`${x + a},${y + b}`)); out += px(x, y, edge ? line : spots.has(k) ? shine : col); }
  return `<svg viewBox="0 0 9 10" shape-rendering="crispEdges" aria-hidden="true">${out + px(3, 1, shine) + px(2, 2, shine)}</svg>`;
}

const ROWS = SECTIONS.flatMap(x => x[1]);
const fill = (r, v) => `${((v - r.min) / (r.max - r.min)) * 100}%`;

function control(r, s) {
  const v = r.get ? r.get(s) : s[r.k], id = `f-${r.k}`;
  if (r.type === 'switch') return `<input type="checkbox" role="switch" class="sw" id="${id}" data-k="${r.k}" ${v ? 'checked' : ''}>`;
  if (r.type === 'select') return `<select id="${id}" data-k="${r.k}">${r.opts().map(([o, l]) => `<option value="${esc(o)}" ${String(v) === o ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  if (r.type === 'seg') return `<div class="seg" role="radiogroup" aria-labelledby="l-${r.k}">${r.opts().map(([o, l]) =>
    `<button type="button" role="radio" aria-checked="${String(v) === o}" data-k="${r.k}" data-v="${esc(o)}">${esc(l)}</button>`).join('')}</div>`;
  if (r.type === 'number') return `<div class="rng-row"><input type="number" id="${id}" data-k="${r.k}" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" style="width:7em"><span class="val">${T(r.unit)}</span></div>`;
  if (r.type === 'range') return `<div class="rng-row"><input type="range" class="rng" id="${id}" data-k="${r.k}" min="${r.min}" max="${r.max}" step="${r.step}" value="${v}" style="--fill:${fill(r, v)}"><output class="val" for="${id}" data-val="${r.k}">${r.fmt(v)}</output></div>`;
  if (r.type === 'zone') {
    const z = { min: 0, max: 100 }, cur = Object.entries(ZONES).find(([, [a, b]]) => a === s.zoneStart && b === s.zoneEnd)?.[0];
    return `<div class="zone">
      <div class="chips">${Object.keys(ZONES).map(n => `<button type="button" class="chip" aria-pressed="${n === cur}" data-zone="${n}">${T('set.zone.' + n)}</button>`).join('')}</div>
      ${['zoneStart', 'zoneEnd'].map((k, i) => `<div class="pair"><label for="f-${k}">${T(i ? 'set.zone.to' : 'set.zone.from')}</label>
        <input type="range" class="rng" id="f-${k}" data-k="${k}" min="0" max="100" step="5" value="${s[k]}" style="--fill:${fill(z, s[k])}"><output class="val" for="f-${k}" data-val="${k}">${s[k]}%</output></div>`).join('')}
    </div>`;
  }
  if (r.type === 'keys') { // each project's code in session names; the projects are the ones Bobix read issues for
    const gs = [...(work.local || []), ...(work.away || [])];
    if (!gs.length) return `<p class="note">${T('set.workKeys.none')}</p>`;
    return `<div class="keys">${gs.map(g => `<label><span>${esc(g.path)}</span><input type="text" data-key-of="${esc(g.path)}" value="${esc((s.workKeys || {})[g.path] || '')}" placeholder="${esc(g.autoKey)}" maxlength="10" spellcheck="false" autocapitalize="characters"></label>`).join('')}</div>`;
  }
  if (r.type === 'port') return `<input type="number" id="${id}" min="1024" max="65535" value="${s.port}" aria-labelledby="l-port"><button class="btn" type="button" data-act="port">${T('set.port.apply')}</button>`;
  return `<button class="btn danger" type="button" data-act="reset">${T('set.reset')}</button>`;
}

function renderSettings() {
  const box = $('#settings');
  if (!bridge) { box.innerHTML = `<div class="card"><p class="note">${T('set.onlyInApp')}</p></div>`; return; }
  const s = state.settings;
  box.innerHTML = `
    <aside class="set-side">

// Mini screen: work area, the band pets may use, a few pets at real scale and visibility.
function renderPreview() {
  const box = $('#preview');
  if (!box || !state) return;
  const s = state.settings, W = state.screen?.width || 1920, w = box.clientWidth || 340;
  // Drawn 3x larger than true scale: a real 56 px pet on a 1920 px screen would be a 10 px speck here.
  const ps = Math.round(Math.min(48, Math.max(12, s.size * w / W * 3)));
  const ids = [...list.map(x => x.id), 'bobix-a', 'bobix-b', 'bobix-c'].slice(0, Math.max(3, Math.min(4, list.length)));
  const span = s.zoneEnd - s.zoneStart;
  const pets = ids.map((id, i) => {
    const left = s.zoneStart + span * (i + 0.5) / ids.length;
    return `<span class="mini" style="left:calc(${left}% - ${ps / 2}px)">${creature(id, i === 0 ? 'waiting' : 'working')}</span>`;
  }).join('');
  box.className = 'preview' + (s.edge === 'top' ? ' top' : '');
  box.style.cssText = `--zs:${s.zoneStart}%;--ze:${s.zoneEnd}%;--ps:${ps}px;--op:${s.opacity}`;
  box.innerHTML = `<div class="pv-bar"></div><div class="pv-work"><div class="band"></div>${s.petsVisible ? pets : ''}</div><div class="pv-dock"></div>${s.petsVisible ? '' : `<div class="hidden">${T('set.preview.hidden')}</div>`}`;
}

let savedTimer;
function flashSaved() {
  const el = $('#saved'); if (!el) return;
  el.classList.add('on'); clearTimeout(savedTimer); savedTimer = setTimeout(() => el.classList.remove('on'), 1400);
}
async function save(patch, { rerender = true } = {}) {
  const r = await bridge.setSettings(patch);
  if (r.error) { toast(T('setup.error', { x: r.error })); renderSettings(); return false; }
  const langChanged = 'language' in patch && r.language !== state.settings.language;
  state.settings = r;
  if (langChanged) applyLang(); else if (rerender) renderSettings(); else renderPreview();
  flashSaved();
  return true;
}

$('#settings').addEventListener('input', e => {
  const k = e.target.dataset.k;
  if (!k || e.target.type !== 'range') return;
  let v = Number(e.target.value);
  const r = ROWS.find(x => x.k === k) || { min: 0, max: 100, fmt: x => x + '%' };
  if (k === 'zoneStart' && v > state.settings.zoneEnd - 5) v = e.target.value = state.settings.zoneEnd - 5;
  if (k === 'zoneEnd' && v < state.settings.zoneStart + 5) v = e.target.value = state.settings.zoneStart + 5;
  e.target.style.setProperty('--fill', fill(r, v));
  $(`[data-val="${k}"]`).textContent = r.fmt(v);
  save({ [k]: v }, { rerender: false });
});
$('#settings').addEventListener('change', e => {
  const of = e.target.dataset.keyOf;
  if (of) {
    const v = e.target.value.trim().toUpperCase(), keys = { ...(state.settings.workKeys || {}) };
    if (v && !/^[A-Z][A-Z0-9]{0,9}$/.test(v)) { e.target.value = keys[of] || ''; return toast(T('set.workKeys.bad')); }
    if (v) keys[of] = v; else delete keys[of];
    return save({ workKeys: keys });
  }
  const k = e.target.dataset.k;
  if (!k || e.target.type === 'range') return;
  save({ [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value });
});
$('#settings').addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.zone) { const [a, b] = ZONES[t.dataset.zone]; return save({ zoneStart: a, zoneEnd: b }); }
  if (t.dataset.k) { const r = ROWS.find(x => x.k === t.dataset.k); return save(r.set ? r.set(t.dataset.v) : { [r.k]: t.dataset.v }); }
  if (t.dataset.act === 'port') {
    const v = Number($('#f-port').value);
    if (v === state.settings.port) return;
    if (!Number.isInteger(v) || v < 1024 || v > 65535) return toast(T('setup.error', { x: '1024 – 65535' }));
    return save({ port: v });
  }
  if (t.dataset.act === 'reset') {
    const before = { ...state.settings };
    state.settings = await bridge.resetSettings();
    applyLang();
    toast(T('set.reset.done'), { label: T('set.undo'), run: () => save(before) });
  }
});

// ---------- pet picture (pixel art) ----------
// choose / edit return a Preview and keep the picture pending in the main process; every change asks for a new preview
// (debounced), save and cancel end it. Only the reply to the newest request is shown.
const pd = { id: null, opts: null, preview: '', sent: 0, timer: 0, saved: false };
const PD_SIZES = [32, 48, 64]; // SIZES in ui/pixelate.js
const PD_VIEW = 256;           // the preview is scaled up by whole pixels to at most this
const PD_DEBOUNCE = 150;       // ms: a typed number or held arrow key asks once
// Outline colours offered as swatches (i18n pd.oc.<name>); 'Auto' before them is the picture's own darkest colour, darker.
const PD_OUTLINES = [['black', '#000000'], ['brown', '#4a2a16'], ['navy', '#1c2b5a'], ['green', '#1f4a2c'], ['purple', '#5a2d82'], ['white', '#ffffff'], ['pink', '#ff6fa8'], ['gold', '#e8b020']];
async function openPetPicture(act) {
  const box = $('#pd-dialog'), id = selected;
  if (!bridge || !id || box.open) return;
  const r = await bridge.petImage(id, act);
  if (!r?.ok) { if (r?.reason) toast(T('pane.petFail.' + r.reason)); return; }
  Object.assign(pd, { id, opts: { ...r.opts }, sent: 0, saved: false });
  const sw = (k, label) => `<div class="pr"><label for="pd-${k}">${T(label)}</label><input type="checkbox" role="switch" class="sw" id="pd-${k}" data-k="${k}"></div>`;
  box.innerHTML = `<h2 id="pd-heading">${T('pd.title')}</h2><p class="note">${T('pd.body')}</p>
    <div class="pd-grid">
      <div class="pd-view"><div class="pd-big"><img id="pd-img" alt="${esc(T('pd.alt'))}"></div><span class="sprite pd-pet" id="pd-pet"></span><p class="pd-info" id="pd-info" role="status"></p></div>
      <div class="pd-ctl">
        <div class="pd-sec">
          <span class="lbl" id="pd-look-l">${T('pd.look')}</span>
          <div class="seg" role="radiogroup" aria-labelledby="pd-look-l">${['face', 'whole'].map(k => `<button type="button" role="radio" data-look="${k}">${T('pd.look.' + k)}</button>`).join('')}</div>
          <span class="lbl" id="pd-size-l">${T('pd.size')}</span>
          <div class="seg" role="radiogroup" aria-labelledby="pd-size-l" aria-describedby="pd-size-h">${PD_SIZES.map(n => `<button type="button" role="radio" data-size="${n}">${n}</button>`).join('')}</div>
          <p class="hint" id="pd-size-h">${T('pd.size.hint')}</p>
        </div>
        <div class="pd-sec">
          <div class="pd-nums"><label class="pd-num">${T('pd.colors')}<input type="number" id="pd-colors" data-k="colors" min="4" max="32" step="1"></label><label class="pd-num">${T('pd.accents')}<input type="number" id="pd-accents" data-k="accents" min="0" max="8" step="1" aria-describedby="pd-accents-h"></label></div>
          <p class="hint" id="pd-accents-h">${T('pd.accents.hint')}</p>
        </div>
        <div class="pd-sec">
          ${sw('clean', 'pd.clean')}${sw('removeBg', 'pd.removeBg')}${sw('outline', 'pd.outline')}
          <fieldset class="pd-oc" id="pd-oc">
            <div class="pd-oc-top"><span class="lbl">${T('pd.oc')}</span><p class="pd-err" id="pd-oc-err" role="alert" hidden>${T('pd.oc.bad')}</p><input type="color" id="pd-oc-pick" aria-label="${esc(T('pd.oc.pick'))}" title="${esc(T('pd.oc.pick'))}"><input type="text" id="pd-oc-text" aria-label="${esc(T('pd.oc.code'))}" placeholder="#f0a, rgb(…)" spellcheck="false" autocomplete="off"></div>
            <div class="pd-row pd-sws" role="radiogroup" aria-label="${esc(T('pd.oc'))}"><button type="button" role="radio" class="pd-sw auto" data-oc="" title="${esc(T('pd.oc.autoHint'))}">${T('pd.oc.auto')}</button>${PD_OUTLINES.map(([k, c]) => `<button type="button" role="radio" class="pd-sw" data-oc="${c}" style="--c:${c}" aria-label="${esc(T('pd.oc.' + k))}" title="${esc(T('pd.oc.' + k))}"></button>`).join('')}</div>
          </fieldset>
        </div>
      </div>
    </div>
    <div class="acts"><button class="btn pri" type="button" data-act="save">${T('pd.save')}</button><button class="btn" type="button" data-act="cancel">${T('pd.cancel')}</button></div>`;

function pdControls() {
  const o = pd.opts, box = $('#pd-dialog');
  box.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-checked', String(+b.dataset.size === o.size)));
  box.querySelectorAll('[data-look]').forEach(b => b.setAttribute('aria-checked', String((b.dataset.look === 'whole') === !!o.whole)));
  for (const k of ['colors', 'accents']) { const e = $('#pd-' + k); if (e !== document.activeElement) e.value = o[k]; }
  for (const k of ['clean', 'outline', 'removeBg']) $('#pd-' + k).checked = !!o[k];
  const oc = o.outlineColor || '', text = $('#pd-oc-text');
  $('#pd-oc').disabled = !o.outline; // the colour is kept while the outline is off, and comes back with it
  box.querySelectorAll('[data-oc]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.oc === oc)));
  $('#pd-oc-pick').value = oc || '#000000';
  if (text !== document.activeElement) { text.value = oc; pdBad(false); }
}
// A typed outline colour, in any form the browser knows (#hex, rgb(), hsl(), names...) -> '#rrggbb', or null.
// A canvas parses it: fillStyle ignores what is not a colour, so the text is tried from two different colours.
const pdCanvas = document.createElement('canvas').getContext('2d');
function pdColor(text) {
  const v = text.trim(), read = from => { pdCanvas.fillStyle = from; pdCanvas.fillStyle = v; return pdCanvas.fillStyle; };
  const a = read('#000000');
  if (!v || a !== read('#ffffff') || /^currentcolor$/i.test(v)) return null;
  if (/^#[0-9a-f]{6}$/.test(a)) return a;
  const m = /^rgba\((\d+), (\d+), (\d+), ([\d.]+)\)$/.exec(a); // a colour with alpha; the alpha is dropped, all of it is not
  return m && +m[4] > 0 ? '#' + m.slice(1, 4).map(n => (+n).toString(16).padStart(2, '0')).join('') : null;
}
// The error describes the field only while it shows: a hidden element named by aria-describedby is still read out.
function pdBad(on) {
  const t = $('#pd-oc-text');
  $('#pd-oc-err').hidden = !on; t.setAttribute('aria-invalid', String(on));
  if (on) t.setAttribute('aria-describedby', 'pd-oc-err'); else t.removeAttribute('aria-describedby');
}
// While typing, a colour is used as soon as the text is one; the error waits for Enter or leaving the field.
// An empty field on Enter or leaving it goes back to the automatic colour.
function pdTyped(t, done) {
  const v = t.value.trim(), c = pdColor(v);
  pdBad(done && !!v && !c);
  if (!c && (v || !done)) return; // not a colour (yet): the preview stays as it is
  if (done) t.value = c || '';
  if (c !== (pd.opts.outlineColor || null)) { pd.opts.outlineColor = c; pdControls(); pdAsk(); }
}
function pdShow(r) {
  const img = $('#pd-img');
  img.onload = () => { const n = Math.max(img.naturalWidth, img.naturalHeight) || 1; img.style.width = img.naturalWidth * Math.max(1, Math.floor(PD_VIEW / n)) + 'px'; };
  img.src = pd.preview = r.preview;
  pdPet();
  $('#pd-info').textContent = r.animated ? T('pd.frames', { n: r.frames }) : '';
}
// The pet as it will look: the picture on its own, or as the face of the project's creature in the session's colour.
function pdPet() {
  const s = list.find(x => x.id === pd.id), art = s && (list.find(x => x.id === s.parent) || s);
  if (s) $('#pd-pet').innerHTML = pd.opts.whole ? picturePet(pd.preview) : creature(art.project || art.id, 'idle', pd.preview, petColor(s, list), true);
}
function pdAsk() {
  clearTimeout(pd.timer);
  const n = ++pd.sent, box = $('#pd-dialog');
  box.setAttribute('aria-busy', 'true');
  pd.timer = setTimeout(async () => {
    const r = await bridge.petImage(pd.id, 'preview', { ...pd.opts });
    if (n !== pd.sent || !box.open) return; // a newer change is on its way, or the dialog is gone
    box.removeAttribute('aria-busy');
    if (!r?.ok) { toast(T('pane.petFail.' + (r?.reason ?? 'bad'))); return box.close(); }
    pd.opts = { ...r.opts }; pdControls(); pdShow(r);
  }, PD_DEBOUNCE);
}
function pdRead(e) {
  const t = e.target, o = pd.opts, b = t.closest?.('[data-size]'), look = t.closest?.('[data-look]'), oc = t.closest?.('[data-oc]');
  if (look) { o.whole = look.dataset.look === 'whole'; pdControls(); return pdPet(); } // how the pet wears it: no new pixel art
  if (t.id === 'pd-oc-text') return pdTyped(t, false);
  if (b) o.size = +b.dataset.size;
  else if (oc) o.outlineColor = oc.dataset.oc || null;
  else if (t.type === 'color') o.outlineColor = t.value;
  else if (t.type === 'checkbox') o[t.dataset.k] = t.checked;
  else if (t.type === 'number') { const v = Math.round(+t.value); if (t.value === '' || !Number.isFinite(v)) return; o[t.dataset.k] = Math.min(+t.max, Math.max(+t.min, v)); }
  else return;
  pdControls(); pdAsk();
}
$('#pd-dialog').addEventListener('input', pdRead);
// pdControls leaves the field being typed in alone, so on leaving it a number out of range (or none) shows the one used.
$('#pd-dialog').addEventListener('change', e => { if (e.target.type === 'number') e.target.value = pd.opts[e.target.dataset.k]; else if (e.target.id === 'pd-oc-text') pdTyped(e.target, true); });
$('#pd-dialog').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pd-oc-text') pdTyped(e.target, true); });
$('#pd-dialog').addEventListener('click', async e => {
  const box = e.currentTarget, act = e.target.closest('button')?.dataset.act;
  if (e.target.closest('[data-size], [data-look], [data-oc]')) return pdRead(e);
  if (act === 'cancel') return box.close();
  if (act !== 'save') return;
  clearTimeout(pd.timer); pd.sent++;
  const r = await bridge.petImage(pd.id, 'save', { ...pd.opts });
  if (!r?.ok) return toast(T('pane.petFail.' + (r?.reason ?? 'bad')));
  pd.saved = true; box.close();
});
$('#pd-dialog').addEventListener('close', e => { // Esc, Cancel, Save or an error: a closed dialog never leaves a picture pending
  clearTimeout(pd.timer); pd.sent++;
  e.currentTarget.removeAttribute('aria-busy');
  if (!pd.saved) bridge.petImage(pd.id, 'cancel');
});

// ---------- first-run guide and "What's new" (shown once each; see news_for in src-tauri/src/settings.rs) ----------
function guideHTML() {
  const art = st => `<span class="sprite">${creature('bobix', st)}</span>`;
  return `<ul class="guide">${['working', 'waiting', 'done', 'idle'].map(st => `<li class="st-${st}">${art(st)}<span>${esc(T('guide.' + st))}</span></li>`).join('')}</ul>
    <ul class="guide-more"><li>${esc(T('guide.click'))}</li><li>${esc(T('guide.ask'))}</li></ul>`;
}
let guideOut = false;
function renderIntro() {
  const box = $('#intro');
  const showNews = !!state?.news;
  // The guide waits for a first pet, then stays until Got it, even when that session ends.
  guideOut ||= !!state && !state.settings.guideSeen && list.length > 0;
  const showGuide = guideOut && !state.settings.guideSeen;
  const key = JSON.stringify([showNews && state.news, showGuide, lang]);
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.innerHTML = (showNews ? `<section class="card" aria-labelledby="news-h"><h2 id="news-h">${esc(T('news.title', { v: state.news }))}</h2>
      <ul class="news">${[...T('news.items').split('\n'), ...(state.platform === 'linux' ? [T('news.items.linux')] : [])].map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <div class="acts"><button class="btn" type="button" data-intro="news">${T('news.ok')}</button></div></section>` : '')
    + (showGuide ? `<section class="card" aria-labelledby="guide-h"><h2 id="guide-h">${esc(T('guide.title'))}</h2>${guideHTML()}
      <div class="acts"><button class="btn pri" type="button" data-intro="guide">${T('guide.ok')}</button></div></section>` : '');
}
$('#intro').addEventListener('click', async e => {
  const which = e.target.closest('[data-intro]')?.dataset.intro;
  if (!which || !bridge) return;
  if (which === 'news') { state.settings = await bridge.setSettings({ seenVersion: state.news }); state.news = null; }
  else state.settings = await bridge.setSettings({ guideSeen: true });
  renderIntro();
});

// ---------- setup ----------
async function renderSetup(note) {
  const box = $('#setup');
  if (!bridge) { box.innerHTML = `<div class="card"><p class="note">${T('set.onlyInApp')}</p></div>`; return; }
  state = await bridge.getState();
  const h = state.hooks, ok = h.complete && !h.error && !h.stale;
  const stateText = h.error ? T('setup.error', { x: h.error }) : h.stale ? T('setup.stale') : h.complete ? T('setup.ok') : T(h.events.length ? 'setup.partial' : 'setup.none');
  const steps = [
    ['setup.step1', ok, `<button class="btn ${ok ? '' : 'pri'}" type="button" data-act="install">${T(h.events.length ? 'setup.reinstall' : 'setup.install')}</button>`],
    ['setup.step2', ok && !!state.lastEventAt, `<button class="btn" type="button" data-act="test" ${ok ? '' : 'disabled'}>${T('setup.test')}</button>`],
    ['setup.step3', false, ''],
  ];
  const linuxNote = state.platform === 'linux' ? `<p class="note">${esc(T('setup.focusNote.linux'))}</p>` : '';
  box.innerHTML = `
    <div class="card hero">
      <span class="sprite">${creature('bobix', ok ? 'done' : 'idle')}</span>
      <div><h2>${T('setup.title')}</h2><p class="note">${T('setup.body')}</p><span class="state ${ok ? 'ok' : 'bad'}" role="status">${esc(stateText)}</span></div>
    </div>
    <div class="card"><h2>${T('setup.steps')}</h2><ol class="steps">${steps.map(([k, done, act], i) => `
      <li class="${done ? 'done' : ''}"><span class="num" aria-hidden="true">${i + 1}</span>
        <div><div class="lbl">${T(k)}</div><div class="desc">${T(k + '.desc')}</div></div><div>${act}</div></li>`).join('')}</ol>
      ${note ? `<p class="note ${note.err ? 'err' : ''}">${esc(note.text)}</p>` : ''}
    </div>
    <div class="card"><h2>${T('setup.details')}</h2>
      <dl class="kv">
        <dt>${T('setup.mode')}</dt><dd>${h.mode ? T('setup.mode.' + h.mode) : '–'}</dd>
        <dt>${T('setup.port')}</dt><dd>${h.port ?? '–'}</dd>
        <dt>${T('setup.last')}</dt><dd>${state.lastEventAt ? ago(state.lastEventAt) : T('setup.never')}</dd>
        <dt>${T('setup.file')}</dt><dd><code>${esc(h.file)}</code><button class="btn" type="button" data-act="reveal">${T('setup.reveal')}</button></dd>
      </dl>
      <div class="acts"><button class="btn" type="button" data-act="diag">${T('setup.diag')}</button></div>
      ${!state.nodePath ? `<p class="note">${T('setup.noNode', { mode: state.platform === 'win32' ? 'PowerShell' : 'curl' })}</p>` : ''}
      ${linuxNote}
    </div>
    <div class="card"><h2>${esc(T('guide.title'))}</h2>${guideHTML()}</div>
    ${h.events.length ? `<div class="card"><h2>${T('setup.remove.title')}</h2><p class="note">${T('setup.remove.body')}</p>
      <div class="acts"><button class="btn danger" type="button" data-act="uninstall">${T('setup.uninstall')}</button></div></div>` : ''}`;
}
$('#setup').addEventListener('click', async e => {
  const act = e.target.closest('button')?.dataset.act;
  if (!act) return;
  if (act === 'reveal') return bridge.revealSettings();
  if (act === 'diag') { await bridge.copyDiagnostics(); return toast(T('setup.diag.done')); }
  e.target.disabled = true;
  const r = await bridge[{ install: 'installHooks', uninstall: 'uninstallHooks', test: 'testEvent' }[act]]();
  const text = r.error ? T('setup.error', { x: r.error }) : [r.backup && T('setup.backup', { file: r.backup }), act === 'install' && T('setup.newSessions')].filter(Boolean).join(' ');
  renderSetup(text ? { text, err: !!r.error } : null);
  if (act === 'test' && !r.error) showTab('sessions');
});

// ---------- boot ----------
function applyLang() {
  lang = !state || state.settings.language === 'auto' ? navigator.language : state.settings.language;
  translate();
  $('#conn').textContent = T(es.readyState === 1 ? 'conn.ok' : es.readyState === 0 ? 'conn.wait' : 'conn.lost');
  render();
  renderSettings();
  if (!$('#tab-setup').hidden) renderSetup();
}
$('#egg').innerHTML = creature('bobix', 'idle');
$('#logo').innerHTML = creature('bobix', 'done');
// Shown once its language and the first sessions are in, so the bar doesn't jump as they arrive (fallback: top of this script).
const pending = new Set(['state', 'list']);
const arrived = k => pending.delete(k) && !pending.size && document.body.classList.remove('boot');
const es = new EventSource('/events?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || ''));
es.onopen = () => { $('#conn').textContent = T('conn.ok'); $('#conn').className = 'conn'; };
es.onerror = () => { $('#conn').textContent = T('conn.lost'); $('#conn').className = 'conn lost'; };
es.onmessage = m => {
  const d = JSON.parse(m.data);
  const firstIds = list.slice(0, 4).map(x => x.id).join();
  list = d.sessions || [];
  work = d.work || { status: 'off' };
  waiting = d.waiting || [];
  const projects = [...(work.local || []), ...(work.away || [])].map(g => g.path + ':' + g.autoKey).join();
  if (projects !== lastProjects) { lastProjects = projects; if (!$('#tab-settings').hidden && !document.activeElement?.dataset?.keyOf) renderSettings(); } // the codes list
  if (selected && !list.some(s => s.id === selected)) selected = null;
  render();
  if (firstIds !== list.slice(0, 4).map(x => x.id).join()) renderPreview();
  arrived('list');
};
setInterval(render, 15e3);
setInterval(() => list.some(s => s.answer) && render(), 1000); // countdown of a waiting permission request
$('#conn').textContent = T('conn.wait');
(async () => {
  if (bridge) {
    state = await bridge.getState();
    $('#ver').textContent = 'v' + state.version; $('#ver').hidden = false;
    bridge.onSelect(id => { showTab('sessions'); select(id); });
    bridge.onShowTab(showTab);
    bridge.onOpenFail(showHint);
    bridge.onSettings(s => {
      if (JSON.stringify(s) === JSON.stringify(state.settings)) return; // our own save echoing back: keep the form as is (slider drag)
      const langChanged = s.language !== state.settings.language;
      state.settings = s;
      langChanged ? applyLang() : renderSettings(); // e.g. toggled from the tray
      renderIntro();
    });
  }
  applyLang();
  showTab(new URLSearchParams(location.search).get('tab') || 'sessions');
  try { const f = new URLSearchParams(location.search).get('fail'); if (f) showHint(JSON.parse(f)); } catch {} // a pet or notification click opened this window
  arrived('state');
})();
</script>
</body>
