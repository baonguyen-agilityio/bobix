<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bobix pets</title>
<link rel="stylesheet" href="/ui/theme.css">
<style>
/* Runs inside a transparent, click-through window covering the screen's work area. Every surface (name tag, card,
   request, bubble, the corner pill and its list) is drawn with the panel's tokens and parts (theme.css), so the pets and
   the panel look like one product, in light and dark. */
html{--size:56px}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:400 var(--t-sm)/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;color:var(--ink);font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
.pet{position:absolute;left:0;bottom:var(--s1);width:var(--size);cursor:pointer;touch-action:none;transform-origin:50% 100%;transition:opacity 150ms var(--ease),scale 250ms var(--ease),translate 250ms var(--ease),filter 250ms var(--ease)}
.pet.dragging{cursor:grabbing}
.pet.hover{z-index:3}
.pet:not(.parent):not(.side){z-index:1} /* a pet on its own stays above a family it walks past, name tag included */
.edge-top .pet{bottom:auto;top:var(--s1)}
.spr{position:relative;width:var(--size);height:var(--size);display:grid;place-items:center}
.spr svg{width:100%;height:100%}
.tag{position:relative;left:50%;transform:translateX(-50%);width:max-content;max-width:160px;min-height:20px;padding:0 var(--s2);border-radius:999px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--lift);font-size:var(--t-xs);font-weight:500;line-height:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-waiting .tag{background:var(--accent-solid);border-color:transparent;color:var(--on-accent)}
.pet.side .spr{transform:scale(.8);transform-origin:50% 100%}
.tag.ghost{visibility:hidden}
.tag{max-width:none;transform:none;overflow:visible;display:flex;justify-content:center;align-items:center;gap:var(--s1);box-sizing:border-box}
.tag .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tag .iss{flex:none;color:var(--ink-3);font-variant-numeric:tabular-nums}
.st-waiting .tag .iss{color:inherit;opacity:.8}
.bb{position:absolute;left:50%;bottom:calc(100% - var(--size) * .08);width:calc(var(--size) * .5);translate:-50% 0;cursor:pointer;animation:bob 2.6s var(--ease) infinite;transform-origin:50% 100%}
.pet.side .bb{width:calc(var(--size) * .42)}
/* Top edge: the balloon floats below the pet's name tag, its string up (balloonSVG draws it upside down there). */
.edge-top .bb{bottom:auto;top:calc(100% + 2px)}
.bb svg{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 2px oklch(20% .02 262 / .18))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.st-idle .spr{opacity:.75}
.say,.card{position:absolute;bottom:calc(100% + var(--s2) + var(--lane, 0) * 36px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--pop)}
.edge-top .say,.edge-top .card{bottom:auto;top:calc(100% + var(--s2) + var(--lane, 0) * 36px)}
.edge-l .say,.edge-l .card{left:0;transform:none}
.edge-r .say,.edge-r .card{left:auto;right:0;transform:none}
/* A bubble: what the pet is doing (a tool), the morning habit, or its request with Allow / Deny. */
.say{display:flex;align-items:center;gap:var(--s2);padding:5px 10px;border-radius:var(--r-md);white-space:nowrap;font-size:var(--t-xs);font-weight:500;color:var(--ink-2);animation:pop 200ms var(--ease)}
.say.habit{cursor:pointer;color:var(--ink)}
.say.waiting{padding:6px 6px 6px 12px;border-color:color-mix(in oklch,var(--accent) 45%,transparent);color:var(--accent-ink);font-weight:600}
.say.waiting::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.say.done{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.where{display:block;font-size:var(--t-xs);font-weight:400;color:var(--ink-3)}
.answer{display:inline-flex;align-items:center;gap:6px}
.answer .left{font-weight:400;color:var(--ink-3);font-size:var(--t-xs)}
/* The card: the session as the panel shows it, its title, folder, task, status with its dot, level and model badges,
   context meter and usage. */
.card{width:272px;padding:12px 14px;z-index:2;animation:pop 150ms var(--ease);white-space:normal}
.card h2{font:600 var(--t-lg)/1.3 var(--f-ui);margin:0;overflow-wrap:anywhere}
.card .sub{font-size:var(--t-xs);color:var(--ink-3);margin:2px 0 var(--s2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .q{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 10px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);font-size:var(--t-xs);color:var(--ink-3);padding:4px 0;border-top:1px solid var(--line)}
.card .row .bdg{display:flex;gap:4px;flex:none}
.card .st{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink);min-width:0}
.st-waiting .card .st{color:var(--accent-ink)}
.card .meter{display:block;width:auto;margin:0 0 var(--s1)}
.card .row.ctx{border-bottom:0;padding-bottom:4px}
.card .answer{display:flex;flex-wrap:wrap;margin:0 0 10px}
.card .hint{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-size:var(--t-xs);color:var(--ink-3);border-top:1px solid var(--line);padding-top:var(--s2);margin-top:var(--s1)}
.zz{position:absolute;left:70%;top:-6px;font:600 var(--t-sm) var(--f-ui);color:var(--ink-3);animation:zz 2.4s var(--ease) infinite}
/* While an effect plays (pet-fx.js) the pet keeps its own SVG (it acts its state) and the effect draws round it; one
   that draws over the pet's head (XP bar, battery) hides the balloon and the tool bubble there, and the "z". A pet
   saying goodbye melts from the feet up and keeps nothing but itself. Two pets too close: the effect waits, the pet
   shows as it is. A pet out of sight round the line's far end is hidden. */
.pet.fx .zz,.pet.fx-over .bb,.pet.fx-over .say:not(.waiting){visibility:hidden;animation:none}
.pet.leaving .spr>svg{animation:melt 1.4s linear forwards}
@keyframes melt{0%,50%{clip-path:inset(-20% -20% 0 -20%)}100%{clip-path:inset(-20% -20% 100% -20%)}}
.pet.line-off{visibility:hidden!important}
.pet.fx-hide .fxl,.pet.leaving.fx-hide{visibility:hidden}
.pet.leaving>:not(.spr){opacity:0;transition:opacity 600ms var(--ease)}
.fxl{position:absolute;pointer-events:none;overflow:visible;z-index:0}
/* A pet's balloon, bubble, card and name tag stay above its own effect; other pets' are cut out of it (fxClip). */
.pet>.bb,.pet>.say,.pet>.card,.pet>.tag{z-index:1}
.walking .spr svg.pic{animation:step 320ms steps(2) infinite} /* a picture that is the whole pet steps and hops; the others act their poses */
.st-waiting .spr svg.pic{animation:hop 900ms var(--ease) infinite}
@keyframes step{to{transform:translateY(-3px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
@keyframes pop{from{opacity:0;translate:0 4px}}
@keyframes zz{0%{opacity:0;translate:0 0}40%{opacity:1}100%{opacity:0;translate:8px -12px}}
/* Show when needed (pets-ondemand.js): a pet under its balloon (pet-ride.js) crossing the screen; its name and card
   only while you point at it; the corner pill. */
.pet.od{bottom:auto;top:0;z-index:2;transition:opacity 300ms var(--ease)}
.pet.od.gone{opacity:0}
.fly{position:absolute;left:0;top:0;pointer-events:none}
.fly>svg{position:absolute;left:0;top:0;overflow:visible}
.free{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.pet.od:not(.hover) :is(.tag,.card),.pet.od.going :is(.tag,.card){display:none}
.pet.od .tag{margin-top:2px;left:50%;translate:-50% 0;width:max-content;max-width:160px}
.pet.od .card{top:var(--cy,0);bottom:auto;left:var(--cx,0);transform:none;cursor:default;text-align:left}
.card .need{margin:0 0 10px;padding:var(--s2) 10px;border-radius:var(--r-md);font-size:var(--t-xs);color:var(--ink-2);background:var(--surface-2)}
.card .need b{display:block;font-size:var(--t-sm);font-weight:600}
.card .need code{display:block;margin-top:4px;color:var(--ink)}
.card .need.waiting{background:var(--accent-bg);color:var(--accent-ink)}
.card .need.done{background:var(--ok-bg);color:var(--ok)}
.card .use{margin-top:var(--s2)}
.card .need.use{margin:var(--s2) 0 0;background:var(--accent-bg);color:var(--accent-ink)}
.card .need.ctx{background:var(--warn-bg);color:var(--warn)}
/* Show when needed: the corner pill (how many sessions, which need you) and its list, like the panel's rows. */
#odCorner{position:fixed;right:12px;bottom:12px;z-index:5;display:flex;align-items:center;gap:var(--s2)}
#odCorner[hidden],#odCorner [hidden]{display:none}
#odPill,#odDndOff{display:inline-flex;align-items:center;gap:var(--s2);min-height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);box-shadow:var(--pop);font:500 var(--t-xs) var(--f-ui);color:var(--ink);cursor:pointer}
#odPill:hover{background:var(--surface-2)}
#odDndOff{background:var(--accent-solid);border-color:transparent;color:var(--on-accent)}
#odPop{position:absolute;right:0;bottom:calc(100% + 8px);width:360px;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--pop);padding:6px;animation:pop 150ms var(--ease)}
#odPop h2{font:600 var(--t-xs) var(--f-ui);color:var(--ink-3);margin:4px 8px 6px}
#odPop .row{display:flex;align-items:center;gap:10px;min-height:40px;padding:5px 8px;border-radius:var(--r-md);font-size:var(--t-sm);cursor:pointer}
#odPop .row:hover{background:var(--surface-2)}
#odPop .mini{flex:none;width:26px;height:26px}#odPop .mini svg{width:100%;height:100%}
#odPop .nm{font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#odPop .stx{flex:1;min-width:0;color:var(--ink-3);font-size:var(--t-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#odPop .row.waiting .stx{color:var(--accent-ink);font-weight:500}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<script src="/ui/i18n.js"></script>
<script src="/ui/creature.js"></script>
<script src="/ui/pet-fx.js"></script>
<script src="/ui/pet-ride.js"></script>
<script src="/ui/pets-ondemand.js"></script>
<script src="/ui/habits.js"></script>
<script src="/ui/usage.js"></script>
<script>
const IDLE_AFTER = 10 * 60e3, DONE_BUBBLE = 90e3, ACT_BUBBLE = 2500;
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const look = s => s.state === 'idle' || (s.state === 'done' && Date.now() - s.since > IDLE_AFTER) ? 'idle' : s.state;
const bridge = window.bobix; // present inside the app (src-tauri/bridge.js); absent in a plain browser tab
// A new side session whose parent link is not known yet (linking, state.rs) is left out until it is, so it never shows
// on its own first, nor shifts the other pets' colours, places or "+N" count meanwhile.
const forShow = list => (list || []).filter(s => !s.linking);

let cfg = { size: 56, edge: 'bottom', walkDir: 'ltr', petMode: 'edge', dndUntil: 0, zoneStart: 0, zoneEnd: 100, opacity: 1, fadeNearCursor: true, showIdle: true, sleepHide: 30, onlyAttention: false, label: 'title', clickAction: 'focus', language: 'auto' };
let lang = navigator.language;
const T = (k, v) => I18N.t(lang, k, v);

const pets = new Map(); // id -> { el, s, x, actAt, hover, key, lane, fx ... }
let mouse = { x: -1, y: -1 };

// A pet asleep for longer than sleepHide minutes leaves the screen; the next prompt brings it back.
const sleptTooLong = s => cfg.sleepHide > 0 && Date.now() - (s.state === 'done' ? s.since + IDLE_AFTER : s.since) > cfg.sleepHide * 60e3;
const visible = s => {
  const st = look(s);
  if (s.pet === 'hidden' || dndOn()) return false; // "do not disturb" hides them all
  if (st === 'idle' && s.pet !== 'shown' && sleptTooLong(s)) return false;
  return cfg.onlyAttention ? st === 'waiting' || st === 'done' : cfg.showIdle || st !== 'idle';
};
function labelOf(s) {
  const title = s.title || s.name;
  return cfg.label === 'folder' ? s.name : cfg.label === 'both' && s.title ? `${s.title} · ${s.name}` : title;
}
function statusText(s, st) {
  if (st === 'working') return s.tool ? T('status.working', { tool: I18N.toolLabel(lang, s.tool) }) : T('status.thinking');
  if (st === 'waiting') return s.askTool ? T('status.waitingTool', { tool: s.askTool }) : T('status.waiting');
  return T(`status.${st}`);
}
function sayText(p, st, now) {
  const s = p.s;
  if (st === 'waiting') return ['waiting', s.askTool ? T('pet.waiting', { tool: s.askTool }) : T('pet.waitingPlain')];
  if (st === 'done' && now - s.since < DONE_BUBBLE) return ['done', T('pet.done')];
  if (st === 'working' && s.tool && now - p.actAt < ACT_BUBBLE) return ['', I18N.toolLabel(lang, s.tool)];
  return null;
}

// Allow / Deny while a permission request waits for Bobix (seconds left, then the terminal asks; Infinity: no countdown).
const left = (s, now) => (!s.answer ? 0 : s.answer.until == null ? Infinity : Math.max(0, Math.ceil((s.answer.until - now) / 1000)));
function answerButtons(s, now) {
  const n = left(s, now);
  if (!n || !bridge) return `<span class="where">${T(approveWhere(s))}</span>`; // Bobix can't answer it: say where it can be
  return `<span class="answer">`
    + `<button class="btn sm pri" type="button" data-answer="allow">${T('ask.allow')}</button><button class="btn sm" type="button" data-answer="deny">${T('ask.deny')}</button>`
    + (n === Infinity ? '' : `<span class="left" data-sid="${esc(s.id)}">${T('ask.left', { n })}</span>`) + '</span>';
}
// Side sessions: a side session's pet is smaller, walks right behind its parent and names the session it came from.
const attached = s => !!(s.parent && pets.has(s.parent)); // walks with its parent pet
// What a pet has to tell you: it waits for you, or it is done (for DONE_BUBBLE). Every pet speaks for itself.
function reportOf(s, now) {
  const st = look(s);
  if (st === 'waiting') return { kind: 'waiting', text: s.askTool ? T('pet.waiting', { tool: s.askTool }) : T('pet.waitingPlain') };
  if (st === 'done' && now - s.since < DONE_BUBBLE) return { kind: 'done', text: T('pet.done') };
  return null;
}
const byId = id => (lastList || []).find(x => x.id === id);
const kidsOf = s => (lastList || []).filter(x => x.parent === s.id);
function kidsText(s) {
  const k = kidsOf(s);
  if (!k.length) return null;
  const w = k.filter(x => look(x) === 'waiting').length;
  return [w > 0, w ? T('pet.kidsWaiting', { n: k.length, w }) : T('pet.kids', { n: k.length })];
}
// A flat pet acts its state frame by frame (creature.js poseAt): walking while the line moves and it works, from the
// time its state began; with reduced motion it holds the first frame. A picture pet has no poses (null).
function poseOf(p, art, st) {
  if (art.image) return null;
  return poseAt(st, FX_ON ? Date.now() - (p.s.since || 0) : 0, p.stepping && st === 'working' ? (rtl() ? 'L' : 'R') : '');
}
function paint(p, now) {
  const s = p.s, st = look(s), kid = attached(s), color = petColor(s, lastList || []), art = (s.parent && byId(s.parent)) || s, pose = poseOf(p, art, st), fr = pose ? pose.join() : '';
  p.art = [art, color]; // what the pet looks like, for its effects
  const fam = !kid && kidsOf(s).some(k => visible(k)), mine = reportOf(s, now);
  // Hovered: its own card, or its request and buttons while it waits for you (the card would cover them).
  const card = p.hover && st !== 'waiting';
  // Its balloon only while no effect plays (reduced motion): the aura and the XP bar say the same.
  const balloon = mine && !p.hover ? statusBalloon(FX_ON, mine.kind) : '';
  // A bubble: its request when hovered; the tool it just picked up, for a pet on its own.
  const t = p.hover ? !card && sayText(p, st, now) : !kid && !fam && st === 'working' && sayText(p, st, now);
  const say = (habitSay && habitSay.id === s.id && !p.hover && Date.now() < habitSay.until ? ['habit', habitSay.text] : null) || (t && (p.hover || t[0] === '') ? t : null);
  const key = JSON.stringify([st, s.lv, s.ask, s.askTool, s.quest, s.summary, s.ctx, card && [s.usage, cfg.usageCost], s.tool, s.title, s.name, card, say, balloon, p.stepping, p.dragging, p.edge, left(s, now) > 0, s.image, s.whole, s.project, s.issue?.iid, color, s.parent && byId(s.parent)?.title, kidsText(s), kid, cfg.label, cfg.clickAction, cfg.walkDir, lang]);
  if (p.key === key) { // only its pose moved: swap the picture, keep the rest (a card being clicked, say)
    if (fr !== p.fr) { p.fr = fr; const svg = p.el.querySelector('.spr>svg'); if (svg) svg.outerHTML = petArt(art, st, color, pose); }
    return;
  }
  p.key = key; p.fr = fr;
  const hp = s.ctx;
  const keep = ['line-off', 'fx-hide', 'leaving'].filter(c => p.el.classList.contains(c)).map(c => ' ' + c).join(''); // set by the line and the effects
  p.el.className = `pet st-${st}${p.fx ? ` fx${['xp', 'ctx'].includes(p.fx.kind) ? ' fx-over' : ''}` : ''}${p.stepping ? ' walking' : ''}${p.dragging ? ' dragging' : ''}${p.hover ? ' hover' : ''}${s.parent ? ' side' : ''}${kidsOf(s).length ? ' parent' : ''}${keep} ${p.edge}`;
  const kids = kidsText(s), parent = s.parent && byId(s.parent), model = s.usage && USAGE.mix(s.usage)[0]?.name;
  p.el.innerHTML = `
    ${card ? `<div class="card">
        <h2>${esc(s.title || s.name)}</h2>
        <p class="sub">${parent ? esc(T('pet.from', { name: parent.title || parent.name })) : esc(s.cwd)}</p>
        <p class="q">${esc(st === 'done' && s.summary ? s.summary : s.quest || T('line.noQuest'))}</p>
        <div class="row"><span class="st"><i class="dot ${st}"></i>${esc(statusText(s, st))}</span><span class="bdg">${model ? `<span class="badge">${esc(model)}</span>` : ''}<span class="badge">${T('pet.lv', { n: s.lv })}</span></span></div>
        ${kids ? `<div class="row"><span class="st">${esc(kids[1])}</span></div>` : ''}
        <div class="row ctx"><span>${T('ctx')}</span><span>${hp == null ? '?' : hp + '%'}</span></div>
        <div class="meter ${hp != null && hp < 25 ? 'low' : ''}"><i style="--v:${(hp ?? 0) / 100}"></i></div>
        ${s.usage ? `<div class="row use"><span>${esc(USAGE.line(s.usage, T, cfg))}</span></div>${USAGE.warns(s.usage, T).slice(0, 1).map(w => `<p class="need use">⚠ ${esc(w.text)}</p>`).join('')}` : ''}
        <div class="hint"><span>${T(cfg.clickAction === 'focus' ? 'pet.clickFocus' : 'pet.clickPanel')}</span>${bridge ? `<button class="btn sm ghost" type="button" data-hide>${T('pet.hide')}</button>` : ''}</div></div>` : ''}
    ${balloon ? `<div class="bb ${balloon}" data-bb title="${esc(mine.text)}">${balloonSVG(balloon, cfg.edge === 'top')}</div>` : ''}
    ${say && say[1] ? `<div class="say ${say[0]}"${say[0] === 'habit' ? ' data-habit' : ''}>${esc(say[1])}${say[0] === 'waiting' ? answerButtons(s, now) : ''}</div>` : ''}
    ${st === 'idle' ? '<span class="zz">z</span>' : ''}
    <div class="spr">${petArt(art, st, color, pose)}</div>
    ${kid ? '<div class="tag ghost" aria-hidden="true">·</div>' : `<div class="tag"><span class="nm">${parent ? '↳ ' : ''}${esc(labelOf(s))}</span>${s.issue ? `<span class="iss">#${s.issue.iid}</span>` : ''}</div>`}`;
  if (p.fx) p.el.querySelector('.spr').append(p.fl);
}

function sync(list) {
  if (odOn()) return odSync(list); // "show when needed": pets-ondemand.js
  const seen = new Set();
  for (const s of list) {
    if (!visible(s)) continue;
    seen.add(s.id);
    let p = pets.get(s.id);
    if (!p) {
      const el = document.createElement('div');
      document.body.appendChild(el);
      el.className = 'pet line-off';
      p = { el, x: zone().min, actAt: 0, edge: '', edgeFade: 0 }; // out of sight until the line takes it in
      draggable(p, s.id);
      pets.set(s.id, p);
    }
    if (p.s && s.tool !== p.s.tool && s.hits !== p.s.hits) p.actAt = Date.now();
    if (FX_ON) for (const [kind, o] of fxEvents(p.s || null, s)) p.queue = fxQueue(p.queue || [], p.fx?.kind, kind, o);
    p.s = s;
  }
  const ended = new Set(pets.keys());
  for (const s of list) ended.delete(s.id);
  for (const [id, p] of pets) if (!seen.has(id)) {
    pets.delete(id);
    // A session that ended (gone from the list, not just off screen) waves goodbye before its pet goes.
    if (FX_ON && ended.has(id) && !p.el.classList.contains('line-off') && fxStart(p, 'end')) { p.leaving = true; p.queue = []; p.el.style.pointerEvents = 'none'; p.el.classList.add('leaving'); leaving.add(p); }
    else { if (p.fx) p.fx.done = true; p.el.remove(); }
  }
}

// ---------- effects (pet-fx.js) ----------
// One-shots (a finished task's XP, low context, the end) queue on the pet and play one after the other, drawn as flat
// SVG round the pet. Nothing runs or draws while no effect plays.
const FX_ON = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const leaving = new Set(); // pets of ended sessions playing their goodbye
const fxCell = () => cfg.size / 18; // CSS px per effect cell (the pet's box is 18 cells)
function fxStart(p, kind, o = {}) {

    postRects(t, rects);
  }
  const busy = mouseMoved || !!drag || leaving.size > 0 || all.some(p => p.stepping || p.hover || p.fx);
  mouseMoved = false;
  if (busy && !document.hidden) raf = requestAnimationFrame(frame);
  else timer = setTimeout(() => frame(performance.now()), FX_ON && all.some(p => p.fr) ? 150 : all.length ? 400 : 1000); // a pose's next frame
}

// Seconds left to answer a request, without redrawing its card.
function tickLeft(now) {
  for (const el of document.querySelectorAll('.answer .left[data-sid]')) {
    const t = byId(el.dataset.sid), txt = T('ask.left', { n: t ? left(t, now) : 0 });
    if (el.textContent !== txt) el.textContent = txt;
  }
}
// The parts of the window that take the mouse (the rest lets it through), at most every 100 ms and only when changed.
function postRects(t, rects) {
  if (!bridge || t - rectAt <= 100) return;
  rectAt = t;
  const j = JSON.stringify(rects);
  if (j !== lastRects) { lastRects = j; bridge.setRects(rects); }
}
// Leaving edge mode: every pet of the line goes at once.
function clearEdge() {
  for (const p of [...pets.values(), ...leaving]) { if (p.fx) fxStop(p); p.el.remove(); }
  pets.clear(); leaving.clear();
  Object.assign(LINEUP, { vis: [], wait: [], held: null, booted: false });
}
let dndTimer = 0;
function applySettings(s) {
  const was = cfg.petMode;
  cfg = { ...cfg, ...s };
  if (cfg.petMode !== was) { if (odOn()) clearEdge(); else odClear(); }
  clearTimeout(dndTimer); // "do not disturb" ends by time alone: the pets come back then
  if (dndOn()) dndTimer = setTimeout(() => { if (lastList) sync(lastList); wake(); }, cfg.dndUntil - Date.now() + 50);
  lang = cfg.language === 'auto' ? navigator.language : cfg.language;
  document.body.classList.toggle('edge-top', cfg.edge === 'top');
  document.documentElement.style.setProperty('--size', cfg.size + 'px');
  for (const p of pets.values()) { p.key = null; if (p.fx) fxStop(p); } // effects start again for the new edge and size
  for (const p of OD.pets.values()) if (!p.leaving) { p.key = null; odPaint(p); odRide(p); } // balloons drawn again for the new size
  if (lastList) sync(lastList);
  wake();
}

let lastList = null;
// Habits (#80, Settings → "Bobix nhớ gì về bạn"): the morning "start of day" suggestion, once a day for a minute, on a
// pet of that folder (else the first one); a click on it opens the board. No other suggestion comes to the pets.
let habitSay = null, lastModel = null, habitBusy = false;
async function habitMorning() {
  const now = Date.now(), today = window.HABITS && HABITS.dayOf(now);
  if (!bridge || !today || !cfg.habitsOn || habitBusy || habitSay || cfg.habitsPetDay === today || new Date(now).getHours() >= 12 || !lastList?.length) return;
  habitBusy = true;
  try {
    const d = await bridge.habitsRead().catch(() => null);
    if (!d || HABITS.loggedDays(d.events) < HABITS.MIN_DAYS || (cfg.habitsNo?.morning || 0) >= 3) return;
    const c = HABITS.morning(d.events, lastModel, lastList, now);
    if (!c || (cfg.habitsHidden || {})[c.id] != null) return;
    const roots = [...pets.values()].filter(p => !attached(p.s) && visible(p.s)), p = roots.find(x => x.s.project === c.dir) || roots[0];
    if (!p) return;
    const when = HABITS.dayOf(now - 864e5) === HABITS.dayOf(c.at) ? T('hab.yesterday') : new Date(c.at).toLocaleDateString(lang, { weekday: 'long' });
    habitSay = { id: p.s.id, text: T('pet.habit', { n: c.iid, d: when }), until: now + 60e3 };
    cfg.habitsPetDay = today;
    bridge.setSettings({ habitsPetDay: today });
    setTimeout(() => { habitSay = null; for (const q of pets.values()) q.key = null; wake(); }, 60e3);
    p.key = null; wake();
  } finally { habitBusy = false; }
}
setInterval(habitMorning, 5 * 60e3);
const moveTo = m => { mouse = m; mouseMoved = true; wake(); };
addEventListener('mousemove', e => moveTo({ x: e.clientX, y: e.clientY }));
addEventListener('mouseleave', () => moveTo({ x: -1, y: -1 }));
document.addEventListener('visibilitychange', wake);
if (bridge) {
  bridge.onMouse(moveTo);            // the window is click-through most of the time, so the app feeds us the cursor
  bridge.onSettings(applySettings);
  bridge.getState().then(st => applySettings(st.settings));
}
new EventSource('/events?t=' + encodeURIComponent(new URLSearchParams(location.search).get('t') || '')).onmessage = m => { const d = JSON.parse(m.data); lastModel = d.model || null; lastList = forShow(d.sessions); sync(lastList); wake(); if (!habitSay) habitMorning(); };
setInterval(() => lastList && sync(lastList), 15e3); // "done" turns into "resting" by time alone
frame(performance.now());
</script>
</body>
</html>
