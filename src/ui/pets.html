<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bobix pets</title>
<link rel="stylesheet" href="/ui/fonts/fonts.css">
<link rel="stylesheet" href="/ui/theme.css">
<style>
/* Runs inside a transparent, click-through window covering the screen's work area. */
html{--size:56px}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;font:400 var(--t-sm)/1.45 var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
.pet{position:absolute;left:0;bottom:var(--s1);width:var(--size);cursor:pointer;touch-action:none;transform-origin:50% 100%;transition:opacity 150ms var(--ease),scale 250ms var(--ease),translate 250ms var(--ease),filter 250ms var(--ease)}
.pet.dragging{cursor:grabbing}
.pet.hover,.pet.open{z-index:3}
.pet:not(.parent):not(.side){z-index:1} /* a pet on its own stays above a family it walks past, name tag included */
.edge-top .pet{bottom:auto;top:var(--s1)}
.spr{position:relative;width:var(--size);height:var(--size);display:grid;place-items:center}
.spr svg{width:100%;height:100%;filter:drop-shadow(0 2px 0 oklch(30% 0.04 262 / .25))}
.tag{position:relative;left:50%;transform:translateX(-50%);width:max-content;max-width:160px;padding:0 var(--s2);border-radius:var(--pill);background:var(--surface);border:1px solid var(--line-strong);font-size:var(--t-xs);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-waiting .tag{background:var(--coral);border-color:var(--coral);color:var(--n-900)}
.pet.side .spr{transform:scale(.8);transform-origin:50% 100%}
.tag.ghost{visibility:hidden}
.tag{max-width:none;transform:none;overflow:visible;display:flex;justify-content:center;align-items:center;gap:var(--s1);box-sizing:border-box}
.tag .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tag .more{position:relative;flex:none;color:var(--ink-3);cursor:pointer}
.tag.kl .more{order:-1}
.tag .more .bb{bottom:calc(100% + 2px);left:auto;right:calc(var(--size) * -.3);translate:none;width:calc(var(--size) * .36)}
.tag.kl .more .bb{right:auto;left:calc(var(--size) * -.3)}
.say.sum{cursor:pointer}
.bb{position:absolute;left:50%;bottom:calc(100% - var(--size) * .08);width:calc(var(--size) * .5);translate:-50% 0;cursor:pointer;animation:bob 2.6s var(--ease) infinite;transform-origin:50% 100%}
.pet.side .bb{width:calc(var(--size) * .42)}
/* Top edge: the balloon floats below the pet's name tag, its string up (balloonSVG draws it upside down there). */
.edge-top .bb{bottom:auto;top:calc(100% + 2px)}
.edge-top .tag .more .bb{bottom:auto;top:calc(100% + 2px)}
.bb svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 0 oklch(30% 0.04 262 / .2))}
.tag .more.hot{color:var(--coral-ink)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.say .who{font-weight:700}
.card.group{width:340px;max-height:260px;overflow:auto}
/* One bubble lane further out than the summary bubble, so that bubble stays visible and closes the card again. */
.say~.card.group{bottom:calc(100% + var(--s2) + (var(--lane, 0) + 1) * 36px)}
.edge-top .say~.card.group{bottom:auto;top:calc(100% + var(--s2) + (var(--lane, 0) + 1) * 36px)}
.card.group .gr{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) 0;border-top:1px solid var(--line);font-size:var(--t-xs)}
.card.group .gr:first-of-type{border-top:0}
.card.group .gr .mini{flex:none;width:22px;height:22px}
.card.group .gr .mini svg{width:100%;height:100%}
.card.group .gr .nm{font-weight:700;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.group .gr .stx{flex:1;min-width:0;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.group .gr .answer{margin:0}
.card.group .gr.waiting .stx{color:var(--coral-ink);font-weight:600}
.card.group .open{flex:none;font:600 var(--t-xs) var(--f-body);border-radius:var(--pill);padding:0 var(--s2);border:1px solid var(--line-strong);background:var(--surface);cursor:pointer}
.st-idle .spr{opacity:.75}
.say,.card{position:absolute;bottom:calc(100% + var(--s2) + var(--lane, 0) * 36px);left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:var(--lift)}
.edge-top .say,.edge-top .card{bottom:auto;top:calc(100% + var(--s2) + var(--lane, 0) * 36px)}
.edge-l .say,.edge-l .card{left:0;transform:none}
.edge-r .say,.edge-r .card{left:auto;right:0;transform:none}
.say{padding:var(--s1) var(--s3);white-space:nowrap;font-weight:500;animation:pop 200ms var(--ease)}
.say.waiting{background:var(--coral-soft);border-color:var(--coral);color:var(--coral-ink);font-weight:600}
.say.done{background:var(--mint-soft)}
.answer{display:inline-flex;align-items:center;gap:var(--s1);margin-left:var(--s2)}
.answer button{font:600 var(--t-xs) var(--f-body);border-radius:var(--pill);padding:0 var(--s2);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.answer button[data-answer="allow"],.answer button[data-answer="always"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.answer button:hover{filter:brightness(1.1)}
.answer .left{font-weight:500;color:var(--ink-3)}
.card .answer{display:flex;flex-wrap:wrap;margin:0 0 var(--s2)}
.card{width:272px;padding:var(--s3) var(--s4);z-index:2;animation:pop 150ms var(--ease)}
.card h2{font:700 var(--t-lg)/1.15 var(--f-display);margin:0;overflow-wrap:anywhere}
.card .sub{font-size:var(--t-xs);color:var(--ink-3);margin:0 0 var(--s2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .q{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 var(--s2)}
.card .row{display:flex;justify-content:space-between;gap:var(--s2);font-size:var(--t-xs);color:var(--ink-3)}
.card .st{font-weight:600;color:var(--ink)}
.st-waiting .card .st{color:var(--coral-ink)}
.meter{height:6px;border-radius:var(--pill);background:var(--n-200);overflow:hidden;margin:var(--s1) 0 var(--s2)}
.meter i{display:block;height:100%;background:var(--ink-2);transform-origin:left;transform:scaleX(var(--v))}
.meter.low i{background:var(--coral)}
.card .hint{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);font-size:var(--t-xs);color:var(--ink-3);border-top:1px solid var(--line);padding-top:var(--s2);margin-top:var(--s1)}
.card .hide{flex:none;font:600 var(--t-xs) var(--f-body);color:var(--ink-2);background:var(--n-100);border:1px solid var(--line-strong);border-radius:var(--pill);padding:0 var(--s2);cursor:pointer}
.card .hide:hover{background:var(--n-200);color:var(--ink)}
.zz{position:absolute;left:70%;top:-6px;font:700 var(--t-sm) var(--f-display);color:var(--ink-3);animation:zz 2.4s var(--ease) infinite}
.eye{transform-box:fill-box;transform-origin:center}
.st-working .eye{animation:blink 4.2s infinite}
.spr svg.faced{position:absolute;left:-5%;bottom:0;width:110%;height:110%}
.edge-top .spr svg.faced{bottom:auto;top:0}
.walking .spr svg{animation:step 320ms steps(2) infinite}
.st-waiting .spr svg{animation:hop 900ms var(--ease) infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.15)}}
@keyframes step{to{transform:translateY(-3px)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
@keyframes pop{from{opacity:0;translate:0 4px}}
@keyframes zz{0%{opacity:0;translate:0 0}40%{opacity:1}100%{opacity:0;translate:8px -12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<script src="/ui/i18n.js"></script>
<script src="/ui/creature.js"></script>
<script>
const IDLE_AFTER = 10 * 60e3, DONE_BUBBLE = 90e3, ACT_BUBBLE = 2500;
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const look = s => s.state === 'idle' || (s.state === 'done' && Date.now() - s.since > IDLE_AFTER) ? 'idle' : s.state;
const bridge = window.bobix; // present inside the app (preload); absent in a plain browser tab

let cfg = { size: 56, edge: 'bottom', zoneStart: 0, zoneEnd: 100, opacity: 1, fadeNearCursor: true, showIdle: true, sleepHide: 30, onlyAttention: false, label: 'title', clickAction: 'focus', language: 'auto' };
let lang = navigator.language;
const T = (k, v) => I18N.t(lang, k, v);

const pets = new Map(); // id -> { el, s, x, dir, walking, next, actAt, hover, key, goal, lane }
let mouse = { x: -1, y: -1 };

// A pet asleep for longer than sleepHide minutes leaves the screen; the next prompt brings it back.
const sleptTooLong = s => cfg.sleepHide > 0 && Date.now() - (s.state === 'done' ? s.since + IDLE_AFTER : s.since) > cfg.sleepHide * 60e3;
const visible = s => {
  const st = look(s);
  if (s.pet === 'hidden') return false;
  if (st === 'idle' && s.pet !== 'shown' && sleptTooLong(s)) return false;
  return cfg.onlyAttention ? st === 'waiting' || st === 'done' : cfg.showIdle || st !== 'idle';
};
function labelOf(s) {
  const title = s.title || s.name;
  return cfg.label === 'folder' ? s.name : cfg.label === 'both' && s.title ? `${s.title} · ${s.name}` : title;
}
function statusText(s, st) {
  if (st === 'working') return s.tool ? T('status.working', { tool: I18N.toolLabel(lang, s.tool) }) : T('status.thinking');
  if (st === 'waiting') return s.askTool ? T('status.waitingTool', { tool: s.askTool }) : T('status.waiting');
  return T(`status.${st}`);
}
function sayText(p, st, now) {
  const s = p.s;
  if (st === 'waiting') return ['waiting', s.askTool ? T('pet.waiting', { tool: s.askTool }) : T('pet.waitingPlain')];
  if (st === 'done' && now - s.since < DONE_BUBBLE) return ['done', T('pet.done')];
  if (st === 'working' && s.tool && now - p.actAt < ACT_BUBBLE) return ['', I18N.toolLabel(lang, s.tool)];
  return null;
}

// Allow / Deny while a permission request waits for Bobix (seconds left, then the terminal asks).
const left = (s, now) => (s.answer ? Math.max(0, Math.ceil((s.answer.until - now) / 1000)) : 0);
function answerButtons(s, now, withAlways) {
  const n = left(s, now);
  if (!n || !bridge) return '';
  const sid = `data-sid="${esc(s.id)}"`;
  return `<span class="answer">${withAlways && s.answer.always ? `<button type="button" ${sid} data-answer="always">${T('ask.always')}</button>` : ''}`
    + `<button type="button" ${sid} data-answer="allow">${T('ask.allow')}</button><button type="button" ${sid} data-answer="deny">${T('ask.deny')}</button>`
    + `<span class="left" data-sid="${esc(s.id)}">${T('ask.left', { n })}</span></span>`;
}
// Side sessions: a side session's pet is smaller and names the session it came from; the parent counts its side sessions.
// How a family (a parent and its side sessions) tells you things: while at most two of its pets need you, each holds
// a pixel balloon; from three, one bubble sums them up and opens the family card.
const BALLOONS_UP_TO = 2;
const KID_MAX = 10, URGENT = { waiting: 0, done: 1, working: 2, idle: 3 };
const byUrgency = (a, b) => (URGENT[look(a)] - URGENT[look(b)]) || (b.since - a.since) || (a.id < b.id ? -1 : 1);
const attached = s => !!(s.parent && pets.has(s.parent)); // stands next to its parent pet
// A pet walks while its session works; a parent also while any side session beside it works (the family walks together).
const walks = p => look(p.s) === 'working' || kidsOf(p.s).some(k => pets.has(k.id) && look(k) === 'working');
const rootOf = s => (attached(s) ? byId(s.parent) || s : s);
const balloonsFor = (root, now) => familyReports(root, now).filter(r => r.kind).length <= BALLOONS_UP_TO;
// A party balloon in the pets' pixel style: orange with "!" waits for you, green with a tick is done. Its string hangs to the pet.
// On the top edge it floats below the pet: balloon and string are flipped, the "!" / tick and the shine are not.
function balloonSVG(kind) {
  const down = cfg.edge === 'top';
  const W = 11, rows = ['...xxxxx...', '..xxxxxxx..', '.xxxxxxxxx.', 'xxxxxxxxxxx', 'xxxxxxxxxxx', 'xxxxxxxxxxx', 'xxxxxxxxxxx',
    '.xxxxxxxxx.', '.xxxxxxxxx.', '..xxxxxxx..', '...xxxxx...', '....xxx....', '.....x.....'];
  const on = new Set(); rows.forEach((r, y) => [...r].forEach((c, x) => c === 'x' && on.add(`${x},${y}`)));
  const fill = kind === 'waiting' ? 'var(--coral)' : 'var(--mint)', line = `color-mix(in oklch, ${fill} 45%, var(--n-900))`;
  const icon = kind === 'waiting' ? [[5, 3], [5, 4], [5, 5], [5, 6], [5, 8]] : [[3, 5], [4, 6], [5, 7], [6, 6], [7, 5], [8, 4]];
  const shine = [[3, 2], [2, 3], [2, 4]], px = (x, y, f) => `<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`;
  let out = '';
  for (const k of on) { const [x, y] = k.split(',').map(Number); const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => !on.has(`${x + a},${y + b}`)); out += px(x, y, edge ? line : fill); }
  out += [5, 5, 6, 6, 5, 5, 4, 4, 5].map((x, i) => px(x, 13 + i, 'var(--ink-3)')).join(''); // the string
  // Flipped, body row y shows at 21 - y; the upright marks shift by 11 so they land on the same part of the body.
  const marks = shine.map(([x, y]) => px(x, y + (down ? 11 : 0), 'oklch(98% 0.01 90 / .85)')).join('') + icon.map(([x, y]) => px(x, y + (down ? 11 : 0), 'var(--n-900)')).join('');
  return `<svg viewBox="0 0 ${W} 22" shape-rendering="crispEdges" aria-hidden="true">${down ? `<g transform="matrix(1 0 0 -1 0 22)">${out}</g>` : out}${marks}</svg>`;
}
const shortName = s => { const n = s.title || s.name || ''; return n.length > 18 ? n.slice(0, 17) + '…' : n; };
// Everyone in a family that has something to say to you: waiting and done for all, tool activity for the parent only.
function familyReports(parent, now) {
  const members = [parent, ...(lastList || []).filter(x => x.parent === parent.id && visible(x)).sort(byUrgency)];
  return members.map(m => {
    const st = look(m);
    if (st === 'waiting') return { s: m, kind: 'waiting', text: m.askTool ? T('pet.waiting', { tool: m.askTool }) : T('pet.waitingPlain') };
    if (st === 'done' && now - m.since < DONE_BUBBLE) return { s: m, kind: 'done', text: T('pet.done') };
    const p = pets.get(m.id);
    if (m === parent && st === 'working' && m.tool && p && now - p.actAt < ACT_BUBBLE) return { s: m, kind: '', text: I18N.toolLabel(lang, m.tool) };
    return null;
  }).filter(Boolean).sort((a, b) => (URGENT[a.kind || 'working'] - URGENT[b.kind || 'working']));
}
const whoHTML = (r, parent) => (r.s !== parent ? `<span class="who">${esc(shortName(r.s))}</span> · ` : '');
function summaryText(reports) {
  const w = reports.filter(r => r.kind === 'waiting').length, d = reports.filter(r => r.kind === 'done').length;
  return [w && T('fam.waiting', { n: w }), d && T('fam.done', { n: d })].filter(Boolean).join(' · ') || T('fam.busy', { n: reports.length });
}
const byId = id => (lastList || []).find(x => x.id === id);
const kidsOf = s => (lastList || []).filter(x => x.parent === s.id);
function kidsText(s) {
  const k = kidsOf(s);
  if (!k.length) return null;
  const w = k.filter(x => look(x) === 'waiting').length;
  return [w > 0, w ? T('pet.kidsWaiting', { n: k.length, w }) : T('pet.kids', { n: k.length })];
}
function paint(p, now) {
  const s = p.s, st = look(s), kid = attached(s), root = rootOf(s), useBalloons = balloonsFor(root, now);
  const reports = !kid ? familyReports(s, now) : [], fam = !kid && kidsOf(s).some(k => visible(k));
  const mine = familyReports(root, now).find(r => r.s.id === s.id && r.kind);
  const balloon = useBalloons && mine && !p.hover ? mine.kind : '';
  let say = null; // [kind, text or null, one report or null]
  if (!p.hover && !kid) {
    if (!useBalloons && reports.length > 1) say = [reports.some(r => r.kind === 'waiting') ? 'waiting' : 'done', summaryText(reports), null];
    else if (!fam && !useBalloons) { const t = sayText(p, st, now); say = t && [t[0], t[1], null]; }
    else if (useBalloons && st === 'working' && !fam) { const t = sayText(p, st, now); say = t && t[0] === '' ? [t[0], t[1], null] : null; } // tool activity, only on its own
  }
  const hidden = kid ? [] : kidsOf(s).filter(k => visible(k) && !pets.has(k.id)), extra = hidden.length;
  // Same rule as the side sessions' own balloons: "done" shows for DONE_BUBBLE, not until the pet falls asleep.
  const extraHot = hidden.some(k => look(k) === 'waiting') ? 'waiting' : hidden.some(k => look(k) === 'done' && now - k.since < DONE_BUBBLE) ? 'done' : '';
  if (p.groupOpen && !(reports.length > 1 || extra > 0)) p.groupOpen = false; // nothing left to list: closed, not reopened later
  const groupOpen = !!p.groupOpen;
  const famKey = JSON.stringify(familyReports(root, now).map(r => [r.s.id, r.kind, r.text, left(r.s, now) > 0, petColor(r.s, lastList || [])]));
  const key = JSON.stringify([st, s.lv, s.ask, s.askTool, s.quest, s.summary, s.ctx, s.tool, s.title, s.name, p.hover, say, balloon, p.stepping, p.dragging, p.edge, left(s, now) > 0, s.image, s.project, petColor(s, lastList || []), s.parent && byId(s.parent)?.title, kidsText(s), famKey, extra, extraHot, groupOpen, kid, cfg.label, cfg.clickAction, lang]);
  if (p.key === key) return;
  p.key = key;
  const hp = s.ctx;
  p.el.className = `pet st-${st}${p.stepping ? ' walking' : ''}${p.dragging ? ' dragging' : ''}${p.hover ? ' hover' : ''}${groupOpen ? ' open' : ''}${s.parent ? ' side' : ''}${kidsOf(s).length ? ' parent' : ''} ${p.edge}`;
  const kids = kidsText(s), parent = s.parent && byId(s.parent);
  p.el.innerHTML = `
    ${p.hover ? `<div class="card">
        <h2>${esc(s.title || s.name)}</h2>
        <p class="sub">${parent ? esc(T('pet.from', { name: parent.title || parent.name })) : esc(s.cwd)}</p>
        <p class="q">${esc(st === 'done' && s.summary ? s.summary : s.quest || T('line.noQuest'))}</p>
        ${st === 'waiting' ? answerButtons(s, now, true) : ''}
        <div class="row"><span class="st">${esc(statusText(s, st))}</span><span>${T('pet.lv', { n: s.lv })}</span></div>
        ${kids ? `<div class="row"><span class="st">${esc(kids[1])}</span></div>` : ''}
        <div class="row"><span>${T('ctx')}</span><span>${hp == null ? '?' : hp + '%'}</span></div>
        <div class="meter ${hp != null && hp < 25 ? 'low' : ''}"><i style="--v:${(hp ?? 0) / 100}"></i></div>
        <div class="hint"><span>${T(cfg.clickAction === 'focus' ? 'pet.clickFocus' : 'pet.clickPanel')}</span>${bridge ? `<button class="hide" type="button" data-hide>${T('pet.hide')}</button>` : ''}</div></div>` : ''}
    ${say && say[2] ? `<div class="say ${say[0]}">${whoHTML(say[2], s)}${esc(say[2].text)}${say[0] === 'waiting' ? answerButtons(say[2].s, now, false) : ''}</div>` : ''}
    ${say && !say[2] && say[1] && reports.length > 1 && !useBalloons ? `<div class="say sum ${say[0]}" data-group>${esc(say[1])} ▸</div>` : ''}
    ${balloon ? `<div class="bb ${balloon}" data-bb title="${esc(mine.text)}">${balloonSVG(balloon)}</div>` : ''}
    ${say && !say[2] && !(reports.length > 1 && !useBalloons) && say[1] ? `<div class="say ${say[0]}">${esc(say[1])}${say[0] === 'waiting' ? answerButtons(s, now, false) : ''}</div>` : ''}
    ${groupOpen ? `<div class="card group">${[s, ...kidsOf(s).filter(k => visible(k)).sort(byUrgency)].map(m => { const ms = look(m);
      return `<div class="gr ${ms}"><span class="mini">${petArt(m.parent ? s : m, ms, petColor(m, lastList || []))}</span><span class="nm">${esc(shortName(m))}</span><span class="stx">${esc(statusText(m, ms))}</span>${ms === 'waiting' ? answerButtons(m, now, false) : ''}<button class="open" type="button" data-open="${esc(m.id)}">${T('fam.open')}</button></div>`; }).join('')}</div>` : ''}
    ${st === 'idle' ? '<span class="zz">z</span>' : ''}
    <div class="spr">${petArt(parent || s, st, petColor(s, lastList || []))}</div>
    ${kid ? '<div class="tag ghost" aria-hidden="true">·</div>' : `<div class="tag"><span class="nm">${parent ? '↳ ' : ''}${esc(labelOf(s))}</span>${extra ? `<span class="more${extraHot ? ' hot' : ''}" data-group title="${esc(T('fam.more', { n: extra }))}">+${extra}${extraHot && !p.hover ? `<span class="bb ${extraHot}">${balloonSVG(extraHot)}</span>` : ''}</span>` : ''}</div>`}`;
}

function sync(list) {
  const seen = new Set(), shownParents = new Set(list.filter(s => visible(s)).map(s => s.id)), keep = new Set();
  for (const id of shownParents) list.filter(k => k.parent === id && visible(k)).sort(byUrgency).slice(0, KID_MAX).forEach(k => keep.add(k.id));
  for (const s of list) {
    if (!visible(s)) continue;
    if (s.parent && shownParents.has(s.parent) && !keep.has(s.id)) continue; // counted in its parent's +N
    seen.add(s.id);
    let p = pets.get(s.id);
    if (!p) {
      const el = document.createElement('div');
      document.body.appendChild(el);
      const { min, max } = zone(), near = s.parent && pets.get(s.parent); // a side session starts next to its parent
