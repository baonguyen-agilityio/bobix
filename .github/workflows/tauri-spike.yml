# Spike only: does the Tauri pets overlay (tauri-spike/) build on each OS, and how big is the bundle?
name: tauri-spike
on:
  push:
    branches: [spike/tauri]
    paths: ['tauri-spike/**', '.github/workflows/tauri-spike.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bundles: 'app,dmg' }
          - { os: windows-latest, bundles: 'nsis' }
          - { os: ubuntu-22.04, bundles: 'deb,appimage' }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: tauri-spike, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci || npm install
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: Sizes
        run: |
          cd src-tauri/target/release
          ls -l bobix-tauri-spike* 2>/dev/null || true
          find bundle -maxdepth 2 \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app' \) -exec du -sk {} + | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-spike-${{ runner.os }}
          path: |
            tauri-spike/src-tauri/target/release/bundle/dmg/*.dmg
            tauri-spike/src-tauri/target/release/bundle/nsis/*.exe
            tauri-spike/src-tauri/target/release/bundle/deb/*.deb
            tauri-spike/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
