# Rust and node tests, then the app (debug build) on each OS with a pretend and a real session: pets on screen, the
# panel and its bridge, hooks, a held permission request answered (see src-tauri/src/smoke.rs).
name: smoke
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to a PR replaces the older run of that PR; runs on develop, main and tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev xvfb xdotool > /dev/null
      - name: Node tests
        run: npm test
      - name: Pets overlay in Chrome (no effect over another pet, no pets overlapping)
        run: node --test test/overlay.test.js
        env:
          OVERLAY_ONLY: ' 56 '
          OVERLAY_DUMP: overlay-dump
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: overlay-dump-${{ matrix.os }}
          path: overlay-dump/
          if-no-files-found: ignore
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build
        working-directory: src-tauri
        run: cargo build
      - name: Start a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          for i in $(seq 1 50); do DISPLAY=:99 xdotool getdisplaygeometry > /dev/null 2>&1 && break; sleep 0.2; done # ready before the app starts
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Smoke
        timeout-minutes: 4
        shell: bash
        env:
          BOBIX_SMOKE: smoke-out
          BOBIX_PORT: '4767'
        run: |
          export BOBIX_DATA_DIR="$RUNNER_TEMP/bobix-data" BOBIX_HOME="$RUNNER_TEMP/bobix-home"
          # Linux: take the path of an Ubuntu Wayland desktop (XWayland).
          if [ "$RUNNER_OS" = Linux ]; then export XDG_SESSION_TYPE=wayland; fi
          ./src-tauri/target/debug/bobix > smoke.log 2>&1 &
          for i in $(seq 1 120); do [ -f smoke-out/done ] && break; sleep 1; done
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM bobix.exe > /dev/null 2>&1 || true; else pkill -9 -f target/debug/bobix || true; fi
          grep "\[bobix\]" smoke.log || grep -m1 -A3 panicked smoke.log || tail -40 smoke.log
          node -e "const r = require('./smoke-out/report.json'); console.log(JSON.stringify(r, null, 2)); process.exit(r.pass ? 0 : 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-tauri-${{ matrix.os }}
          path: smoke-out/
