# Rust and node tests, then the app (debug build) on each OS with a pretend and a real session: pets on screen, the
# panel and its bridge, hooks, a held permission request answered (see src-tauri/src/smoke.rs).
name: smoke
on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to a PR replaces the older run of that PR; runs on develop, main and tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 8
        # Each apt command gets 150 s, so a stalled try is cut off and the next one runs. When the runner's Azure mirror
        # does not resolve, apt reads archive.ubuntu.com and security.ubuntu.com instead. An update that could not fetch
        # an index fails its try (install never runs on stale or missing lists). stderr stays visible.
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          if ! timeout 10 getent hosts azure.archive.ubuntu.com > /dev/null; then
            echo "azure.archive.ubuntu.com does not resolve: apt uses archive.ubuntu.com and security.ubuntu.com"
            [ -f /etc/apt/apt-mirrors.txt ] && printf 'http://archive.ubuntu.com/ubuntu/\nhttp://security.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sudo find /etc/apt -name '*.list' -o -name '*.sources' | xargs -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'
          fi
          for try in 1 2 3; do
            echo "apt try $try"
            ok=0
            if timeout 150 sudo apt-get $APT update -qq > /dev/null 2> apt-update.err && ! grep -q "Failed to fetch" apt-update.err; then
              cat apt-update.err >&2
              timeout 150 sudo apt-get $APT install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev xvfb xdotool > /dev/null && ok=1
            else
              cat apt-update.err >&2; echo "apt try $try: update failed or could not fetch an index"
            fi
            [ $ok = 1 ] && exit 0
            sleep 10
          done
          exit 1
      - name: Node tests
        run: npm test
      - name: Pets overlay in Chrome (no effect over another pet, no pets overlapping)
        timeout-minutes: 5
        run: node --test --test-timeout=270000 test/overlay.test.js
        env:
          OVERLAY_ONLY: ' 56 '
          OVERLAY_DUMP: overlay-dump
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: overlay-dump-${{ matrix.os }}
          path: overlay-dump/
          if-no-files-found: ignore
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Build
        working-directory: src-tauri
        run: cargo build
      - name: Start a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          for i in $(seq 1 50); do DISPLAY=:99 xdotool getdisplaygeometry > /dev/null 2>&1 && break; sleep 0.2; done # ready before the app starts
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Smoke
        timeout-minutes: 4
        shell: bash
        env:
          BOBIX_SMOKE: smoke-out
          BOBIX_PORT: '4767'
        run: |
          export BOBIX_DATA_DIR="$RUNNER_TEMP/bobix-data" BOBIX_HOME="$RUNNER_TEMP/bobix-home"
          # Linux: take the path of an Ubuntu Wayland desktop (XWayland).
          if [ "$RUNNER_OS" = Linux ]; then export XDG_SESSION_TYPE=wayland; fi
          ./src-tauri/target/debug/bobix > smoke.log 2>&1 &
          for i in $(seq 1 120); do [ -f smoke-out/done ] && break; sleep 1; done
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM bobix.exe > /dev/null 2>&1 || true; else pkill -9 -f target/debug/bobix || true; fi
          grep "\[bobix\]" smoke.log || grep -m1 -A3 panicked smoke.log || tail -40 smoke.log
          node -e "const r = require('./smoke-out/report.json'); console.log(JSON.stringify(r, null, 2)); process.exit(r.pass ? 0 : 1)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-tauri-${{ matrix.os }}
          path: smoke-out/
