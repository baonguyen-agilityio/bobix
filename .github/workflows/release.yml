# The installers: Bobix-mac-arm64.dmg, Bobix-mac-x64.dmg, Bobix-windows-x64.exe, bobix-linux-amd64.deb,
# bobix-linux-arm64.deb. Built on develop as this run's artifacts (to try a build; pull requests only run smoke.yml, and
# this workflow can be started by hand on any branch); a tag like v0.2.0 also attaches them to a GitHub Release (a tag
# with "-" makes a pre-release). Each installed (or opened) app runs the smoke check; Windows and Linux install the last
# Electron-based release first, so upgrading from it is checked too.
# The app updates itself from signed update files (docs/development.md, "Update feed"): with the repository secrets
# TAURI_SIGNING_PRIVATE_KEY (and its _PASSWORD) set, a build for a `v*` tag also signs its update file, attaches it and
# publishes the update lists (latest.json on a stable release, test.json on the "test-channel" release, for every tag).
# The key reaches no other run: a develop push or a run by hand builds the installers as before, without update files.
# A tag build without the secrets, with the placeholder public key, or whose tag is not package.json's version stops
# before it publishes anything.
name: release
on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, bundles: dmg, make: 'app,dmg', out: Bobix-mac-arm64.dmg, smoke: true }
          - { os: macos-latest, target: x86_64-apple-darwin, bundles: dmg, make: 'app,dmg', out: Bobix-mac-x64.dmg }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis, out: Bobix-windows-x64.exe, smoke: true }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: deb, out: bobix-linux-amd64.deb, smoke: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: deb, out: bobix-linux-arm64.deb }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_TAG: v0.1.4-rc.4 # the last Electron-based build: upgrading from it is checked
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 8
        # Each apt command gets 150 s, so a stalled try is cut off and the next one runs. When the runner's Azure mirror
        # does not resolve, apt reads archive.ubuntu.com and security.ubuntu.com instead. An update that could not fetch
        # an index fails its try (install never runs on stale or missing lists). stderr stays visible.
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          if ! timeout 10 getent hosts azure.archive.ubuntu.com > /dev/null; then
            echo "azure.archive.ubuntu.com does not resolve: apt uses archive.ubuntu.com and security.ubuntu.com"
            [ -f /etc/apt/apt-mirrors.txt ] && printf 'http://archive.ubuntu.com/ubuntu/\nhttp://security.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sudo find /etc/apt -name '*.list' -o -name '*.sources' | xargs -r sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g'
          fi
          for try in 1 2 3; do
            echo "apt try $try"
            ok=0
            if timeout 150 sudo apt-get $APT update -qq > /dev/null 2> apt-update.err && ! grep -q "Failed to fetch" apt-update.err; then
              cat apt-update.err >&2
              timeout 150 sudo apt-get $APT install -y -qq libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev xvfb xdotool > /dev/null && ok=1
            else
              cat apt-update.err >&2; echo "apt try $try: update failed or could not fetch an index"
            fi
            [ $ok = 1 ] && exit 0
            sleep 10
          done
          exit 1
      - run: npm ci
      - name: Build the installer
        shell: bash
        run: |
          cfg=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then cfg=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else echo "no signing key: no update files"; fi
          npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.make || matrix.bundles }} "${cfg[@]}"
        env:
          # only a v* tag run gets the key (the other runs use whichever workflow their branch has)
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      - name: Name it
        shell: bash
        # The update file is the installer itself on Windows and Linux; on macOS it is the .app, zipped by Tauri, which it only
        # makes when the app bundle is asked for next to the dmg (hence `make`).
        run: |
          ext="${OUT##*.}"
          mkdir -p out
          bundle=src-tauri/target/${{ matrix.target }}/release/bundle
          cp $bundle/${{ matrix.bundles }}/*.$ext "out/$OUT"
          if [ "$ext" = dmg ]; then
            cp $bundle/macos/*.app.tar.gz "out/${OUT%.dmg}.app.tar.gz" 2> /dev/null && cp $bundle/macos/*.app.tar.gz.sig "out/${OUT%.dmg}.app.tar.gz.sig" || echo "no update file"
          else
            cp $bundle/${{ matrix.bundles }}/*.$ext.sig "out/$OUT.sig" 2> /dev/null || echo "no update file"
          fi
          ls -l out
        env:
          OUT: ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bobix-update-${{ matrix.out }}
          path: |
            out/*.sig
            out/*.app.tar.gz
          if-no-files-found: ignore

      # ---------- macOS: the bundle, then the app itself ----------
      - name: macOS bundle
        if: runner.os == 'macOS' && matrix.smoke
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/bobix-dmg "out/${{ matrix.out }}"
          cp -R /tmp/bobix-dmg/Bobix.app "$RUNNER_TEMP/Bobix.app"
          hdiutil detach /tmp/bobix-dmg
          plist="$RUNNER_TEMP/Bobix.app/Contents/Info.plist"
          for k in CFBundleIdentifier CFBundleShortVersionString LSUIElement; do echo "$k: $(/usr/libexec/PlistBuddy -c "Print :$k" "$plist")"; done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = dev.bobix.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist")" = true
          du -sh "$RUNNER_TEMP/Bobix.app" "out/${{ matrix.out }}"
          echo "APP_BIN=$RUNNER_TEMP/Bobix.app/Contents/MacOS/$(ls "$RUNNER_TEMP/Bobix.app/Contents/MacOS")" >> "$GITHUB_ENV"

      # ---------- Windows: install the Electron build, then this one over it ----------
      - name: Windows upgrade from the Electron build
        if: runner.os == 'Windows' && matrix.smoke
        shell: bash
        run: |
          gh release download "$ELECTRON_TAG" -R "$GITHUB_REPOSITORY" -p Bobix-windows-x64.exe -D old
          keys() { reg query 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall' //s //f Bobix //d 2>/dev/null | grep -i -E 'DisplayName|^HKEY' || true; }
          ./old/Bobix-windows-x64.exe //S; sleep 20; taskkill //F //IM Bobix.exe > /dev/null 2>&1 || true
          echo "--- after the Electron build"; keys; ls "$LOCALAPPDATA/Programs" || true
          ./out/${{ matrix.out }} //S; sleep 20
          echo "--- after this build"; keys; ls "$LOCALAPPDATA/Programs" "$LOCALAPPDATA/Bobix" || true
          taskkill //F //IM bobix.exe > /dev/null 2>&1 || true
          if [ -d "$LOCALAPPDATA/Programs/bobix" ] || [ -d "$LOCALAPPDATA/Programs/Bobix" ]; then echo "the Electron build is still installed"; exit 1; fi
          test "$(keys | grep -c DisplayName)" = 1
          exe=$(ls "$LOCALAPPDATA"/Bobix/*.exe | grep -iv uninstall | head -1)
          echo "APP_BIN=$exe" >> "$GITHUB_ENV"

      # ---------- Linux: install the Electron .deb, then this one over it ----------
      - name: Linux upgrade from the Electron build
        if: runner.os == 'Linux' && matrix.smoke
        run: |
          gh release download "$ELECTRON_TAG" -R "$GITHUB_REPOSITORY" -p bobix-linux-amd64.deb -D old
          sudo apt-get install -y -qq ./old/bobix-linux-amd64.deb > /dev/null
          test -d /opt/Bobix
          sudo dpkg -i out/${{ matrix.out }} || sudo apt-get install -y -f -qq
          dpkg -s bobix | grep -E '^(Package|Version|Depends)'
          if [ -d /opt/Bobix ]; then echo "/opt/Bobix (the Electron build) is still there"; exit 1; fi
          echo "APP_BIN=$(command -v bobix)" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          for i in $(seq 1 50); do DISPLAY=:99 xdotool getdisplaygeometry > /dev/null 2>&1 && break; sleep 0.2; done # ready before the app starts
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Smoke the installed app
        if: matrix.smoke
        timeout-minutes: 4
        shell: bash
        env:
          BOBIX_SMOKE: smoke-out
          BOBIX_PORT: '4767'
        run: |
          export BOBIX_DATA_DIR="$RUNNER_TEMP/bobix-data" BOBIX_HOME="$RUNNER_TEMP/bobix-home"
          if [ "$RUNNER_OS" = Linux ]; then export XDG_SESSION_TYPE=wayland; fi
          echo "running $APP_BIN"
          "$APP_BIN" > smoke.log 2>&1 &
          for i in $(seq 1 120); do [ -f smoke-out/done ] && break; sleep 1; done
          if [ "$RUNNER_OS" = Windows ]; then taskkill //F //IM bobix.exe > /dev/null 2>&1 || true; else pkill -9 -f "$APP_BIN" || true; fi
          grep "\[bobix\]" smoke.log || tail -40 smoke.log
          node -e "const r = require('./smoke-out/report.json'); console.log(JSON.stringify(r, null, 2)); process.exit(r.pass ? 0 : 1)"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.smoke
        with:
          name: smoke-${{ matrix.out }}
          path: smoke-out/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: '[Bb]obix-*' # the installers and their update files, not the smoke reports
          merge-multiple: true
      # Fails here, before anything is published, when an update file or its signature is missing, the public key in the
      # app is the placeholder, the tag is not package.json's version, or a file was signed with another key.
      - name: Update list
        run: |
          mkdir -p lists
          node .github/scripts/update-manifest.mjs --dir out --tag "$GITHUB_REF_NAME" --base "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" --out lists/latest.json --conf src-tauri/tauri.conf.json --package package.json
          cp lists/latest.json lists/test.json
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: ${{ contains(github.ref_name, '-') }} # v0.2.0-rc.1 → test build, not "latest"
          make_latest: ${{ startsWith(github.ref_name, 'v0.1.') && 'false' || 'legacy' }} # a v0.1.x fix never takes "latest" from the 0.2 line: releases/latest/download/latest.json would stop existing
      # A stable release carries latest.json (releases/latest/download/latest.json is the stable list). Test builds read
      # test.json on the pre-release "test-channel": the newest build of any kind, so a test build also sees a release.
      - name: Publish the update lists
        run: |
          case "$GITHUB_REF_NAME" in *-*) ;; *) gh release upload "$GITHUB_REF_NAME" lists/latest.json --clobber ;; esac
          gh release view test-channel > /dev/null 2>&1 || gh release create test-channel --prerelease --target "$GITHUB_SHA" --title "Update list for test builds" \
            --notes "Not a version. This release only holds test.json, the list that Bobix reads when Settings → Get test builds is on. Install Bobix from the other releases."
          gh release upload test-channel lists/test.json --clobber
