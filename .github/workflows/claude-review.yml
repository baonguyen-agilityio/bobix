# An automatic code review by Claude (the code-review plugin) on pull requests from branches of this repository. It only
# comments: it never approves, merges or blocks, and it is not a required check. The owner creates the token
# (`claude setup-token`), stores it as the repository secret CLAUDE_CODE_OAUTH_TOKEN and installs the Claude GitHub App.
#
# It ends green without reviewing when:
#   - the secret is not set (a notice in the log says so),
#   - the pull request comes from a fork (GitHub withholds secrets from forks),
#   - the actor or the author is a bot, Dependabot included (the action refuses bot actors, and Dependabot has its own secrets),
#   - the pull request is a draft.
# With a secret that is expired or revoked, or the app not installed, the review step fails with a message: visible, not required.
name: claude-review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push to a pull request replaces the review still running for it.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !endsWith(github.actor, '[bot]')
      && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Is the review token set?
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Claude review skipped::The repository secret CLAUDE_CODE_OAUTH_TOKEN is not set, so there is no review. Nothing failed."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          fetch-depth: 1
      - name: Review
        id: review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-plugins-official.git'
          plugins: 'code-review@claude-plugins-official'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --model claude-opus-5-5
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
      - name: Say why the review failed
        if: failure() && steps.review.outcome == 'failure'
        run: echo "::error title=Claude review failed::The review did not run. Check that CLAUDE_CODE_OAUTH_TOKEN is valid (it may have expired; make a new one with claude setup-token) and that the Claude GitHub App is installed. This check is not required to merge."
