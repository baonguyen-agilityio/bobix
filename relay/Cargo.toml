[package]
name = "bobix-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Forwards end-to-end encrypted Bobix packets between a desktop and its phones; holds no key that opens one"
publish = false

[dependencies]
bobix-link = { path = "../crates/bobix-link" }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "http2", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
jsonwebtoken = "9"

[dev-dependencies]
tokio-tungstenite = "0.26"
